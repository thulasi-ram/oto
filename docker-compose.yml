name: oto

services:
  postgres:
    image: postgres:17-alpine
    container_name: oto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oto
      POSTGRES_PASSWORD: oto
      POSTGRES_DB: oto
      # Dev only. C locale keeps text sorting deterministic across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      - postgres
      - -c
      - max_connections=200
      # oto uses LISTEN/NOTIFY for the SSE bridge; keep the WAL settings honest.
      - -c
      - wal_level=logical
      - -c
      - log_min_duration_statement=500
    ports:
      - "5432:5432"
    volumes:
      - oto-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oto -d oto"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # A real Alertmanager is not needed to exercise the ingest path, but a real
  # alertmanager sending real webhooks is. This one routes EVERYTHING to oto
  # running on the host, so `amtool alert add ...` lands in the local database.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: oto-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --log.level=info
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # The receiver's URL and ingest token, as files. Gitignored and rendered
      # from .env by `just am-wire` — Alertmanager expands no environment
      # variables, so `url_file`/`credentials_file` is the only way to keep a
      # real credential out of the tracked config above.
      - ./deploy/alertmanager/local:/etc/alertmanager/local:ro
      - oto-amdata:/alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # Something that actually FIRES. Without it the stack can receive a webhook
  # but nothing produces one, so the fastest way to see oto do its job was to
  # write a Prometheus config by hand (git-bug d6d97de). This one scrapes oto's
  # own /metrics on the host, routes to the Alertmanager above, and loads a
  # deliberately always-true rule with a 15 s `for:` so an alert lands inside a
  # minute instead of only when something breaks.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: oto-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Dev only: 24 h is plenty to demonstrate the path and keeps the volume small.
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
      - --log.level=info
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The path SPEC §H.8 names for oto's self-alerting rules.
      - ./deploy/prometheus/oto-rules.yaml:/etc/prometheus/oto-rules.yaml:ro
      - oto-promdata:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------- profile: vm
  # An OPTIONAL VictoriaMetrics stack, off unless asked for (`just vm`, or
  # `docker compose --profile vm up -d`). It is the shape
  # docs/setup/victoriametrics.md describes: vmalert evaluates rules against a
  # VictoriaMetrics single-node and notifies the SAME Alertmanager as above —
  # never oto directly — so its alerts reach oto on the ordinary webhook path.
  # A source paired with it sets `prometheus_url` to vmalert (:8880), not to
  # VictoriaMetrics, because vmalert is what serves /api/v1/rules.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.153.0
    container_name: oto-victoriametrics
    restart: unless-stopped
    profiles: ["vm"]
    command:
      - -storageDataPath=/victoria-metrics-data
      # Dev only, like Prometheus's 24 h above.
      - -retentionPeriod=1d
      # Its own metrics, so the instance has real series to query at :8428/vmui.
      - -selfScrapeInterval=15s
    ports:
      - "8428:8428"
    volumes:
      - oto-vmdata:/victoria-metrics-data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  vmalert:
    image: victoriametrics/vmalert:v1.153.0
    container_name: oto-vmalert
    restart: unless-stopped
    profiles: ["vm"]
    command:
      - -rule=/etc/vmalert/rules/*.yml
      - -datasource.url=http://victoriametrics:8428
      # The Alertmanager above, by its compose service name.
      - -notifier.url=http://alertmanager:9093
      - -evaluationInterval=15s
      # What vmalert writes into every alert's generatorURL. It is the address
      # oto on the HOST can reach, so the default link
      # (/vmalert/alert?group_id=…&alert_id=…) is one oto can follow back to
      # this vmalert's /api/v1/rules. -external.alert.source is left at its
      # default deliberately: the default link carries no expression, and that
      # is the case worth exercising (docs/setup/victoriametrics.md §3).
      - -external.url=http://localhost:8880
    ports:
      - "8880:8880"
    volumes:
      - ./deploy/vmalert/rules.yml:/etc/vmalert/rules/rules.yml:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8880/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  oto-pgdata:
  oto-amdata:
  oto-promdata:
  oto-vmdata:
