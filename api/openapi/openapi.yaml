      summary: Probe a source's status endpoint
      tags: [Sources]
      description: |
        Read-only probe of the Alertmanager status endpoint. Reports the version, cluster state, measured
        clock skew, and each receiver's effective `send_resolved`.

        That last one matters more than it looks: a receiver with `send_resolved: false` can never tell
        oto that an alert ended, so every alert routed through it will eventually **expire** rather than
        resolve. oto raises a standing warning rather than letting you discover that months later.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: |
            The probe result. Note this is a `200` even when `ok` is false — the probe itself succeeded
            in reporting that the upstream is unreachable.
          content:
