  # =================================================================================================
  # Streaming
  # =================================================================================================

  /api/v1/stream:
    get:
      operationId: streamEvents
      summary: Live event stream (Server-Sent Events) with durable resume
      tags: [Streaming]
      description: |
        A `text/event-stream` of small change notices, so the UI updates without polling.

        ### Frame format

        ```
        id: 918274
        event: alert.upserted
        data: {"seq":918274,"kind":"alert.upserted","resource":"alert","id":"0198f3c1-…","org_id":"0198f3b0-…","at":"2026-08-07T09:20:12.443Z","data":{"state":"firing","severity":"critical","alertname":"HighErrorRate","last_seen_at":"2026-08-07T09:20:12.443Z"}}
        ```

        The SSE `event:` field carries the same value as the payload's `kind`, so a client may attach
        typed listeners per event name or one listener that switches on `kind`. The `data:` line always
        conforms to `StreamFrame`, and each `kind`'s payload has its own named schema.

        A **heartbeat** is sent every 15 seconds as a bare comment line — `: ping` — which keeps proxies
        from reaping the connection. It is not a frame and has no `data:`.

        ### Resume semantics

        `EventSource` sends `Last-Event-ID` automatically on reconnect, carrying the `id:` of the last
        frame it saw. On connect with `Last-Event-ID: N`, the server replays everything for this org with
        `seq > N` from the last 24 hours in ascending order, then attaches to the live feed. Closing a
        laptop for twenty minutes and reopening it therefore leaves the UI correct with no manual
        refresh.

        If the gap cannot be honoured — the events at or below it have aged out of the 24-hour window, or
        the gap exceeds 10 000 rows — the server sends a **single `resync` frame instead of a replay**
        and then attaches live. **A client receiving `resync` MUST refetch** the lists it is displaying;
        incremental state after that point is not trustworthy.

        `seq` is strictly monotonic but **not contiguous** — it is allocated from one counter across all
        orgs, so gaps are normal and must not be treated as loss.

        ### Backpressure

        Each connection has a bounded buffer. If a slow client overflows it, the buffer is dropped and a
        `resync` is sent. **oto never blocks a writer for a reader**: ingestion latency is never allowed
        to depend on a browser tab.

        Frames are also coalesced — at most one per resource per 250 ms per connection, latest wins — so
        a storm produces a usable stream rather than a flood.

        ### Scoping

        Everything is scoped server-side to the principal's own org, and a client cannot widen that.
        `resources`, `group_id` and `alert_id` only ever narrow the interest set.

        ### If SSE cannot get through

        Some proxies terminate long-lived responses regardless. Every stream-fed list endpoint accepts
        `?since_seq=<N>` as a polling fallback that returns the same information less efficiently.
      parameters:
        - name: resources
          in: query
          description: Comma-separated interest set. Omit for all of them.
          schema:
            type: array
            maxItems: 6
            uniqueItems: true
            items:
              type: string
              enum: [alerts, groups, cases, events, deliveries, sources]
          style: form
          explode: false
          examples:
            listView:
              value: [alerts, groups, events]
        - name: group_id
          in: query
          description: |
            Narrow the interest set to one group generation.

            ⚠️ **IT KEEPS THIS SPELLING AND IS NOT `conversation_id`, AND IT IS LIVE CODE RATHER THAN
            RESIDUE.** The `group_id` that `GET /api/v1/cases` once took is **deleted** — it selected
            on the dropped `alert_cases.group_id` column and is now `400 unknown_parameter` — so there
            is no longer a same-named filter here to be contrasted against. The distinction is worth
            keeping anyway, because it is what makes this parameter survivable: it is not a
            column filter and never was. The stream's interest set is a predicate over FRAMES, applied
            by `streaming/domain.Interest.Matches` on both the live and the resume path, and the
            `group.upserted` kind together with the `group_id` derived from a frame's payload are still
            in `UiEventKind` and still honoured. Renaming it here would publish a name the server does
            not read.

            ⛔ **What it no longer has is a screen.** The group detail page it was added for went with
            `alert_groups` (git-bug `7570090`), and the web client names `group.upserted` only to
            invalidate nothing — there is no cache entry left for it. So the axis narrows a stream that
            nothing currently publishes frames onto. Retiring the group axis from the streaming
            subsystem is its own change, and until it happens this parameter is described as it behaves
            rather than as it ought to be.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: alert_id
          in: query
          description: Narrow to one alert — for an alert detail page.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: Last-Event-ID
          in: header
          required: false
          description: |
            The `seq` of the last frame received. Sent automatically by `EventSource` on reconnect; set
            it manually only if you are implementing the protocol yourself.
          schema:
            type: integer
            format: int64
            minimum: 0
          examples:
            resume:
              value: 918273
      responses:
        '200':
          description: |
            The event stream. Sent with `Cache-Control: no-cache, no-transform`, `Connection:
            keep-alive` and `X-Accel-Buffering: no`, so intermediaries neither cache nor buffer it.
          headers:
            Cache-Control:
              schema:
                type: string
                examples: ['no-cache, no-transform']
            Connection:
              schema:
                type: string
                examples: [keep-alive]
            X-Accel-Buffering:
              description: Disables proxy buffering, without which frames arrive in useless bursts.
              schema:
                type: string
                examples: ['no']
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamFrame'
              examples:
                alertUpserted:
                  summary: 'Wire frame: event `alert.upserted`, id `918274`'
                  description: |
                    The `data:` line of one frame. On the wire this arrives as:

                    ```
                    id: 918274
                    event: alert.upserted
                    data: {"seq":918274,"kind":"alert.upserted", … }
                    ```
                  value:
                    seq: 918274
                    kind: alert.upserted
                    resource: alert
                    id: 0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b77
                    org_id: 0198f3b0-0001-7000-8000-000000000001
                    at: '2026-08-07T09:20:12.443Z'
                    data:
                      state: firing
                      severity: critical
                      alertname: HighErrorRate
                      namespace: payments
                      cluster_key: prod-eu
                      last_seen_at: '2026-08-07T09:20:12.443Z'
                      total_cases: 7
                      is_flapping: false
                eventAppended:
                  summary: 'Wire frame: event `event.appended`, id `918275`'
                  description: Enough detail to render a new timeline row without refetching.
                  value:
                    seq: 918275
                    kind: event.appended
                    resource: alert_event
                    id: 0198f3c1-6b02-7a55-9c10-4d5e6f708200
                    org_id: 0198f3b0-0001-7000-8000-000000000001
                    at: '2026-08-07T09:20:12.526Z'
                    data:
                      alert_id: 0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b77
                      case_id: 0198f3c1-6b02-7a55-9c10-4d5e6f708192
                      group_id: 0198f3c1-6c33-7f01-a2b3-c4d5e6f70819
                      type: case.opened
                      occurred_at: '2026-08-07T09:14:22.114Z'
                      recorded_at: '2026-08-07T09:14:22.526Z'
                      actor_kind: ingest
                      actor_label: null
                      summary: 'Case #7 opened — critical, prod-eu/payments'
                resync:
                  summary: 'Wire frame: event `resync`, id `918276`'
                  description: |
                    Sent instead of a replay when the gap is unreplayable, or when a slow connection
                    overflowed its buffer. **The client must refetch.**
                  value:
                    seq: 918276
                    kind: resync
                    org_id: 0198f3b0-0001-7000-8000-000000000001
                    at: '2026-08-07T09:20:31.004Z'
                    data:
                      reason: buffer_overflow
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # =================================================================================================
  # Identity
  # =================================================================================================

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with a local password and set the session cookie
      tags: [Identity]
      security: []
      description: |
        Local password login. On success an `oto_session` cookie is set and the current principal is
        returned, so the UI needs no second round trip.

        A failed login returns an unspecific `401` that does not reveal whether the account exists, and
        repeated failures are rate-limited.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in. Sets the session cookie.
          headers:
            Set-Cookie:
              description: '`oto_session=…; HttpOnly; Secure; SameSite=Lax; Path=/`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [Identity]
      security:
        - sessionCookie: []
      description: Revokes the session server-side and clears the cookie. Idempotent.
      responses:
        '204':
          description: Logged out. Clears the session cookie.
          headers:
            Set-Cookie:
              description: '`oto_session=; Max-Age=0; Path=/`'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/me:
    get:
      operationId: getCurrentPrincipal
      summary: The current principal, its org and that org's settings
      tags: [Identity]
      description: |
        Who am I, which org am I in, and how is that org tuned. The settings block carries the grace
        periods and flap thresholds the UI needs to explain its own damping decisions.
      responses:
        '200':
          description: The current principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/org/settings:
    get:
      operationId: getOrgSettings
      summary: The org's tuning, each value with its origin
      tags: [Identity]
      description: |
        The knobs that decide how loudly oto talks: `resolve_grace`, the flap thresholds and the fallback
        channel verbosity. (An unacked-reminder default was in this list and is deleted — migration `00068`, git-bug `bd0fb1d`: oto sends nothing unprompted.)

        **It returns three things, and all three are the point.**

        - `settings` — the **effective** value, the one oto is using right now: this org's overrides
          folded onto the shipped defaults and clamped to their bounds.
        - `origins` — per key, `default`, `org` or `config`. Returning the effective value alone is the
          version of configurability that is *worse than none*: a screen showing `600` cannot tell an
          operator whether their org chose 600, whether the deployment is forcing it, or whether they are
          riding oto's default, and those answers behave identically today and diverge the moment
          anything moves.
        - `config_keys` — for every key whose origin is `config`, **which environment variable or file
          key set it**. A badge reading "managed by configuration" with no key beside it tells an operator
          they cannot change the value here and nothing about where they can.
        - `shadowed` — this org's own overrides that are **not in force** because configuration is forcing
          something else. "You have an override of 900s, but configuration is forcing 600s" is actionable;
          hiding the 900 leaves a number in the database that nobody can see and that takes effect the
          moment somebody deletes the config key.
        - `bounds` — the server-side range of every integer key, **with the reason for it**, so a form can
          be generated from the same table the server rejects with and cannot offer a value the API will
          refuse.

        **Precedence is shipped default → org override → declarative configuration, highest last.**
        Declarative wins because that is the GitOps expectation: if it is in the values file, the values
        file is the truth, and anything else means the cluster drifts from the repository that is supposed
        to describe it.
      responses:
        '200':
          description: The effective tuning, its origins, its config keys, its shadowed overrides and its bounds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettingsViewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateOrgSettings
      summary: Change the org's tuning
      tags: [Identity]
      security:
        - sessionCookie: []
      description: |
        A **partial** write. Every field is optional and **an omitted key is left alone** — a settings API
        where omission silently reverted to the default would revert nine settings every time somebody
        changed one. To return a key to oto's shipped default, name it in `reset`; after that its origin
        reports `default` again. An unknown name in `reset` is rejected, never ignored: a typo'd key that
        was silently dropped is a reset the operator believes happened and did not.

        **The bounds are enforced here, on the server.** They are checked against the *merged* state, so a
        write cannot slip a value past by relying on a key it did not send, and the result is stored only
        if the whole merged state is legal. A `resolve_grace_s` of `0` is refused whatever a UI would have
        allowed — that value is a Slack thread per transition.

        **A key this deployment's configuration manages is refused with `409`**, and the problem's
        `violations` name the environment variable or file key that owns it. It is not accepted-and-ignored
        and it is not accepted-and-overridden-on-read: both of those store a number the operator will see
        in the database, never see in force, and have no way to explain when it "changes back" on the next
        deploy. A `reset` naming a managed key is refused for the same reason, and additionally because a
        reset would destroy the shadowed override underneath — the one value that returns if the config key
        is ever removed.

        **It takes effect immediately and everywhere.** Nothing between this write and the notify worker's
        next evaluation holds a copy of these numbers, so there is no restart, no cache flush, and no
        window in which one pod runs the old tuning and another the new.

        Requires a **session**: these numbers decide how much oto says and how much it withholds, and a
        leaked token must not be able to raise `flap_threshold` and make the tool go quiet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgSettingsRequest'
      responses:
        '200':
          description: The tuning as stored, with origins and bounds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettingsViewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            `409 setting_managed_by_config` — one or more of the keys named in this write are set by
            **this deployment's own configuration**, which beats an org override. Each `violation` carries
            the settings key in `field` and the config key that owns it in `message`; change it there, or
            remove that key to hand the setting back to this org.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/api-tokens:
    get:
      operationId: listApiTokens
      summary: List personal access tokens
      tags: [Identity]
      security:
        - sessionCookie: []
      description: |
        Lists tokens with their prefix and last-used time. **The secret is never shown** — only a hash of
        it is stored. Requires a session: a token cannot enumerate or mint its own siblings.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of tokens, without secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createApiToken
      summary: Create a personal access token
      tags: [Identity]
      security:
        - sessionCookie: []
      description: |
        Mint a token. **The secret is returned exactly once** and cannot be retrieved afterwards — only
        its hash is stored, so a lost token is replaced rather than recovered.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: The token and its one-time secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/api-tokens/{id}:
    delete:
      operationId: revokeApiToken
      summary: Revoke a personal access token
      tags: [Identity]
      security:
        - sessionCookie: []
      description: |
        Revocation takes effect within the credential cache TTL, at most 60 seconds.

        Revoking is idempotent by construction: repeating it succeeds and does not move the revocation
        timestamp, which is *when the credential stopped working*. Repeating it **with the same
        `Idempotency-Key`** is a `409 idempotency_key_reuse` instead — one key names one request, and
        this endpoint answers the header by the same rule as the two that mint a secret. A caller that
        means a second, separate revoke sends a second key.
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # =================================================================================================
  # Integrations
  # =================================================================================================

  /api/v1/integrations/slack/interactions:
    post:
      operationId: receiveSlackInteraction
      summary: Receive a Slack block-action payload
      tags: [Integrations]
      security:
        - slackSignature: []
      description: |
        Receives interactions from the alert card — the acknowledge and unacknowledge buttons, and the
        no-op acknowledgements every URL button still requires.

        **This is the only interactivity transport oto implements.** `slack.mode` still defaults to
        `socket`, but no Socket Mode client exists: a deployment that wants working buttons must set
        `OTO_SLACK_MODE=http`, configure a non-empty signing secret, and point the Slack app's
        **Interactivity Request URL** at this endpoint.

        Requests are authenticated by Slack's HMAC signature over the **raw** body, verified in constant
        time, with requests older than five minutes rejected to defeat replay. Every interaction is
        acknowledged within Slack's three-second window — including link buttons, so no user ever sees
        "This app is not responding".

        A button's `value` is an opaque identifier and is never trusted as a payload: authority comes
        from the signed envelope and the server-side lookup, never from the button.
      parameters:
        - $ref: '#/components/parameters/SlackTimestampHeader'
      requestBody:
        required: true
        description: |
          Slack posts `application/x-www-form-urlencoded` with a single `payload` field containing the
          JSON interaction envelope. The raw body is required verbatim for signature verification, so it
          must not be re-encoded before verification.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              additionalProperties: false
              properties:
                payload:
                  type: string
                  maxLength: 1000000
                  description: The URL-encoded JSON interaction envelope, as Slack sends it.
      responses:
        '200':
          description: |
            Acknowledged. The body is deliberately empty — Slack requires only a prompt 2xx, and any work
            the interaction implies happens on oto's own queues rather than inside this request.
          content:
            text/plain:
              schema:
                type: string
                maxLength: 0
        '401':
          description: |
            The signature is missing, malformed, does not verify against the raw body, or the request
            timestamp is outside the five-minute replay window.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # =================================================================================================
  # Ops (unversioned)
  # =================================================================================================

  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      tags: [Ops]
      security: []
      description: |
        Answers as long as the process is running. Deliberately says nothing about dependencies — a
        liveness probe that fails when the database is briefly slow restarts a healthy process and turns
        a blip into an outage.
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDTO'
              examples:
                ok:
                  value:
                    status: ok

  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      tags: [Ops]
      security: []
      description: |
        Reports whether the database is reachable and every migration has been applied. Used to gate
        traffic during a rolling deploy.
      responses:
        '200':
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyDTO'
              examples:
                ready:
                  value:
                    status: ready
                    database: ok
                    migrations: applied
                    schema_version: '00011'
        '503':
          description: Not ready. The body says which check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyDTO'
              examples:
                notReady:
                  value:
                    status: not_ready
                    database: unreachable
                    migrations: unknown
                    schema_version: null
                    detail: 'dial tcp 10.0.0.5:5432: connect: connection refused'

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus exposition
      tags: [Ops]
      security: []
      description: |
        Standard Prometheus text exposition. Among the metrics oto guarantees are
        `oto_ingest_accepted_total`, `oto_ingest_rejected_total{reason}`, `oto_ingest_duration_seconds`,
        `oto_clock_skew_seconds`, `oto_thread_order_decisions_total{action,reason}`,
        `oto_thread_gap_recovered_total{reason}`, `oto_thread_head_wait_seconds` and
        `oto_delivery_claim_lost_total{mode}`. Every name listed here is constructed by a collector in
        the tree and documented in `docs/runbooks/`.

        Do not write alert rules against names that are not exposed: a rule whose series never appears
        never fires, which is indistinguishable from a healthy system. Several counters promised by
        earlier drafts of this contract — `oto_reconcile_divergence`, `oto_source_degraded_holds_total`,
        `oto_notification_suppressed_total`, `oto_delivery_attempts_total`, `oto_delivery_dead_total`,
        `oto_render_invalid_total` and `oto_check_violation_total` — were never built. SPEC AC-34 and
        `docs/runbooks/README.md` record which durable fact answers each of those questions instead
        (mostly a column on `source_health`, `notifications` or `notification_deliveries`).
        `oto_thread_recovered_total` was renamed: it ships as `oto_thread_gap_recovered_total`.
      responses:
        '200':
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string

  /openapi.json:
    get:
      operationId: getOpenapiDocument
      summary: The published contract
      tags: [Ops]
      security: []
      description: |
        This document, served by the running server as JSON. A contract test asserts the running server
        matches it, and the TypeScript client and its runtime validators are generated from it — so a Go
        DTO that drifts from this file fails CI rather than surprising a browser.
      responses:
        '200':
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/version:
    get:
      operationId: getVersion
      summary: Build version, commit and schema version
      tags: [Ops]
      security: []
      description: Unauthenticated, so a deployment can be identified before anyone logs in.
      responses:
        '200':
          description: Build identification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: oto_session
      description: |
        Browser session cookie, set by `POST /api/v1/auth/login` and revoked by
        `POST /api/v1/auth/logout`. `HttpOnly`, `Secure`, `SameSite=Lax`.

        v1 has no RBAC, no roles and no SSO/OIDC: every authenticated principal has full access to its
        own org and no access to any other.
    bearerPat:
      type: http
      scheme: bearer
      bearerFormat: oto_pat_*
      description: |
        A personal access token, presented as `Authorization: Bearer oto_pat_…`. Created via
        `POST /api/v1/api-tokens`, which returns the secret exactly once. Scoped to one org, with the
        same access as a session.
    ingestToken:
      type: http
      scheme: bearer
      bearerFormat: oto_ingest_*
      description: |
        An ingest token, presented as `Authorization: Bearer oto_ingest_…`. **Scoped to exactly one
        `source_id`** and usable only on that source's ingest endpoint. An ingest token can never read
        an alert, list a source, or reach any other endpoint in this document. Issued by
        `POST /api/v1/sources` and rotated by `POST /api/v1/sources/{id}/rotate-token`.
    slackSignature:
      type: apiKey
      in: header
      name: X-Slack-Signature
      description: |
        Slack request signing. The receiver verifies `v0=HMAC-SHA256(signing_secret, "v0:" +
        X-Slack-Request-Timestamp + ":" + raw_body)` in constant time and rejects any request whose
        `X-Slack-Request-Timestamp` is more than five minutes old.

        Both headers are required; OpenAPI can only name one as the scheme, so
        `X-Slack-Request-Timestamp` is declared as an explicit parameter on the operation.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Resource identifier (UUIDv7).
      schema:
        $ref: '#/components/schemas/Uuid'

    SourceIdPathParam:
      name: source_id
      in: path
      required: true
      description: |
        The `AlertSource` this webhook belongs to. The presented ingest token MUST be scoped to this
        exact id; a token for another source is a `401`, never a `403`.
      schema:
        $ref: '#/components/schemas/Uuid'

    LabelNameParam:
      name: name
      in: path
      required: true
      description: A Prometheus label name.
      schema:
        $ref: '#/components/schemas/LabelName'

    CursorParam:
      name: cursor
      in: query
      required: false
      description: |
        Opaque keyset cursor, taken verbatim from `page.next_cursor` of the previous response. A cursor
        minted under a different filter set is rejected with `400 cursor_filter_mismatch` — reset
        pagination when the user changes a filter.
      schema:
        $ref: '#/components/schemas/Cursor'

    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum items to return in one page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50

    SinceSeqParam:
      name: since_seq
      in: query
      required: false
      description: |
        Polling fallback for environments where a proxy kills SSE. Returns only rows whose owning
        `ui_events.seq` is greater than `N`, so a client that cannot hold a stream open can poll the
        same list endpoint instead.

        > **Not accepted on the Alerts, Cases, Groups or Rules lists.** It was published there,
        > validated there, and then never applied: the alerts read model has no `ui_events` predicate,
        > so a client polling with it received the unfiltered list and had no way to tell. A parameter
        > that is documented and ignored is worse than one that does not exist, so it is gone from
        > those operations until the predicate is real. Where it still appears it is served.
      schema:
        type: integer
        format: int64
        minimum: 0
        examples: [918273]

    MatcherParam:
      name: matcher
      in: query
      required: false
      description: |
        The label selector in **Alertmanager matcher syntax** (ADR 0017) — the native idiom of this
        audience, and the only spelling that can carry a regular-expression operator:

        ```
        {namespace="payments", severity=~"critical|warning", tier!="canary"}
        ```

        The surrounding braces are optional. Values may be quoted or bare; a bare value may not contain
        a comma, a brace or whitespace. All four Alertmanager operators are accepted — `=`, `!=`, `=~`,
        `!~` — subject to the rule below. This parameter and `label[…]` may be used together and are
        AND-ed, so filter chips and a hand-typed selector compose rather than conflict.

        ### Which regular expressions are served, and why the rest are refused

        A `=~` or `!~` matcher is served **when its value is an alternation of literal values**, with
        optional `^` and `$` anchors: `severity=~"critical|warning"`, `tier!~"canary|staging"`. That is
        exactly an `IN` list, and it compiles to one indexed containment lookup per value — measured on
        60 000 alerts, a `BitmapOr` over two `Bitmap Index Scan`s of the label GIN index.

        **Anything else is rejected at parse time with a `422` naming the matcher.** A value containing
        a metacharacter — `.` `*` `+` `?` `(` `)` `[` `]` `{` `}` `\` — cannot use an index, and the
        same measurement gives it a `Seq Scan` over every alert in the org. Per ADR 0017 that is refused
        rather than served: a filter that works in staging and times out during an incident is worse
        than one that says no, and the error message states exactly which spellings do work.

        For a substring search use `q=`, which is backed by a full-text index.
      schema:
        type: string
        maxLength: 8192
      examples:
        alternation:
          summary: The ADR 0017 example — served, index-backed
          value: '{namespace="payments", severity=~"critical|warning"}'
        negatedAlternation:
          summary: Exclude two tiers at once
          value: 'tier!~"canary|staging"'
        refused:
          summary: Refused with 422 — a wildcard cannot use an index
          value: 'severity=~"crit.*"'

    SourceFingerprintParam:
      name: source_fingerprint
      in: query
      required: false
      description: |
        Comma-separated `source_fingerprint` values, matched exactly.

        **This is how a `group_by=fingerprint` roll-up bucket is opened.** `GET /api/v1/alerts/rollups`
        can bucket on three axes — `alertname`, `namespace` and `fingerprint` — and the first two have
        always had a matching list filter. Without this one the fingerprint bucket could be counted and
        never drilled into, which is the one thing a roll-up exists to let a user do: the bucket key
        goes straight back in here.

        The fingerprint is Alertmanager's own identity for a label set, **recomputed locally rather
        than trusted from the wire**, and it is the join key for upstream debugging — never oto's
        product identity. To ask "is this the same alert?" in oto's own terms, filter on `alert_key`
        by opening the alert directly.

        Pair it with `cluster=` when you have the cluster: the index that serves this filter leads with
        `(org_id, cluster_key, …)`, so the two together are a range read where the fingerprint alone is
        an org-scoped one.
      schema:
        type: array
        maxItems: 64
        uniqueItems: true
        items:
          $ref: '#/components/schemas/SourceFingerprint'
      style: form
      explode: false
      examples:
        oneFingerprint:
          summary: Drill into one roll-up bucket
          value: ['3f8c1a2b9d4e5f60']

    SnoozedParam:
      name: snoozed
      in: query
      required: false
      description: |
        Restrict to alerts whose notifications are currently snoozed, or exclude them.

        **This is the tab selector.** `false` is the main alert list; `true` is the **Quiet** tab,
        which is the same list, the same filters and the same three roll-up axes over the alerts oto
        is currently holding its tongue about. **Omitting it still includes both**, because a caller
        that asked no question must not be handed a filtered answer.

        Either way the question is put to the `alert_snoozes` row that is currently in force, never to
        a column on the alert. A snooze is a fact about oto's notification behaviour, never about the
        signal: a snoozed alert is still firing, still whatever severity it was, and every surface
        must keep rendering it that way.
      schema:
        type: boolean

    SyntheticParam:
      name: synthetic
      in: query
      required: false
      description: |
        Restrict to alerts oto manufactured for a **delivery drill**, or exclude them.

        **Omitting it EXCLUDES them, and that is not the same kind of default as `snoozed`.** A
        snoozed alert is a real thing happening in a real cluster: it is not dropped from the product,
        it is moved to a tab that names it and counts it. A synthetic alert is a rehearsal: nothing
        fired anywhere, and letting one into a default list would put oto's own plumbing into the
        customer's history and into every number derived from it.

        `synthetic=true` is normally reached from a drill's own result screen, not from the filter bar.
      schema:
        type: boolean

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key that makes a retried mutation safe. Replaying the same key with the same
        body within the retention window returns the original result rather than acting twice; replaying
        it with a *different* body is a `409`.

        **The retention window is 24 hours.** It is wide enough for the retries that actually happen —
        an HTTP client's retry budget, a proxy that gave up and was re-driven, a queued client draining
        after a network outage, an operator returning to a half-finished page — and no wider, because a
        claim that outlives the caller's memory of making it protects nobody. Beyond it a key is
        forgotten and re-sending it acts again.

        A key is private to the caller who sent it: claims are scoped to the org, the principal **and
        the operationId**, so one member's key never refuses another's request and one key can be used
        once per endpoint.

        ### The carve-out: endpoints whose response carries a secret

        `createSource`, `createApiToken`, `revokeApiToken` and `rotateSourceIngestToken` **refuse a
        replay rather than replaying it**, with `409 idempotency_key_reuse`. The reason is that "return
        the original result" is impossible to honour honestly here: the original result of a create or a
        rotate is a **plaintext credential** — an API token, or a source's ingest token — and oto stores
        only its hash, so the secret exists for the duration of one response and is gone. Replaying it would mean keeping every minted secret in the clear,
        addressed by a string the client chose, which is a worse exposure than the retry it protects
        against; minting a fresh one would hand out a second live credential whose secret went to a
        response that may never have arrived.

        So oto tells the caller the truth instead: **your first attempt succeeded**, here is the `id` of
        what it created, and the secret cannot be produced again. A caller that never received it
        revokes that id and retries with a **new** key — for `createSource` that id is the source, whose
        ingest token can then be rotated. `revokeApiToken` joins the same rule so the credential
        endpoints answer the header one way rather than three; it remains idempotent for callers that
        send no key at all.

        The bodyless operations here — `revokeApiToken` and `rotateSourceIngestToken` — identify a
        request by the resource in its path as well as by the key, so one key spent on two *different*
        targets is a `409` naming the reuse rather than a replay of a request the caller never made.

        The problem body names an `id`, and only when the first call created something. **It never
        contains a secret, and never a token prefix.**

        ### The second carve-out: endpoints that are idempotent by state machine

        `ackCase`, `unackCase`, `unsnoozeAlert` and `retryDelivery` are already safe to repeat without
        a key, because the state after N calls equals the state after one. They are therefore **not**
        given a replayed `200`. A keyed retry of one of them meets the settled state and gets a `412`
        whose problem `code` names it — `already_acked`, `not_acked`, `not_snoozed`, or
        `delivery_not_dead` — rather than a replay of the original response.

        **Treat those four codes as success-equivalent when you are retrying the same key.** They mean
        "the thing you asked for is already true", which is what a replayed `200` would have told you.

        Replaying a `200` here would be the *less* honest answer, not the more. A claim records only
        that a key was used and the `id` of what it created, never a response body, so a replayed `200`
        would have to be re-derived from current state — and `unackCase` legitimately round-trips
        ack → unack → ack, so a caller retrying an unack under one key could be shown a body describing
        a withdrawal that a later, deliberate re-acknowledgement has since undone.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        examples: ['01JD8Z2K7M3TQ9YB4V6H0XW5RE']

    SlackTimestampHeader:
      name: X-Slack-Request-Timestamp
      in: header
      required: true
      description: |
        Unix seconds, part of the Slack signature base string. Requests older than five minutes are
        rejected to defeat replay.
      schema:
        type: string
        pattern: '^[0-9]{10}$'

  responses:
    NoContent:
      description: Success. No body.

    BadRequest:
      description: |
        `400 malformed_request` — an unparseable body, an unknown query parameter
        (`unknown_parameter`), or a cursor that does not match the current filter set
        (`cursor_filter_mismatch`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unknown_parameter:
              $ref: '#/components/examples/ProblemUnknownParameter'
            cursor_filter_mismatch:
              $ref: '#/components/examples/ProblemCursorMismatch'

    Unauthorized:
      description: '`401 unauthenticated` — no credential, or a bad, expired or revoked one.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              $ref: '#/components/examples/ProblemUnauthenticated'

    Forbidden:
      description: |
        `403 forbidden` — cross-org access. In v1 this is the **only** cause of a 403: there are no
        roles and no scopes below the org boundary.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: '`404 not_found` — no such resource in the caller''s org.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not_found:
              $ref: '#/components/examples/ProblemNotFound'

    Conflict:
      description: |
        `409 conflict` — a unique violation on a key **the caller supplied** (an org slug, a channel
        name, a policy name, a cluster key), or a concurrent update. The caller must re-read and retry.

        A unique violation on a key *oto* computed (`alert_key`, `group_key`, the notification
        `idempotency_key` of §C.7) is never an error — it is the idempotency mechanism, and it is
        swallowed silently. Nothing below changes that: oto computed those keys, so a collision means
        oto already did the work and the caller was never asking a second question.

        A collision on a key **the client supplied** in the `Idempotency-Key` header is the opposite
        case, and on the endpoints that mint or revoke a credential it is answered `409` with
        `code: idempotency_key_reuse` rather than swallowed. The caller *did* ask a second time, and it
        is entitled to know that its first attempt already succeeded — see `IdempotencyKeyHeader` for
        why those responses cannot simply be replayed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            duplicate_name:
              $ref: '#/components/examples/ProblemConflict'
            idempotency_key_reuse:
              $ref: '#/components/examples/ProblemIdempotencyKeyReuse'

    PreconditionFailed:
      description: |
        `412 precondition_failed` — the request is well-formed and the caller has permission, but the
        entity is in the wrong state for it (acking a `resolved` case, retrying a delivery that is
        not `dead`, commenting on a purged timeline).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            case_terminal:
              $ref: '#/components/examples/ProblemPrecondition'

    PayloadTooLarge:
      description: '`413 payload_too_large` — the request body exceeded the endpoint''s hard cap.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    UnsupportedMediaType:
      description: '`415 unsupported_media_type` — `Content-Type` was not `application/json`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    UnprocessableContent:
      description: |
        `422 validation_failed` — the body parsed but is semantically invalid, or carries an unknown
        field. Always carries `violations[]`; the caller can fix it by changing the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation_failed:
              $ref: '#/components/examples/ProblemValidationFailed'
            provider_schema_failed:
              $ref: '#/components/examples/ProblemProviderSchemaFailed'

    RateLimited:
      description: |
        `429 rate_limited` — read-API throttling. **Never returned on the ingest path**, where 429 would
        cause Alertmanager to discard the notification permanently.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            format: int32
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalError:
      description: |
        `500 internal_error` — an oto bug. A database `CHECK` violation reaching this layer is always a
        500 and always alerts, because it means the validation layers above it have a hole.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    BadGateway:
      description: |
        `502 upstream_unavailable` — Alertmanager, Prometheus or Slack failed. An upstream failure is
        never reported as the caller's fault.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ServiceUnavailable:
      description: '`503 unavailable` — oto''s own backpressure (pool exhaustion, shedding).'
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            format: int32
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    GatewayTimeout:
      description: '`504 upstream_timeout` — an upstream took too long to answer.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    # ---------------------------------------------------------------------------------------------
    # Scalars and identity keys. Every pattern here is byte-identical to the DDL CHECK constraint
    # and the Go value-object constructor that also enforce it.
    # ---------------------------------------------------------------------------------------------

    Uuid:
      type: string
      format: uuid
      description: A UUIDv7. Time-ordered, so it sorts as a stable tiebreak alongside a timestamp.
      examples: ['0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b77']

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC with milliseconds.
      examples: ['2026-08-07T09:14:22.114Z']

    AlertKey:
      type: string
      pattern: '^ak_[0-9a-v]{26}$'
      description: |
        The identity of an Alert: 128 bits of SHA-256 over `(org_id, cluster_key, canonical labels)`,
        rendered as 26 lowercase base32hex characters. URL-safe and human-copyable.

        Scoped by cluster on purpose: the same label set in `prod-eu` and `prod-us` is two different
        Alerts, because they have different blast radii. Labels listed in the source's `ignore_labels`
        are still stored but are not hashed.
      examples: ['ak_9d3k1m7q4v0b2n8s5t6u1c3e7g']

    SourceFingerprint:
      type: string
      pattern: '^[0-9a-f]{16}$'
      description: |
        Alertmanager's own FNV-1a 64 fingerprint over the **full** label set, **recomputed locally
        rather than trusted from the wire**. It is the join key for API v2 reconciliation and for
        debugging against upstream — never the product identity. If the wire value disagrees with ours,
        we keep ours and record the mismatch.
      examples: ['3f8c1a2b9d4e5f60']

    GroupKey:
      type: string
      pattern: '^gk_[0-9a-v]{26}$'
      description: |
        oto's durable notification-group identity, hashed from
        `(org, cluster_key, alertname, namespace-or-∅)` — the alert's own labels, never Alertmanager's
        grouping (ADR 0038). **Fixed, not configurable**, and computed identically on the webhook and
        the reconciler paths, so it is unaffected by `alertmanager.yml` route edits — unlike
        Alertmanager's own `groupKey`. An absent `namespace` is its own partition, not an error.
      examples: ['gk_4b7n2p9v1c6d3f0h8j5k2m0q7s']

    RuleFingerprint:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: |
        Content address of a rule definition: SHA-256 over `expr`, `for`, `keep_firing_for` and the
        canonical rule labels and annotations. Two snapshots with the same fingerprint are the same
        rule; a change between cases is what `rule.definition_changed` reports.
      examples: ['c1f0a9b8e7d6c5b4a3928170f6e5d4c3b2a1908f7e6d5c4b3a29180f7e6d5c4b']

    ClusterKey:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
      description: |
        Identity/failure-domain key. **Participates in alert identity**, so its charset is load-bearing
        and is enforced identically in the DTO tag, the domain constructor and the DDL.
      examples: ['prod-eu']

    LabelName:
      type: string
      pattern: '^[a-zA-Z_][a-zA-Z0-9_]*$'
      maxLength: 1024
      description: |
        A Prometheus label name. Note this is **not** the same charset as a Kubernetes label key.
      examples: ['namespace']

    LabelMap:
      type: object
      additionalProperties:
        type: string
        maxLength: 4096
      maxProperties: 64
      description: |
        A label set. At most 64 entries, each value at most 4096 bytes, total serialised size at most
        16384 bytes (the last bound cannot be expressed in JSON Schema and is enforced server-side).
        Property names match `^[a-zA-Z_][a-zA-Z0-9_]*$`. `alertname` is always present.
      examples:
        - alertname: HighErrorRate
          cluster: prod-eu
          severity: critical
          team: payments
          namespace: payments
          instance: 'api-7f9c-2x4k:9100'
          job: api

    AnnotationMap:
      type: object
      additionalProperties:
        type: string
        maxLength: 16384
      maxProperties: 32
      description: |
        Free-text annotations. At most 32 entries, each at most 16384 bytes. Excess annotations are
        dropped and over-long values truncated at ingest rather than causing a rejection.
      examples:
        - summary: Error rate above 5% for 10m
          description: api-7f9c-2x4k error rate is 12.4%
          runbook_url: https://runbooks.example.com/HighErrorRate

    Cursor:
      type: string
      maxLength: 512
      description: |
        Opaque keyset cursor: base64url of `{"k":<sort key>,"id":"<uuid>","h":"<filter hash>"}`. Treat
        it as opaque — the encoding is not part of the contract, but the `h` binding is: a cursor whose
        filter hash does not match the current query is rejected with `400 cursor_filter_mismatch`.
      examples: ['eyJrIjoiMjAyNi0wOC0wN1QwOToxNDoyMi4xMTRaIiwiaWQiOiIwMTk4ZjNjMSJ9']

    # ---------------------------------------------------------------------------------------------
    # Closed enumerations. Each `enum` below is the same literal set as the Go typed constants and
    # the DDL CHECK for the same column.
    # ---------------------------------------------------------------------------------------------

    State:
      type: string
      enum: [firing, suppressed, resolved, expired]
      description: |
        What the world is doing. Owned by ingestion and the reconciler, never by a human.

        - `firing` — active and not suppressed.
        - `suppressed` — active but silenced, inhibited or muted. **Only the reconciler can set this**;
          Alertmanager's mute stage drops muted alerts before the webhook, so suppression is invisible
          to the ingest path.
        - `resolved` *(terminal)* — an explicit upstream `status="resolved"` was observed.
        - `expired` *(terminal)* — we stopped hearing about it while the source was healthy. **This is
          not a resolution** and the copy must never claim it is.
      examples: [firing]

    CaseState:
      type: string
      enum: [open, closed]
      description: |
        What ONE firing episode says about itself, and the whole of it: it is running, or it has
        ended. `alert_cases.state` holds these two values and no others.

        - `open` — the episode is live. `ended_at` is null, guaranteed by the `case_terminal_ended`
          CHECK.
        - `closed` *(terminal, and terminal means terminal)* — the episode ended. `resolve_reason`
          says whether upstream resolved it (`upstream`) or oto stopped hearing about it (`timeout`),
          and a closed case is never reopened: a re-fire opens the NEXT episode at `seq + 1`,
          unacknowledged.

        **It is not a narrower `State`.** `firing` and `suppressed` are not values missing from this
        enum; they are facts about the ALERT — a silence mutes a label set, not one episode of it — and
        they live on every alert-shaped object in this contract.
      examples: [open]

    AckState:
      type: string
      enum: [unacked, acked]
      description: |
        What humans have done. Orthogonal to `state`: an acked alert is still firing. Reset to `unacked`
        automatically when a new case opens.
      examples: [unacked]

    SuppressionReason:
      type: ['string', 'null']
      enum: [silence, inhibition, mute_time_interval, active_time_interval, null]
      description: |
        Why a case is suppressed. Non-null **if and only if** `state == "suppressed"`.

        > ### ⛔ These are **Alertmanager's four reasons and nothing else**
        >
        > This enum mirrors upstream. It will never gain `snoozed`: a snooze is a human asking *oto*
        > to be quiet, Alertmanager has never heard of it, and recording it here would report
        > *"Alertmanager is suppressing this"* about a fact that exists only in oto's database.
        > Snooze records itself as `NotificationSuppressedReason: snoozed` instead — oto's own
        > notification-suppression vocabulary, which is the company it belongs in. An alert that is
        > both silenced upstream and snoozed here shows **both**, because neither overrides the other.
      examples: [silence]

    ResolveReason:
      type: ['string', 'null']
      enum: [upstream, timeout, null]
      description: |
        Why a case ended. Non-null **if and only if** the state is terminal, and the two agree:
        `resolved` always pairs with `upstream`, `expired` always pairs with `timeout`.
      examples: [upstream]

    GroupState:
      type: string
      enum: [open, closed]
      description: |
        `open` while at least one member case is `firing` or `suppressed`; `closed` once no live
        member is left.

        ⚠️ This enum outlived the entity it described. `alert_groups` was deleted with the
        one-Case-per-conversation ruling, and `group_close_delay_s` — the setting that used to time the
        close, and the only thing that ever produced `closed` — was deleted with it as a knob that
        decided nothing. Nothing advances this state today.
      examples: [open]

    ActorKind:
      type: string
      enum: [system, ingest, reconciler, reaper, enricher, notifier, user, slack]
      description: Who caused an event. `user` and `slack` always carry an actor id and label.
      examples: [ingest]

    AlertEventType:
      type: string
      enum:
        - alert.created
        - alert.mutated
        - case.opened
        - case.reopened
        - case.suppressed
        - case.unsuppressed
        - case.resolved
        - case.expired
        - case.acknowledged
        - case.unacknowledged
        - alert.snoozed
        - alert.unsnoozed
        - group.opened
        - group.closed
        - group.member_joined
        - group.member_left
        - rule.snapshot_captured
        - rule.definition_changed
        - rule.lookup_failed
        - enrichment.completed
        - enrichment.failed
        - notification.created
        - notification.suppressed
        - delivery.sent
        - delivery.updated
        - delivery.failed
        - delivery.skipped
        - delivery.dead
        - comment.added
        - source.unreachable
        - source.recovered
        - source.clock_skew
      description: |
        The closed set of timeline event types. Clients should treat an unrecognised value as
        forward-compatible and render its `summary`, but the server never invents a type: adding one
        requires a specification amendment.

        `alert.snoozed` and `alert.unsnoozed` are the two snooze facts. They record what **oto's
        notification behaviour** did and say nothing about the signal: the alert was firing before the
        snooze, is firing during it, and is firing after it. `alert.snoozed` carries
        `{snooze_id, until, note, duration_seconds}`; `alert.unsnoozed` carries
        `{snooze_id, reason}` where the reason is `manual`, `expired` or `superseded`, and its
        `actor_kind` is `user` for the first two spellings and `system` for an expiry.

        Both are valid values of the `type=` filter on every timeline endpoint, which is how "show me
        every quiet period on this alert" is asked for.

        ⛔ **Four damper types were removed rather than retired.** `group.storm_started`,
        `group.storm_ended`, `alert.flapping_started` and `alert.flapping_ended` are gone from this
        enum and from `alert_events`. Storm damping is removed outright (ADR 0042): a storm is many
        *different* alerts arriving together, the thing that owns many different alerts is an
        **incident**, and that object does not exist yet — so the defence had nowhere to put what it
        detected and put it at delivery, where a withheld notification is indistinguishable from a
        signal that never fired. The two flap types named a detector that went **blind** rather than
        dead: the case retention window (`00057`) damps a flap at case formation, so the counted
        events fall below the threshold exactly when the alert is flapping hardest. Migration
        `00060_no_enum_remembers_a_damper.sql` narrows `ev_type_ck` to refuse all four spellings and
        performs no rewrite, so no migrated database can serve one.

        `group.member_joined`, `group.member_left` and `case.reopened` are **not** in that group. They
        are RETIRED — read but never written — and remain published here, because `ev_type_ck` still
        admits them and rows on disk still spell them.
      examples: [case.opened]

    NotificationReason:
      type: string
      enum:
        - fired
        - all_resolved
        - repeat
        - suppressed
        - unsuppressed
        - expired
        - refired
        - acked
        - unacked
        - snoozed
        - unsnoozed
        - enriched
        - rule_changed
        - comment
        - digest
      description: |
        Why a Notification exists. Distinct from Alertmanager's wire `notification_reason` string, which
        is mapped onto this enum on ingest.

        `digest` is the eighteenth value and the only one no transition produces. Every other reason
        names a change to ONE object; a digest is a **window over a namespace** — "what happened in the
        observability namespace in the last ten minutes, and don't bother me unless it was more than a
        trickle". It is minted by a TICK at each window boundary, from a policy carrying
        `digest_window_seconds`, and only when the count of firing episodes that opened inside the window
        clears the policy's `digest_floor`. A digest notification's `subject_kind` is `digest`, its
        `subject_id` is the POLICY, and it is the one notification with **no `group_id`** — it spans many
        generations, so it opens its own conversation per policy per channel with one reply per window
        (migration `00058_a_digest_is_a_window_over_a_namespace.sql`).

        ⛔ It is not a throttle and not a damper. A policy with a window sends its digest **in addition**
        to whatever else it routes, and alert-based and case-based policies gain no window at all: their
        noise is a signal to fix the Prometheus rule, and oto does not decide to be quiet about a firing.

        ⛔ **There is no `severity_raised`, and there was.** ADR 0020 proposed it as the purest case for
        broadcasting — a card going amber to red under a silent `chat.update` — and a migration was
        written for it. The premise does not survive SPEC §C.2: in Prometheus `severity` is an ordinary
        **label**, and the canonical label set is hashed into `alert_key`. Two severities of one rule are
        therefore **two Alerts**, with two identities, two rows and two threads. No row is ever `warning`
        and later `critical`, so nothing can observe a rise and nothing could ever write the value. It
        was removed rather than kept "just in case": an enum value with no writer misleads every client
        that switches on it.

        ⛔ `unacked_reminder` WAS HERE AND IS REMOVED (git-bug `bd0fb1d`, migration `00067`). It was
        oto's one reminder stage: the signal still firing and still unacknowledged, so oto said so once
        more in the existing thread. The owner withdrew it — **oto sends nothing unprompted** — and,
        oto being unreleased with the database reset, the value is DELETED rather than kept readable, so
        no client has to rule out a reason that can never arrive.

        It had itself replaced the value this enum spelled `escalation`, a scope-banned word (SPEC
        §A.1, CONTEXT.md §3) — an escalation is a ladder that ends at a person, and oto's one stage
        ended at a CHANNEL. **`escalation` remains banned**: it was banned for dragging in rotas and
        ownership, which is true whether or not oto reminds anyone. A client sending either value is
        rejected with 422 `unknown notification reason`.

        `snoozed` and `unsnoozed` announce a quiet period beginning and ending. They are the **only two
        reasons a snooze does not itself suppress** (§B.8.4): a damper that cannot announce itself is
        the silent suppression oto refuses to ship. Everything else for that alert — including
        `rule_changed`, which is otherwise never gated — is suppressed while the snooze holds, because
        a partial mute is a confusing mute.

        `repeat` is the single most important value: it means "nothing changed, this is a nag", and oto
        answers it by **updating the existing message and never posting a new one**.

        ⛔ **There is no `storm`, and there was.** It announced storm damping engaging — one group going
        quiet, plus a once-per-channel notice that oto had started withholding. Storm damping is removed
        outright (ADR 0042) and the value was briefly kept as retired so a stored row could still be
        rendered; migration `00060_no_enum_remembers_a_damper.sql` narrows `notifications_reason_ck` to
        the eighteen that remain, performing no rewrite, so no migrated database can serve one.
      examples: [fired]

    NotificationStatus:
      type: string
      enum: [pending, dispatched, partial, delivered, failed, suppressed]
      examples: [delivered]

    NotificationSuppressedReason:
      type: ['string', 'null']
      enum:
        - channel_disabled
        - no_policy
        - snoozed
        - throttled
        - below_threshold
        - verbosity
        - duplicate_render
        - null
      description: |
        Why a Notification produced no delivery. Non-null **if and only if** `status == "suppressed"`.
        Suppression is always recorded and always visible — oto's silence must never be
        indistinguishable from "no alert".

        **This is oto's own vocabulary, and it is not `SuppressionReason`.** The two are different
        facts about different systems and are deliberately two enums:

        - `SuppressionReason` mirrors **Alertmanager's four** reasons — `silence`, `inhibition`,
          `mute_time_interval`, `active_time_interval` — and lives on the *case*. It means
          *Alertmanager is not delivering this*.
        - This enum lives on the *notification* and means *oto chose not to send*.

        > ### ⛔ `snoozed` belongs **here** and must never be added to `SuppressionReason`
        >
        > A snooze is a human asking oto to be quiet. Recording it as an Alertmanager suppression
        > reason would make oto report *"Alertmanager is suppressing this"* about something
        > Alertmanager has never heard of — a lie about the world, in the one place whose job is to
        > mirror it. `state` never takes the value `snoozed` either. An alert that is both silenced
        > upstream and snoozed here shows **both** facts, because neither overrides the other.

        **The values are listed in precedence order.** When several apply, the **first match** is the
        one recorded. `snoozed` outranks the automatic dampers because it is a deliberate human act
        and therefore the most actionable explanation — "you snoozed this" tells an operator what to
        do, where "flapping" only tells them what happened. It sits below `channel_disabled` and
        `no_policy` because those two mean the message had nowhere to go at all, which is a truer
        account of why nothing was sent.

        ### `below_threshold` — the policy's count condition is not met **yet**

        A policy may carry `count_min` over `count_window_seconds`: *stay silent until at least this
        many of these have happened*. When the count falls short the fact is recorded and nothing is
        sent, with this reason. What is counted is the **distinct subjects of the one
        `subject_kinds` value the policy binds** — the binding is the count's unit — for that policy,
        over the sliding window `[now - count_window_seconds, now]`, including the fact being
        evaluated and including rows this same floor suppressed. So five re-fires of one Case count
        once, and a policy that is holding its tongue still climbs towards its own threshold.

        > It is **`throttled`'s dual**: the same two policy fields read as a floor instead of a
        > ceiling, which is why it ranks directly below it. A spent cap is an *active* fact — oto has
        > been speaking and stopped — while an unmet floor is the *resting* state of every policy
        > that carries one, and a resting state must not mask an active damper.
        >
        > ⛔ It is **not** the deleted `flapping` damper under a new name. That compared against
        > constants compiled into oto that nobody could see or change; this compares against a number
        > the operator wrote and can clear with one `PATCH`. A damper whose threshold is yours is
        > your request; a damper whose threshold is ours is our judgement, and oto publishes none.
      examples: [throttled]

    DeliveryMode:
      type: string
      enum: [post_root, update_root, thread_reply]
      description: |
        How one delivery materialises in the conversation. `update_root` is the primary mechanism;
        thread replies are the exception, gated by the channel's verbosity.
      examples: [update_root]

    DeliveryStatus:
      type: string
      enum: [pending, sending, sent, failed, dead, skipped]
      examples: [sent]

    DeliveryErrorClass:
      type: ['string', 'null']
      enum: [retryable, rate_limited, permanent, config_invalid, auth_expired, null]
      description: |
        The classification that drives retry policy — oto's own, never the provider's raw code.
        `retryable` backs off exponentially; `rate_limited` honours `Retry-After` exactly;
        `permanent`, `config_invalid` and `auth_expired` **never retry** and raise a UI banner. The last
        two are the difference between "Slack is flaky" and "your token was revoked three days ago and
        nobody noticed".
      examples: [rate_limited]

    ChannelType:
      type: string
      enum: [slack, webhook]
      description: |
        v1 ships exactly two providers. The generic webhook exists to prove the abstraction holds and is
        deliberately given no Slack-specific affordances.
      examples: [slack]

    RendererId:
      type: string
      enum: [default, slack.default, webhook.json]
      examples: [slack.default]

    Verbosity:
      type: string
      enum: [all, status_changes, firing_and_resolved, firing_only]
      default: status_changes
      description: |
        Which thread replies a channel receives. Root updates are **never** gated by verbosity.

        - `all` — every reply type.
        - `status_changes` *(default)* — ack, unack, suppressed, unsuppressed, expired, refired,
          all_resolved, rule_changed, comment.
        - `firing_and_resolved` — all_resolved, expired, rule_changed.
        - `firing_only` — rule_changed.

        `new_alerts` and `some_resolved` were in these levels and are gone (git-bug `7570090`).
        Both asserted a PLURALITY — "more of them started", "some of them stopped" — and a
        conversation now holds exactly one Case, which is one alert's firing episode, so neither
        has anything left to be about.

        `storm` used to be present at **every** level including the quietest, on the argument that a
        channel which asked for less has not asked to be lied to about oto withholding things. oto
        withholds nothing now — storm damping is removed (ADR 0042) and migration `00060` deletes the
        Reason — so there is no such reply to gate. Every reply listed here is still a reply, so
        `thread_updates: false` silences it — verbosity is a volume dial, never an override.

        A channel that names no verbosity falls back to its **org's** `default_verbosity`
        (`GET /api/v1/org/settings`), and only then to `status_changes`.
      examples: [status_changes]

    ChannelHealthStatus:
      type: string
      enum: [healthy, degraded, auth_failed, config_invalid, unknown]
      examples: [healthy]

    SourceKind:
      type: string
      enum: [alertmanager, grafana]
      examples: [alertmanager]

    SourceHealthStatus:
      type: string
      enum: [healthy, degraded, unreachable, unknown]
      description: |
        Gates the reaper. While this is anything other than `healthy`, cases are **held in their
        current state** and can never be expired — losing sight of an alert is not the alert resolving.
      examples: [healthy]

    RejectionReason:
      type: string
      enum:
        - too_many_labels
        - label_value_too_large
        - label_name_too_large
        - labelset_too_large
        - too_many_annotations
        - annotation_too_large
        - annotation_unstorable
        - missing_alertname
        - invalid_label_name
        - invalid_label_value
        - timestamp_out_of_window
        - too_many_alerts
        - body_too_large
        - undecodable
        - unknown_source
      description: |
        Why oto refused to normalise an element. The same closed set as the `ingest_rejections.reason`
        CHECK and the `reason` label of `oto_ingest_rejected_total`; adding a member takes a migration.

        Three of them do **not** mean the alert was dropped. `too_many_annotations` drops the excess
        and keeps the alert, `annotation_too_large` truncates the value and keeps it, and
        `timestamp_out_of_window` may clamp the timestamp rather than refuse the alert. The row is
        recorded either way, because a value oto quietly changed is a fact an operator is owed.

        `undecodable` means these bytes were not a webhook payload at all. It is deliberately never
        used for a payload that decoded and then failed a bound — `invalid_label_value` exists because
        that fallback once sent operators hunting for malformed JSON that was never there.
      examples: [label_value_too_large]

    FailedBatchStatus:
      type: string
      enum: [failed, partial]
      description: |
        The two states in which a batch's alerts are on disk and not in the product. `failed` gave up
        and carries an `error`; `partial` is mid-chunking and is resumable in principle.
      examples: [failed]

    IngestBatchMode:
      type: string
      enum: [push, reconcile, synthetic]
      description: |
        Which code path accepted the batch. It appears in no request body, so no upstream can forge
        one — which is why `synthetic`, the delivery-drill mark, is a mode rather than a label.
      examples: [push]

    RuleOrigin:
      type: string
      enum: [prometheus_api, generator_url, unavailable]
      description: |
        How the snapshot was obtained. `generator_url` means the expression was recovered by decoding
        `g0.expr` out of the alert's `generatorURL` with zero API calls — the robust primary path.
        `prometheus_api` additionally yields `for`, `keep_firing_for`, and the raw rule labels and
        annotations.
      examples: [prometheus_api]

    MatchConfidence:
      type: string
      enum: [exact, probable, ambiguous, none]
      description: |
        How confident the rule match is. `ambiguous` (two rules share an `alertname`) **must be surfaced
        in the UI and in Slack, never hidden and never silently guessed**.
      examples: [exact]

    EnrichmentStatus:
      type: string
      enum: [ok, partial, skipped, failed, timeout]
      description: |
        `timeout` is normal, not exceptional: the inline enrichment budget is a ceiling of 2000 ms, and
        a straggler is recorded as `timeout` while notification proceeds anyway.
      examples: [ok]

    EnrichmentPhase:
      type: integer
      format: int32
      enum: [1, 2]
      description: '`1` = inline (inside the pre-notification budget); `2` = async (result triggers an update).'
      examples: [1]

    EnrichmentSubjectKind:
      type: string
      enum: [alert, case, group]
      examples: [case]

    SilenceState:
      type: string
      enum: [active, pending, expired]
      examples: [active]

    MatcherOp:
      type: string
      enum: ['=', '!=', '=~', '!~']
      description: The four Alertmanager matcher operators.
      examples: ['=']

    SlackTs:
      type: string
      pattern: '^[0-9]{10}\.[0-9]{6}$'
      description: |
        A Slack message timestamp. **A foreign system's primary key: always a string, never a float.**
        The durable handle for a message is `(conversation_id, ts)`, and the conversation id always
        comes from the API *response*, never from the request.
      examples: ['1723023262.114300']

    # ---------------------------------------------------------------------------------------------
    # Envelopes and errors
    # ---------------------------------------------------------------------------------------------

    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
          maxLength: 64
          description: Correlates this response with server logs, traces and any problem document.
          examples: ['01JD8Z2K7M3TQ9']
        elapsed_ms:
          type: integer
          format: int32
          minimum: 0
          description: Server-side handling time.
          examples: [14]
      description: Present on every successful response.

    PageInfo:
      type: object
      required: [has_more, limit]
      properties:
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: Pass back as `?cursor=` to fetch the next page. `null` when `has_more` is false.
        has_more:
          type: boolean
          description: Whether another page exists.
          examples: [true]
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
          description: The page size actually applied.
          examples: [50]
      description: |
        Keyset pagination state. **There is deliberately no `total`**: counting an unbounded collection
        is a query oto refuses to make, and the UI is built to not need it.

    Violation:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          maxLength: 512
          description: |
            The offending field, as a `/`-separated path in **JSON** names — never Go names.
            `matchers[0].name` is reported as `matchers/0/name`; array indices are numeric segments;
            map keys appear verbatim; a top-level field has no separator. A failing query parameter is
            reported under its bare parameter name, including its brackets (`label[team]`).
          examples: ['matchers/0/name']
        code:
          type: string
          maxLength: 64
          description: |
            A stable machine code from a closed set, safe to switch on: `required`, `not_blank`, `min`,
            `max`, `min_length`, `max_length`, `min_items`, `max_items`, `exact_length`, `enum`, `uuid`,
            `email`, `url`, `gt`, `gte`, `lt`, `lte`, `field_order`, `duplicate_items`, `labelname`,
            `matcher_op`, `cluster_key`, `cursor`, `invalid`. Provider-config failures additionally use
            the JSON Schema keyword that failed (`type`, `pattern`, `minimum`, `maxLength`,
            `additionalProperties`).
          examples: [labelname]
        message:
          type: string
          maxLength: 500
          description: Human-readable and safe to display. Never contains a secret or a raw payload.
          examples: ['must be a valid Prometheus label name']
      description: One field-level validation failure. The UI maps `field` straight onto a form control.

    Problem:
      type: object
      required: [type, title, status, code, request_id]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
          description: A stable URI identifying the error class.
          examples: ['https://oto.dev/errors/validation_failed']
        title:
          type: string
          maxLength: 200
          examples: ['Validation failed']
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          examples: [422]
        detail:
          type: string
          maxLength: 2000
          description: Human-readable and safe to display. Never contains a secret or a raw payload.
          examples: ['3 fields failed validation.']
        instance:
          type: string
          description: The request path that produced this problem.
          examples: ['/api/v1/notification-policies']
        code:
          type: string
          maxLength: 64
          description: |
            The stable machine code. The taxonomy is closed and each value maps to exactly one status:
            `validation_failed` (422), `malformed_request` (400), `unauthenticated` (401), `forbidden`
            (403), `not_found` (404), `conflict` (409), `precondition_failed` (412),
            `payload_too_large` (413), `unsupported_media_type` (415), `rate_limited` (429),
            `internal_error` (500), `upstream_unavailable` (502), `unavailable` (503),
            `upstream_timeout` (504). More specific codes (`alert_not_found`, `case_terminal`,
            `cursor_filter_mismatch`, `unknown_parameter`, `idempotency_key_reuse`) refine these
            without changing the status.
          examples: [validation_failed]
        request_id:
          type: string
          maxLength: 64
          examples: ['01JD8Z2K7M3TQ9']
        violations:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Violation'
          description: |
            The members of the request the refusal is about, so a client can put the message on the
            control that produced it instead of printing prose. **Always** present on
            `validation_failed` (422).

            It is present on another code only when that refusal can name a member of the request:
            `unknown_parameter` and `source_id_required` (400) name the query parameter, and
            `setting_managed_by_config` (409) names the setting this deployment owns. A 400 is a
            request that never parsed, and *which* parameter was wrong is exactly the part a form
            can act on — withholding it there would leave the caller with prose for the plainest
            mistake there is.

            It is **never** present on a refusal that is not about a member of the request at all:
            401, 403, 404, 412, 413, 415, 429 and every 5xx. Its presence therefore never implies
            422, and a client must branch on `code`, not on this field.
        retry_after_seconds:
          type: integer
          format: int32
          minimum: 0
          description: Present on `rate_limited` and `unavailable`; mirrors the `Retry-After` header.
          examples: [5]
      description: |
        RFC 9457 `application/problem+json`. This is the **only** error shape oto emits, produced in
        exactly one place in the server so the mapping cannot drift.

        The taxonomy distinguishes four situations that are easy to conflate: **validation** means the
        caller can fix it by changing the request; **conflict** means the caller must re-read and retry;
        **precondition** means the request is valid but the entity is in the wrong state; and an
        **upstream failure** is never the caller's fault — a dead Alertmanager is a 502, never a 400.

    # ---------------------------------------------------------------------------------------------
    # Alerts
    # ---------------------------------------------------------------------------------------------

    AlertDTO:
      type: object
      required:
        - id
        - alert_key
        - source_fingerprint
        - alertname
        - cluster_key
        - labels
        - annotations
        - state
        - first_seen_at
        - last_seen_at
        - last_state_change_at
        - total_cases
        - flap_score
        - is_flapping
        - synthetic
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        alert_key:
          $ref: '#/components/schemas/AlertKey'
        source_fingerprint:
          $ref: '#/components/schemas/SourceFingerprint'
        alertname:
          type: string
          minLength: 1
          maxLength: 1024
          examples: [HighErrorRate]
        severity:
          type: ['string', 'null']
          maxLength: 4096
          description: |
            The promoted `severity` label, if the alert carries one. Deliberately **not** a closed enum:
            operators choose their own severity vocabulary and oto must not reject alerts for using it.
            The UI maps unknown values to a neutral presentation.
          examples: [critical]
        namespace:
          type: ['string', 'null']
          maxLength: 4096
          examples: [payments]
        service:
          type: ['string', 'null']
          maxLength: 4096
          examples: [checkout-api]
        cluster_key:
          $ref: '#/components/schemas/ClusterKey'
        labels:
          $ref: '#/components/schemas/LabelMap'
        annotations:
          $ref: '#/components/schemas/AnnotationMap'
        generator_url:
          type: ['string', 'null']
          format: uri
          maxLength: 8192
          description: The upstream link back to the query that produced the alert.
          examples: ['https://prometheus.example.com/graph?g0.expr=rate(errors%5B5m%5D)&g0.tab=1']
        state:
          $ref: '#/components/schemas/State'
        first_seen_at:
          $ref: '#/components/schemas/Timestamp'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        last_state_change_at:
          $ref: '#/components/schemas/Timestamp'
        total_cases:
          type: integer
          format: int32
          minimum: 0
          description: How many episodes this identity has had since it was first seen.
          examples: [7]
        flap_score:
          type: number
          format: float
          minimum: 0
          description: |
            EWMA of state transitions per hour. **A derived signal, never a state.**

            ⚠️ **RETIRED — this is a stored historical value and is no longer recomputed.** The job
            that maintained it is removed, so the number is the last score it wrote, at the time it
            wrote it. It is kept readable because a measurement taken at a time stays interpretable;
            it is not a statement about the alert now, and it will not change again.
          examples: [1.4]
        is_flapping:
          type: boolean
          description: |
            The last stored flapping verdict: true if the retired detector had marked this alert
            flapping when it was last evaluated (its threshold was 5 transitions in 2 hours).

            ⚠️ **RETIRED — read from the row, never written again, and never recomputed.** It was
            always a **visible** state and never a silent drop, and it stays visible: this field, the
            `flapping` filter and the roll-up counter all still report it. What no longer happens is
            detection — nothing re-evaluates it, and no notification is withheld, downgraded or
            digested because an alert is flapping. Flap noise is removed at case formation by the
            case retention window instead, which is why the detector was retired rather than tuned.
          examples: [false]
        synthetic:
          type: boolean
          description: |
            True for an alert oto manufactured for a **delivery drill** — a rehearsal of the
            notification path that an operator started by pressing a button. Nothing fired in any
            cluster.

            It is carried from the provenance of the ingest batch, never from a label: a label is
            forgeable by any upstream, and it participates in `alert_key`, so marking an alert with
            one would change its identity.

            **Every default read excludes these**, including this list, the roll-ups, the label
            typeaheads, the dashboard overview and the daily hygiene rollup — so an ordinary caller
            will only ever see `false`. Pass `?synthetic=true` to look at one, which is what a drill's
            result screen links to. The rows are deleted automatically a day after the drill settles.
          examples: [false]
        snooze:
          oneOf:
            - $ref: '#/components/schemas/SnoozeDTO'
            - type: 'null'
          description: |
            The snooze currently in force, or `null` when the alert is awake. **Always present**,
            including on list rows — `null` means *awake*, an absent key would mean *unknown*, and
            those are different answers.

            It sits **beside** `state` and the episode's `ack_state` and never inside them: the three
            are orthogonal axes. A non-null `snooze` on a `firing` alert means *oto is holding its tongue about
            something that is still happening* — render the alert as firing, at whatever severity it
            has, and the snooze as a separate `:zzz:` badge with a countdown to `snoozed_until`.

            **It is on the list row on purpose.** Snoozed alerts are not hidden from the default list
            (§B.8.6), so without this field a row could not say whether it was quiet and an operator
            would have to open every alert to find out — which is how a forgotten snooze becomes a
            missed incident. The server batch-loads it for the whole page; it costs no `include=`.
        current_case:
          oneOf:
            - $ref: '#/components/schemas/CaseDTO'
            - type: 'null'
          description: Present only when the request asked for `include=current_case`.
        enrichments:
          type: ['array', 'null']
          maxItems: 32
          items:
            $ref: '#/components/schemas/EnrichmentDTO'
          description: Present only when the request asked for `include=enrichments`.
        rule:
          oneOf:
            - $ref: '#/components/schemas/RuleSnapshotRefDTO'
            - type: 'null'
          description: |
            Present only when the request asked for `include=rule`, and a REFERENCE — see
            `RuleSnapshotRefDTO`. It is a **join key**, not a dead end: pass the page's ids to
            `GET /api/v1/rule-snapshots/batch` and the whole list can render `expr` and `for` in one
            further call. `GET /api/v1/alerts/{id}/rule` serves one snapshot whole, with its history.
      description: |
        An Alert — the **identity of a label set** within an org and cluster, not a single firing. It is
        created on first sight and survives every resolution; `state` here is a projection of the
        current (or most recent) case.

        **There is no `ack_state` on an Alert.** An acknowledgement is a receipt for **one firing
        episode** and stops being true the moment that episode ends — an Alert-scoped ack would let a
        March acknowledgement pre-acknowledge a September firing, so that firing would never reach
        anybody's queue. Ask `include=current_case` and read `ack_state` there; it is the same
        case read, so it costs no extra query.

    AlertDetailDTO:
      allOf:
        - $ref: '#/components/schemas/AlertDTO'
        - type: object
          required: [delivery_summary, enrichment_summary]
          properties:
            current_case:
              oneOf:
                - $ref: '#/components/schemas/CaseDTO'
                - type: 'null'
              description: The open case, or the most recent one if none is open.
            enrichment_summary:
              type: array
              maxItems: 32
              items:
                $ref: '#/components/schemas/EnrichmentSummaryDTO'
              description: One row per enricher that has run against the current case.
            rule:
              oneOf:
                - $ref: '#/components/schemas/RuleSnapshotRefDTO'
                - type: 'null'
              description: |
                A REFERENCE to the rule snapshot bound to the current case, exactly as on
                `AlertDTO` — ADR 0025 makes it a join key, not a dead end. `GET
                /api/v1/alerts/{id}/rule` serves the snapshot whole, with its history, and
                `GET /api/v1/rule-snapshots/batch` resolves a page of ids in one call.
            source:
              oneOf:
                - $ref: '#/components/schemas/SourceRefDTO'
                - type: 'null'
            group:
              oneOf:
                - $ref: '#/components/schemas/GroupRefDTO'
                - type: 'null'
              description: The group generation the current case belongs to.
            delivery_summary:
              $ref: '#/components/schemas/DeliverySummaryDTO'
      description: |
        One Alert expanded with its current case, its enrichment summary, the rule as it was at
        fire time, a delivery roll-up, and the snooze in force if any. The delivery roll-up is not
        decoration: **oto's silence must never be indistinguishable from "no alert"**, so every alert
        can show whether its notifications actually landed.

    CaseDTO:
      type: object
      required:
        - id
        - alert_id
        - seq
        - state
        - ack_state
        - started_at
        - last_observed_at
        - source_starts_at
        - observed_skew_ms
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        alert_id:
          $ref: '#/components/schemas/Uuid'
        seq:
          type: integer
          format: int32
          minimum: 1
          description: Episode number within the Alert, starting at 1.
          examples: [3]
        state:
          $ref: '#/components/schemas/CaseState'
        suppression_reason:
          $ref: '#/components/schemas/SuppressionReason'
        suppressed_by:
          type: object
          properties:
            silenced_by:
              type: array
              maxItems: 64
              items:
                type: string
                maxLength: 128
            inhibited_by:
              type: array
              maxItems: 64
              items:
                type: string
                maxLength: 128
            muted_by:
              type: array
              maxItems: 64
              items:
                type: string
                maxLength: 128
          description: |
            The upstream ids responsible for suppression, as reported by the Alertmanager v2 API. Empty
            unless `state == "suppressed"`.
        ack_state:
          $ref: '#/components/schemas/AckState'
        acked_by_label:
          type: ['string', 'null']
          maxLength: 120
          description: |
            Denormalised, immutable display name of whoever acknowledged. Acknowledgement identity is
            stored because it is operationally necessary; it is never aggregated per person.
          examples: ['Priya R.']
        acked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        ack_note:
          type: ['string', 'null']
          maxLength: 2000
          examples: ['Known deploy, rolling back']
        started_at:
          $ref: '#/components/schemas/Timestamp'
        ended_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Non-null **if and only if** the state is `closed`.
        last_observed_at:
          $ref: '#/components/schemas/Timestamp'
        source_starts_at:
          $ref: '#/components/schemas/Timestamp'
        source_ends_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            Upstream's claimed end time. Alertmanager sends the Go zero time for a firing alert; oto
            normalises that to `null` rather than to the year 1.
        duration_seconds:
          type: ['number', 'null']
          format: double
          minimum: 0
          description: '`ended_at - started_at`, or time-so-far when still open.'
          examples: [1830.5]
        resolve_reason:
          $ref: '#/components/schemas/ResolveReason'
        rule_snapshot_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The rule definition as it was **at this episode's fire time**.
        value:
          type: ['number', 'null']
          format: double
          description: The sample value that triggered the alert, when upstream reported one.
          examples: [12.4]
        observed_skew_ms:
          type: integer
          format: int64
          description: |
            Measured difference between oto's clock and upstream's for this observation. Skew is
            **measured and badged, never rejected** — which is why timelines order by oto's clock and
            display upstream's.
          examples: [412]
      description: |
        One **contiguous firing episode** of an Alert. This is what you acknowledge and whose firing
        duration is measured.

    CaseDetailDTO:
      allOf:
        - $ref: '#/components/schemas/CaseDTO'
        - type: object
          required: [delivery_summary, enrichments]
          properties:
            alert:
              $ref: '#/components/schemas/AlertRefDTO'
            group:
              oneOf:
                - $ref: '#/components/schemas/GroupRefDTO'
                - type: 'null'
            rule:
              oneOf:
                - $ref: '#/components/schemas/RuleSnapshotDTO'
                - type: 'null'
            enrichments:
              type: array
              maxItems: 32
              items:
                $ref: '#/components/schemas/EnrichmentDTO'
            delivery_summary:
              $ref: '#/components/schemas/DeliverySummaryDTO'
      description: One episode expanded with its alert, group, rule snapshot and enrichment results.

    CaseListItemDTO:
      allOf:
        - $ref: '#/components/schemas/CaseDTO'
        - type: object
          required: [alert]
          properties:
            alert:
              $ref: '#/components/schemas/AlertRefDTO'
      description: |
        One row of `GET /api/v1/cases`: a firing episode, plus the identity it belongs to.

        **`alert` is required and can never be null.** A Case carries `alert_id` and nothing else about
        the identity — `alertname`, `severity`, `cluster_key` and `namespace` describe the ALERT rather
        than the episode, and an episode that copied them would keep asserting them after a relabel.
        The server batch-loads the identities for the whole page in one further query, so a client can
        render the list without a request per row, and the query proves the alert is in the caller's
        organisation before the case is returned at all.

    CasePolicyDTO:
      type: object
      required: [id, namespace, alertname, retention_window_seconds, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        namespace:
          type: string
          maxLength: 1024
          description: |
            The grouping axis. **The empty string is the absent-namespace partition**, not a missing
            value: Prometheus treats an absent and an empty `namespace` label as equivalent, so they are
            one partition, and this is how that partition is spelled.
          examples: ['production']
        alertname:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            Mandatory, because it is mandatory on every alert and on every group key. There is no row
            without one: that would be an org-wide default, which this collection deliberately does not
            offer.
          examples: ['KubePodCrashLooping']
        retention_window_seconds:
          type: integer
          format: int32
          minimum: 0
          maximum: 86400
          default: 0
          description: |
            W. A case whose alert has resolved stays open for this long and closes only once the alert has
            stayed resolved for this long, so a re-fire inside W is an ordinary repeat observation on the
            still-open episode.

            `0` means the case closes on the resolve — what oto did before this collection existed, and
            what an absent row means. The ceiling is one day: a longer window keeps an episode open across
            a whole shift's worth of unrelated firings, which stops being noise reduction and starts being
            one case that means nothing.
          examples: [600]
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      description: |
        The **case retention window** for one `(namespace, alertname)` pair — the only per-pair shaping of
        the Case itself. `(namespace, alertname)` is the rule's identity and is unique within the org.

        ⛔ It is a **delayed close and never a reopen**: an episode still closes exactly once, and W moves
        *when* that happens rather than allowing a closed case to be resurrected.

    AlertRefDTO:
      type: object
      required: [id, alert_key, alertname, cluster_key, state]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        alert_key:
          $ref: '#/components/schemas/AlertKey'
        alertname:
          type: string
          minLength: 1
          maxLength: 1024
        severity:
          type: ['string', 'null']
          maxLength: 4096
        namespace:
          type: ['string', 'null']
          maxLength: 4096
        cluster_key:
          $ref: '#/components/schemas/ClusterKey'
        state:
          $ref: '#/components/schemas/State'
      description: |
        A compact Alert reference, embedded where a full `AlertDTO` would be wasteful. It carries no
        `ack_state` for the same reason `AlertDTO` does not: an ack belongs to the firing it was given
        for, and an Alert outlives its firings.

    AlertEventDTO:
      type: object
      required: [id, type, occurred_at, recorded_at, actor_kind, summary]
      # There is no `seq`. It was declared as "the stream sequence of the `ui_events` row this event
      # produced… lets a polling client resume with `?since_seq=`", and it was written by nothing —
      # while no operation that returns an AlertEventDTO accepts `since_seq` in the first place. The
      # two halves of a resume protocol were both missing, so a client following the documented
      # instructions read `null` forever and could never advance its cursor. Timelines page by
      # `cursor`, which is served.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        alert_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        case_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        group_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        type:
          $ref: '#/components/schemas/AlertEventType'
        occurred_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: |
            **The upstream claim, and the timestamp the UI displays.** May be skewed relative to
            `recorded_at`; that skew is measured and surfaced rather than corrected away.
        recorded_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: |
            **oto's own clock, and the timestamp the timeline is ordered by.** Ordering is
            `(recorded_at, id)`, which is why a skewed upstream can never make the timeline render out
            of order.
        actor_kind:
          $ref: '#/components/schemas/ActorKind'
        actor_id:
          type: ['string', 'null']
          maxLength: 128
          description: Present for `user` and `slack` actors.
        actor_label:
          type: ['string', 'null']
          maxLength: 200
          description: Denormalised and immutable, so a renamed user does not rewrite history.
          examples: ['Priya R.']
        summary:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            A pre-rendered one-line description, computed at write time. Clients may render this
            verbatim for any event type they do not specifically understand.
          examples: ['Case #3 opened — 4 instances firing']
        payload:
          type: object
          additionalProperties: true
          description: |
            Type-specific structured detail. The shape varies by `type` — for example
            `rule.definition_changed` carries a `RuleChangeDTO`-shaped diff, `delivery.failed` carries
            the provider error code and class, and `case.unacknowledged` carries
            `{"reason":"manual"|"new_case"}`. Treat unknown keys as forward-compatible.
      description: |
        One **immutable record of one thing that happened at one instant**. Never updated, never
        deleted; aged out only by dropping whole partitions. This is the timeline.

    EnrichmentDTO:
      type: object
      required:
        - id
        - subject_kind
        - subject_id
        - enricher
        - enricher_version
        - phase
        - status
        - payload
        - from_cache
        - duration_ms
        - computed_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        subject_kind:
          $ref: '#/components/schemas/EnrichmentSubjectKind'
        subject_id:
          $ref: '#/components/schemas/Uuid'
        enricher:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9]*)+$'
          maxLength: 64
          description: 'Stable enricher id. v1 ships exactly four: `prom.rule`, `runbook`, `alert.history`, `silence.match`.'
          examples: ['alert.history']
        enricher_version:
          type: integer
          format: int32
          minimum: 1
          description: Bumping this invalidates the cache and forces a re-run on the next case.
          examples: [2]
        phase:
          $ref: '#/components/schemas/EnrichmentPhase'
        status:
          $ref: '#/components/schemas/EnrichmentStatus'
        payload:
          type: object
          additionalProperties: true
          description: The enricher's typed result. Shape is per-enricher and versioned by `enricher_version`.
        warnings:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 500
        error:
          type: ['string', 'null']
          maxLength: 2000
          description: Non-null **if and only if** `status` is `failed` or `timeout`.
        duration_ms:
          type: integer
          format: int32
          minimum: 0
          examples: [143]
        from_cache:
          type: boolean
          examples: [false]
        computed_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      description: |
        One typed, **provenanced** result from one named, versioned enricher about one subject. Every
        result records which enricher produced it, at which version, in which phase, how long it took
        and whether it came from cache — so a wrong answer can always be traced to its producer.

    EnrichmentSummaryDTO:
      type: object
      required: [enricher, status, computed_at]
      properties:
        enricher:
          type: string
          maxLength: 64
          examples: ['silence.match']
        enricher_version:
          type: integer
          format: int32
          minimum: 1
        status:
          $ref: '#/components/schemas/EnrichmentStatus'
        headline:
          type: ['string', 'null']
          maxLength: 500
          description: A one-line rendering of the result, suitable for a detail-page summary row.
          examples: ['Silenced by priya@example.com until 11:30 — "deploy window"']
        computed_at:
          $ref: '#/components/schemas/Timestamp'
      description: A compact enrichment row for the alert detail view, without the full payload.

    SnoozeDTO:
      type: object
      required: [id, snoozed_at, snoozed_until, snoozed_by_label]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        snoozed_at:
          $ref: '#/components/schemas/Timestamp'
        snoozed_until:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: |
            When oto starts notifying again. **Never null.** A snooze without an end is a mute, and
            oto does not ship one; the window is always between 5 minutes and 30 days.
        snoozed_by_label:
          type: string
          maxLength: 120
          description: |
            Who asked for the quiet. A snooze is always attributed, because an unattributable quiet
            period is one nobody can be asked about.
          examples: ['priya@example.com']
        note:
          type: ['string', 'null']
          maxLength: 2000
          description: Why. Shown wherever the snooze is shown.
          examples: ['deploy window, expected until 17:00']
        ended_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Null while the snooze holds.
      description: |
        A snooze: **oto is not notifying about this alert until `snoozed_until`.**

        It is not a silence, not an inhibition and not a mute time interval — nothing here exists in
        Alertmanager, and oto wrote nothing into your cluster. It is not a `state` and not a
        `suppression_reason`: it is a third orthogonal axis, and a snoozed alert is still firing.

    SnoozeEndReason:
      type: string
      enum: [manual, expired, superseded]
      description: |
        How a snooze finished. Three endings that look identical from outside and are not:

        - `manual` — a human woke it early.
        - `expired` — the clock ran out, which is the ending every snooze has unless something
          intervenes.
        - `superseded` — a new snooze on the same alert replaced it.

    SnoozeHistoryDTO:
      allOf:
        - $ref: '#/components/schemas/SnoozeDTO'
        - type: object
          required: [active]
          properties:
            ended_reason:
              oneOf:
                - $ref: '#/components/schemas/SnoozeEndReason'
                - type: 'null'
              description: Null exactly while the snooze is still active.
            ended_by_label:
              type: ['string', 'null']
              maxLength: 120
              description: Who ended it. Null for `expired` — that ending has no human behind it.
            active:
              type: boolean
              description: Whether this is the snooze currently in force.
      description: |
        One row of an alert's snooze history. **Membership of a snooze is history, not a boolean:** the
        row survives its ending so a quiet period can be reviewed afterwards.

    ActiveSnoozeDTO:
      allOf:
        - $ref: '#/components/schemas/SnoozeDTO'
        - type: object
          required: [alert_id, alert_key, remaining_seconds]
          properties:
            alert_id:
              $ref: '#/components/schemas/Uuid'
            alert_key:
              $ref: '#/components/schemas/AlertKey'
            alert:
              oneOf:
                - $ref: '#/components/schemas/AlertRefDTO'
                - type: 'null'
              description: |
                The Alert this snooze mutes, as a compact reference — enough to recognise it and open
                it, never the whole row.

                Null when the Alert could not be read. **The snooze is still listed**: a quiet period
                whose subject is unreadable is still a quiet period somebody has to know about, and
                dropping the row would hide exactly what this endpoint exists to surface.
            remaining_seconds:
              type: number
              format: double
              minimum: 0
              description: |
                How much quiet is left, computed against **oto's** clock, so a client with a skewed
                clock cannot render a countdown that disagrees with the server about what is muted.
                Never negative.
              examples: [12480.5]
      description: |
        One quiet period currently in force, as the org-wide view lists it: the snooze, the alert it
        mutes, and how long is left.

        A snoozed alert is still firing and still whatever severity it was — read `alert.state` for
        what the world is doing, and this row only for what **oto's notifications** are doing.

    UnsnoozeOutcomeDTO:
      type: object
      required: [alert_id, outcome]
      additionalProperties: false
      properties:
        alert_id:
          $ref: '#/components/schemas/Uuid'
        outcome:
          type: string
          enum: [woken, skipped]
          description: |
            What happened to this one alert. `woken` means an active snooze was closed with
            `ended_reason: manual`; `skipped` means nothing was written and `reason` says why.
          examples: ['woken']
        reason:
          type: ['string', 'null']
          maxLength: 64
          description: |
            Why this alert was skipped — the stable error code the single-alert unsnooze would have
            refused with, and `null` when the alert woke.

            **"Nothing happened" has more than one honest explanation**, and a caller that has to tell a
            person which one it was cannot get that from a count. Two codes are produced today:
            `not_snoozed` (the alert was already awake) and `alert_not_found` (no such alert in this org —
            which is also the answer for another tenant's id, because distinguishing them would confirm
            that another tenant's row exists). Treat the set as open: a skip is keyed by the refusal's
            own stable code, so a new way to decline one id arrives here as a new code rather than as a
            new field.
          examples: ['not_snoozed']
      description: One alert's outcome in a bulk wake.

    UnsnoozeAlertsDTO:
      type: object
      required: [requested, woken, skipped, results]
      additionalProperties: false
      properties:
        requested:
          type: integer
          minimum: 1
          maximum: 100
          description: How many ids the request named. Always equal to `results.length`.
          examples: [2]
        woken:
          type: integer
          minimum: 0
          description: How many of them had an active snooze and now do not.
          examples: [1]
        skipped:
          type: integer
          minimum: 0
          description: |
            How many were left alone, for any of the reasons in `results[].reason`. `woken + skipped`
            equals `requested`: every named id is accounted for, in both directions.
          examples: [1]
        results:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/UnsnoozeOutcomeDTO'
          description: |
            One entry per id in the request, in the order the request gave them, so a surface can report
            per row rather than per request.
      description: |
        The account a bulk wake returns. It is an account rather than a count because a partial result
        is the normal one: an operator waking a page of quiet alerts will routinely find some of them
        already awake, and "3 of 5" is not something a bare number can explain.

    SnoozeRequest:
      type: object
      additionalProperties: false
      properties:
        until:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            The absolute instant the snooze ends. Must be between 5 minutes and 30 days from now.
        duration_seconds:
          type: ['integer', 'null']
          format: int64
          minimum: 300
          maximum: 2592000
          description: |
            The relative form the presets use — 1800, 3600, 14400, 86400, 604800 — resolved against
            **oto's** clock rather than the caller's, so a client with a skewed clock cannot talk its
            way outside the window.
          examples: [14400]
        note:
          type: ['string', 'null']
          maxLength: 2000
          description: Why the alert is being snoozed. Shown wherever the snooze is shown.
          examples: ['deploy window, expected until 17:00']
      description: |
        **Give exactly one of `until` and `duration_seconds`.** Both is a `422` and neither is a `422`:
        there is no indefinite snooze and therefore no default window. The bounds — minimum 5 minutes,
        maximum 30 days — are identical in this document, in the domain constructor and in the database
        CHECK constraint.

    UnsnoozeRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: ['string', 'null']
          maxLength: 2000
          description: Optional note recorded with the wake-up.
      description: The body of an unsnooze. Empty is valid; the whole body may be omitted.

    UnsnoozeAlertsRequest:
      type: object
      required: [alert_ids]
      additionalProperties: false
      properties:
        alert_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
          description: |
            The alerts to wake, named explicitly. **There is no filter form of this field and there will
            not be one:** a filter is evaluated against rows the caller never saw, and a wake that
            reaches further than the operator can see sends notifications nobody agreed to.

            The cap is 100 — one page of the UI's list, the same ceiling `batchGetRuleSnapshots` puts on the
            ids it will resolve in one call. Over it is a `422` naming this field. Duplicates are a
            `422` too, unlike the snapshot resolver's: this is a WRITE, and a repeated id is a caller
            that has lost track of what it is asking for rather than a page that has not changed.
          examples:
            - ['0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b77', '0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b78']
        note:
          type: ['string', 'null']
          maxLength: 2000
          description: |
            Optional note, recorded with every wake-up this request performs — the fan-out is of the
            primitive, note and all.
      description: |
        The body of a bulk wake. `alert_ids` is required and must name at least one alert: there is no
        spelling of this request that means "everything".

    AlertRollupDTO:
      type: object
      required:
        - key
        - group_by
        - state
        - total_count
        - firing_count
        - suppressed_count
        - resolved_count
        - expired_count
        - flapping_count
        - severity_counts
        - first_seen_at
        - last_seen_at
      properties:
        key:
          type: string
          maxLength: 4096
          description: |
            The bucket value: the alert name, the namespace, or the source fingerprint. Alerts carrying
            no `namespace` bucket under the empty string rather than being dropped.
          examples: [KubePodCrashLooping]
        group_by:
          type: string
          enum: [alertname, namespace, fingerprint]
          description: The axis this bucket was computed on, echoed so a response is self-describing.
        state:
          allOf:
            - $ref: '#/components/schemas/State'
          description: |
            The bucket's roll-up state: **a bucket is as alive as its liveliest member**, in the order
            `firing` → `suppressed` → `expired` → `resolved`.

            `expired` outranks `resolved` deliberately. "We stopped hearing about this" is an open
            question and "the upstream said it ended" is a closed one, and collapsing them would hide
            the more interesting of the two.
        total_count:
          type: integer
          format: int32
          minimum: 0
          examples: [47]
        firing_count:
          type: integer
          format: int32
          minimum: 0
        suppressed_count:
          type: integer
          format: int32
          minimum: 0
        resolved_count:
          type: integer
          format: int32
          minimum: 0
        expired_count:
          type: integer
          format: int32
          minimum: 0
        flapping_count:
          type: integer
          format: int32
          minimum: 0
          description: Members carrying the retired detector's last flapping verdict. RETIRED — nothing is damped on flapping, and the verdict is never recomputed (SPEC §B.6.2).
        severity_counts:
          type: object
          maxProperties: 64
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
          description: |
            Raw severity label to member count. **Raw, and deliberately unranked:** operators choose
            their own vocabulary (`sev1`, `P1`, `page`), so oto reports what the label says and leaves
            precedence to the client that knows the local convention.
          examples:
            - critical: 31
              warning: 16
        first_seen_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: The earliest `first_seen_at` in the bucket.
        last_seen_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: The most recent `last_seen_at` in the bucket.
      description: |
        One bucket of a server-side alert roll-up, counted over the **whole filtered result set**.

        > ### ⛔ A roll-up bucket was never an AlertGroup
        >
        > An `AlertGroup` *was* one generation of one Alertmanager notification group; it had a row, a
        > generation, and it owned a chat thread. This has none of those — it is a *view*, computed for
        > one query and gone. They were separate endpoints because they are separate concepts, and the
        > `AlertGroup` half is deleted (git-bug `7570090`) while this one is not.

    DeliverySummaryDTO:
      type: object
      required: [total, sent, failed, dead, skipped, pending]
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
        sent:
          type: integer
          format: int32
          minimum: 0
          description: |
            Delivered. A `skipped` delivery is counted here too when the read model does not separate
            them: it means the destination already shows exactly this content, which is a healthy quiet
            thread and not a failure.
        failed:
          type: integer
          format: int32
          minimum: 0
        dead:
          type: integer
          format: int32
          minimum: 0
        skipped:
          type: integer
          format: int32
          minimum: 0
          description: |
            Coalesced no-op updates, counted separately **where the read model records them
            separately**. `0` means "none recorded under that heading", never "none happened" — see
            `sent`.
        pending:
          type: integer
          format: int32
          minimum: 0
          description: |
            Queued plus in flight. Where the producing read model does not report it directly it is
            derived as `total - sent - failed - dead`, which is exact rather than approximate: those
            four and pending exhaust the delivery states.
        last_error_class:
          $ref: '#/components/schemas/DeliveryErrorClass'
        last_sent_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      description: |
        Delivery roll-up for one subject, so the UI can show **per alert** whether anyone was actually
        told. A non-zero `dead` count is a product signal, not a footnote.

        ⛔ **It is required on every detail response that carries one** — `GET /alerts/{id}`,
        `GET /cases/{id}` and `GET /notifications/{id}` — and an **all-zero roll-up is an answer,
        never an omission**. "Nobody has been told anything about this" is the single most important thing
        this object says: it is what a suppressed notification looks like, and what an alert no policy
        matched looks like. The field was declared on those schemas and emitted by none of them for
        as long as it was optional, which made oto's silence indistinguishable from "no alert" — the exact
        failure the field exists to prevent, hidden by the fact that every schema validator still passed.
        A fourth response carried it, `GET /alert-groups/{id}`, and went with `alert_groups` (git-bug
        `7570090`).

        Scope, per subject: an **alert's** roll-up covers the intents that name the alert *and* the
        intents about every Case of it, because `notifications.alert_id` is set only when an intent names
        a focus and counting those alone would report zero for almost every alert that fired. A Case
        belongs to exactly one alert, so reaching through them charges nothing to an alert the fact was
        not about. A **case's** is the same, narrowed to one episode and to the conversation that episode
        owns. A **notification's** is its own deliveries and nothing else.

    # ---------------------------------------------------------------------------------------------
    # Groups
    # ---------------------------------------------------------------------------------------------

    GroupRefDTO:
      type: object
      required: [id, group_key, generation, title, state]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        group_key:
          $ref: '#/components/schemas/GroupKey'
        generation:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 500
        state:
          $ref: '#/components/schemas/GroupState'
      description: A compact group reference.

    # ---------------------------------------------------------------------------------------------
    # Rules
    # ---------------------------------------------------------------------------------------------

    RuleSnapshotRefDTO:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
      description: |
        A POINTER to the rule snapshot that was captured at fire time, and nothing more.

        `include=rule` on an alert answers "which snapshot", not "what did it say". Two reasons, and
        both are deliberate. First, `RuleSnapshotDTO` carries `expr` (up to 64 KiB) plus the full
        label and annotation maps, and embedding that in every row of a 200-alert list is the payload
        explosion `include=` exists to make opt-in — a ref keeps the option usable. Second, the alerts
        module may not name the rules module's types (CONTEXT.md §5, layering rule 4/5), and a
        hand-copied fifteen-field duplicate of `RuleSnapshotDTO` living in `alerts/api` would be the
        second copy that drifts.

        **This is a join key and the list is not stuck with it.** `GET /api/v1/rule-snapshots/batch`
        takes a page's worth of these ids and returns the snapshots in **one** call, which is how the
        alert list renders `expr` and `for` without a request per row. ADR 0025 records the choice and
        the option rejected against it.

        `GET /api/v1/alerts/{id}/rule` serves one snapshot whole — with its **history**, which is the
        richer answer that endpoint is for.

    RuleSnapshotDTO:
      type: object
      required:
        - id
        - source_id
        - rule_fingerprint
        - rule_file
        - rule_group
        - rule_name
        - expr
        - for_seconds
        - keep_firing_for_seconds
        - rule_labels
        - rule_annotations
        - origin
        - match_confidence
        - candidate_count
        - captured_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        source_id:
          $ref: '#/components/schemas/Uuid'
        rule_fingerprint:
          $ref: '#/components/schemas/RuleFingerprint'
        rule_file:
          type: string
          maxLength: 4096
          description: Part of the RuleKey. Empty when the origin could not supply it.
          examples: ['/etc/prometheus/rules/api.yaml']
        rule_group:
          type: string
          maxLength: 4096
          description: Part of the RuleKey.
          examples: ['api-slo']
        rule_name:
          type: string
          minLength: 1
          maxLength: 1024
          description: Part of the RuleKey. Equal to the alert's `alertname`.
          examples: [HighErrorRate]
        expr:
          type: string
          maxLength: 65536
          description: |
            The PromQL expression **as it was at fire time**. Empty **if and only if** `origin` is
            `unavailable`.
          examples: ['sum(rate(http_requests_total{code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.05']
        for_seconds:
          type: number
          format: double
          minimum: 0
          description: 'The `for:` clause in **seconds** — `600` means `for: 10m`.'
          examples: [600]
        keep_firing_for_seconds:
          type: number
          format: double
          minimum: 0
          description: The `keep_firing_for:` clause in seconds.
          examples: [0]
        rule_labels:
          $ref: '#/components/schemas/LabelMap'
        rule_annotations:
          $ref: '#/components/schemas/AnnotationMap'
        origin:
          $ref: '#/components/schemas/RuleOrigin'
        prometheus_url:
          type: ['string', 'null']
          format: uri
          maxLength: 2048
          description: Non-null whenever `origin` is `prometheus_api`.
        match_confidence:
          $ref: '#/components/schemas/MatchConfidence'
        candidate_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            How many candidate rules matched. Agrees with `match_confidence` by construction:
            `none` → 0, `exact` → 1, `probable` → at least 1, `ambiguous` → at least 2.
          examples: [1]
        captured_at:
          $ref: '#/components/schemas/Timestamp'
      description: |
        A content-addressed capture of an alerting rule at a point in time — **the differentiator**.
        Because it is snapshotted at fire time rather than read live, an alert from six weeks ago still
        shows the threshold that was actually in force when it fired, even if the rule has since changed
        or been deleted.

    RuleChangeDTO:
      type: object
      required: [previous_snapshot_id, previous_fingerprint, previous_captured_at, expr_changed, for_changed]
      properties:
        previous_snapshot_id:
          $ref: '#/components/schemas/Uuid'
        previous_fingerprint:
          $ref: '#/components/schemas/RuleFingerprint'
        previous_captured_at:
          $ref: '#/components/schemas/Timestamp'
        expr_changed:
          type: boolean
        previous_expr:
          type: ['string', 'null']
          maxLength: 65536
        new_expr:
          type: ['string', 'null']
          maxLength: 65536
        expr_diff:
          oneOf:
            - $ref: '#/components/schemas/RuleExprDiffDTO'
            - type: 'null'
          description: |
            What oto was able to establish about **how** the expression changed — `null` exactly when
            `expr_changed` is `false`, which is a positive statement that no comparison was performed
            rather than an empty result. `previous_expr` and `new_expr` say *that* the expression moved;
            this says whether oto is willing to name the numbers that moved with it.
        for_changed:
          type: boolean
        previous_for_seconds:
          type: ['number', 'null']
          format: double
          minimum: 0
        new_for_seconds:
          type: ['number', 'null']
          format: double
          minimum: 0
        label_diff:
          type: object
          maxProperties: 64
          additionalProperties:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
              maxLength: 4096
          description: 'Label name → `[old, new]`. An empty string means the label was absent on that side.'
          examples:
            - severity: [warning, critical]
        annotation_diff:
          type: object
          maxProperties: 32
          additionalProperties:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
              maxLength: 16384
          description: 'Annotation name → `[old, new]`.'
      description: |
        A structured diff between the rule snapshot bound to this case and the one bound to the
        previous case of the same RuleKey. Emitted as a `rule.definition_changed` timeline event
        and always delivered to chat, regardless of channel verbosity — a threshold changing under you
        is never noise.

    RuleExprDiffDTO:
      oneOf:
        - $ref: '#/components/schemas/RuleExprNumbersMovedDTO'
        - $ref: '#/components/schemas/RuleExprStructuralDTO'
        - $ref: '#/components/schemas/RuleExprUncharacterisedDTO'
      discriminator:
        propertyName: verdict
        mapping:
          numbers_moved: '#/components/schemas/RuleExprNumbersMovedDTO'
          structural: '#/components/schemas/RuleExprStructuralDTO'
          uncharacterised: '#/components/schemas/RuleExprUncharacterisedDTO'
      description: |
        oto's characterisation of an expression change, as a **closed union of three verdicts**
        discriminated by `verdict`.

        It is a union rather than a verdict field beside an optional array because the third verdict is
        the point of the type. oto does not parse PromQL; it compares the two expressions lexically, and
        it will say **"changed, and I will not tell you how"** rather than emit a threshold claim it
        cannot stand behind. Widening `[5m]` to `[10m]` is not a threshold getting less sensitive, and a
        client that rendered `5 → 10` for it would tell an operator the opposite of the truth.

        The union is what makes that safety structural instead of documentary: `numbers` exists **only**
        on the `numbers_moved` variant, so there is no payload from which a client can render a
        threshold narrative that oto did not vouch for. Narrow on `verdict` first; there is no other
        door.
      examples:
        - verdict: numbers_moved
          numbers:
            - index: 0
              previous_value: 0.05
              new_value: 0.1

    RuleExprNumbersMovedDTO:
      type: object
      required: [verdict]
      properties:
        verdict:
          type: string
          enum: [numbers_moved]
        numbers:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/RuleExprNumberChangeDTO'
          description: |
            The literals that moved, in source order. **Absent or empty is meaningful and is not an
            error**: the two expressions are the same expression with the same numbers in it, so what
            changed was whitespace — a reformat, not an edit anyone need act on. Say that, rather than
            rendering an empty threshold list.
      description: |
        The two expressions are the same expression with different numbers in it. Every difference
        between them is a numeric operand oto identified with confidence, so — and *only* here — a
        "the threshold moved from X to Y" narrative is warranted.

    RuleExprStructuralDTO:
      type: object
      required: [verdict]
      properties:
        verdict:
          type: string
          enum: [structural]
      description: |
        The expressions differ in **shape**: a different metric, a different aggregation, a new label
        matcher, a term added or removed. Their numbers have no positional correspondence, so no numeric
        claim is offered and none can be reconstructed from this payload. Show `previous_expr` and
        `new_expr`; say nothing about thresholds.

    RuleExprUncharacterisedDTO:
      type: object
      required: [verdict]
      properties:
        verdict:
          type: string
          enum: [uncharacterised]
      description: |
        The expressions differ somewhere oto **refuses to guess**. The shape lines up, but the edit
        lands on a token oto cannot interpret with confidence — a range window, a subquery step, an
        `offset`, an `@` timestamp — either alone or mixed in with a genuine threshold edit. The claim
        is all-or-nothing, because reporting only the half that was understood is a partial truth that
        reads as the whole one.

        This is not a degraded `structural`, and copy must not present it as one: `structural` means
        *oto knows the shape moved*, this means *oto declines to say what moved*. Show both expressions
        and say so.

    RuleExprNumberChangeDTO:
      type: object
      required: [index, previous_value, new_value]
      properties:
        index:
          type: integer
          format: int32
          minimum: 0
          description: |
            0-based ordinal of the literal **among the literals oto vouched for**, in source order. It
            is not a character offset, and durations, subquery steps, `offset` operands and digits
            inside identifiers are not in this space at all. Under `numbers_moved` the two expressions
            are congruent, so the same index denotes the same literal on both sides — which is the only
            reason old and new may be compared at all.
          examples: [0]
        previous_value:
          type: number
          format: double
          description: The literal's value in the previous snapshot.
          examples: [0.05]
        new_value:
          type: number
          format: double
          description: The literal's value in the current snapshot.
          examples: [0.1]
      description: |
        One numeric literal whose value moved. Only ever reached through `numbers_moved`.

    RuleHistoryDTO:
      type: object
      required: [rule_key, current, versions]
      properties:
        rule_key:
          type: object
          required: [source_id, rule_name]
          properties:
            source_id:
              $ref: '#/components/schemas/Uuid'
            rule_file:
              type: string
              maxLength: 4096
            rule_group:
              type: string
              maxLength: 4096
            rule_name:
              type: string
              minLength: 1
              maxLength: 1024
          description: 'The identity across which drift is detected: `(source_id, rule_file, rule_group, rule_name)`.'
        current:
          oneOf:
            - $ref: '#/components/schemas/RuleSnapshotDTO'
            - type: 'null'
          description: The snapshot bound to the alert's **current case** — not the newest one upstream.
        change:
          oneOf:
            - $ref: '#/components/schemas/RuleChangeDTO'
            - type: 'null'
          description: The diff against the previous case's snapshot, when the definition changed.
        versions:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/RuleSnapshotDTO'
          description: Full version history for this RuleKey, newest first, each with its capture timestamp.
      description: |
        The rule bound to an alert's current case plus every version oto has ever captured for the
        same RuleKey.

    # ---------------------------------------------------------------------------------------------
    # Sources and clusters
    # ---------------------------------------------------------------------------------------------

    ClusterDTO:
      type: object
      required: [id, cluster_key, display_name, source_count, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        cluster_key:
          $ref: '#/components/schemas/ClusterKey'
        display_name:
          type: string
          minLength: 1
          maxLength: 120
          examples: ['Production EU']
        source_count:
          type: integer
          format: int32
          minimum: 0
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      description: |
        A logical identity/failure domain. `cluster_key` participates in alert identity, so changing it
        would change every alert key in the cluster — which is why it is immutable after creation.

    SourceDTO:
      type: object
      required:
        - id
        - cluster_id
        - name
        - kind
        - base_url
        - tls_skip_verify
        - inject_labels
        - ignore_labels
        - redact_labels
        - redact_annotations
        - push_enabled
        - reconcile_interval_seconds
        - ingest_path
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        cluster_id:
          $ref: '#/components/schemas/Uuid'
        cluster_key:
          $ref: '#/components/schemas/ClusterKey'
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Unique within the org, compared case-insensitively.
          examples: ['alertmanager-prod-eu']
        kind:
          $ref: '#/components/schemas/SourceKind'
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://[^\s]+[^/]$'
          description: The Alertmanager root, **without** a trailing slash.
          examples: ['https://alertmanager.example.com']
        prometheus_url:
          type: ['string', 'null']
          format: uri
          maxLength: 2048
          pattern: '^https?://[^\s]+[^/]$'
          description: |
            Optional, without a trailing slash. Supplying it enables full rule snapshots via the
            Prometheus rules API; without it oto falls back to decoding the expression out of
            `generatorURL`.
          examples: ['https://prometheus.example.com']
        tls_skip_verify:
          type: boolean
          default: false
        inject_labels:
          $ref: '#/components/schemas/LabelMap'
        ignore_labels:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LabelName'
          description: |
            Labels excluded from the alert-identity hash. They are **still stored** on the alert; they
            are merely not hashed. Changing this list does not re-key existing alerts — new identities
            are created, and that is documented behaviour rather than a bug.
          examples:
            - [prometheus_replica, __replica__, monitor, replica, pod_template_hash]
        redact_labels:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 256
          description: |
            Glob patterns. Matching label values are redacted **before the raw payload is written to
            disk**, so a secret in a label never lands.
        redact_annotations:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 256
          description: Glob patterns, applied to annotation values before persistence.
        push_enabled:
          type: boolean
          default: true
          description: Whether the webhook endpoint accepts batches for this source.
        reconcile_interval_seconds:
          type: integer
          format: int32
          minimum: 10
          maximum: 3600
          default: 30
          description: |
            How often the API v2 reconciler polls this source, in seconds.

            There is no companion `reconcile_enabled`: the reconciler runs for every source (ADR
            0006 and its second amendment; migration 00038 dropped the column). It is the only
            producer of `suppressed` AND the only thing that keeps `source_health` fresh, so a
            source with it switched off kept a frozen `healthy` verdict that the reaper went on
            trusting - and ended episodes, as `expired` / `resolve_reason=timeout`, for alerts that
            were merely silenced upstream. Poll a slow or distant Alertmanager gently by raising
            this number, up to an hour; a source oto genuinely cannot reach becomes `unreachable`,
            which blocks expiry for its alerts and is the honest answer.
        ingest_path:
          type: string
          description: The exact path to configure in this source's Alertmanager `webhook_config`.
          examples: ['/api/v1/ingest/alertmanager/0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b77']
        health:
          oneOf:
            - $ref: '#/components/schemas/SourceHealthDTO'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      description: |
        One configured upstream: an Alertmanager base URL, optionally paired with its Prometheus. All
        replicas of an HA Alertmanager pair must be registered against the same cluster, because HA
        replicas are the same failure domain and their duplicate webhooks are deduplicated by design.

        Credentials never appear here. The ingest token is returned exactly once, on creation or
        rotation, in a `SourceCreatedDTO`.

    SourceRefDTO:
      type: object
      required: [id, name, kind]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: '#/components/schemas/SourceKind'
        cluster_key:
          $ref: '#/components/schemas/ClusterKey'
        base_url:
          type: string
          format: uri
          maxLength: 2048
        health_status:
          $ref: '#/components/schemas/SourceHealthStatus'
      description: A compact source reference.

    SourceCreatedDTO:
      type: object
      required: [source, ingest_token]
      properties:
        source:
          $ref: '#/components/schemas/SourceDTO'
        ingest_token:
          type: string
          minLength: 20
          maxLength: 200
          pattern: '^oto_ingest_[A-Za-z0-9]+$'
          description: |
            **Returned exactly once and never retrievable again.** Only a SHA-256 hash is stored. Put it
            in the Alertmanager `webhook_config`'s `authorization` block. Losing it means rotating.
          examples: ['oto_ingest_A9kZ2mQ7pR4tX1vB6nL0sD3fH8jK5gY2']
        token_prefix:
          type: string
          pattern: '^oto_(pat|ingest)_[A-Za-z0-9]{4}$'
          description: The kind literal plus four characters, retained for display so the token can be identified later.
          examples: ['oto_ingest_A9kZ']
        webhook_url:
          type: string
          format: uri
          description: The absolute URL to paste into `webhook_config.url`.
          examples: ['https://oto.example.com/api/v1/ingest/alertmanager/0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b77']
      description: |
        A newly created or freshly rotated source, with its ingest token. **This is the only response
        that ever contains the secret.**

    SourceHealthDTO:
      type: object
      required: [source_id, status, consecutive_failures, clock_skew_ms, divergence_count, route_timings, warnings, updated_at]
      properties:
        source_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/SourceHealthStatus'
        last_push_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When a webhook batch was last accepted from this source.
        last_reconcile_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_reconcile_status:
          type: ['string', 'null']
          maxLength: 64
        last_error:
          type: ['string', 'null']
          maxLength: 2000
          description: Non-null whenever `status == "unreachable"`.
        consecutive_failures:
          type: integer
          format: int32
          minimum: 0
          description: At three consecutive failures the source becomes `unreachable` and the reaper is blocked.
          examples: [0]
        am_version:
          type: ['string', 'null']
          maxLength: 64
          description: Read from the Alertmanager status endpoint.
          examples: ['0.28.1']
        send_resolved:
          type: ['boolean', 'null']
          description: |
            Whether the matching receiver has `send_resolved` enabled. `false` is surfaced as a standing
            warning, because it means oto can never observe a resolution from this receiver and every
            alert will eventually expire instead. `null` means not yet determined.
          examples: [true]
        clock_skew_ms:
          type: integer
          format: int64
          description: |
            EWMA of observed skew between oto's clock and upstream's. **Measured and surfaced, never
            corrected away** — it is why events carry two timestamps.
          examples: [412]
        divergence_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            How many cases the last reconcile pass disagreed about. **This number is the canary
            for every correctness bug in the system**; a healthy deployment holds it near zero.
          examples: [0]
        route_timings:
          $ref: '#/components/schemas/RouteTimingsDTO'
        warnings:
          type: array
          maxItems: 32
          items:
            type: object
            required: [code, message]
            additionalProperties: true
            properties:
              code:
                type: string
                maxLength: 64
                examples: [send_resolved_false]
              message:
                type: string
                maxLength: 500
              subject:
                type: string
                maxLength: 256
                description: |
                  What the warning is about — a receiver name, a channel, a route — when the warning
                  is about one thing rather than the source as a whole.
                examples: [oto-webhook]
              since:
                $ref: '#/components/schemas/Timestamp'
          description: Standing, non-fatal problems that an operator should see in the UI.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      description: |
        Liveness, lag, skew and divergence for one source. This is not decoration: **health gates the
        reaper**, so an unreachable Alertmanager holds every case in place rather than letting oto
        conclude the alerts went away.

    TimingProvenance:
      type: string
      enum: [observed, default_applies, unknown]
      description: |
        Where one route timing's number came from.

        - `observed` — the value was **present in the source's own configuration**;
        - `default_applies` — the key was **absent**, so Alertmanager's documented default governs. The
          value is carried and this label says where it came from;
        - `unknown` — oto could not read or parse the configuration at all, so it cannot even say whether
          a value was stated. This is the only state that carries no number.

        ⛔ **`default_applies` must never render as `observed`.** Alertmanager does not publish its own
        defaults: `group_wait`, `group_interval` and `repeat_interval` are `omitempty` pointers and the
        30s / 5m / 4h values are applied later, in `dispatch.NewRoute`, where the status endpoint cannot
        see them. So a stock `alertmanager.yml` states none of the three — and reporting that as `unknown`
        made the tuning guidance useless for the commonest install while claiming to be the careful
        answer. Absence *is* an observation, and what it implies is documented.

        The arithmetic is equally valid for both: a 2m re-fire grace is just as unreachable under a
        defaulted 5m `group_interval` as under a configured one. What differs is **what the operator does
        about it** — edit a line in `alertmanager.yml`, or accept that no such line exists — which is why
        the two must stay distinguishable wherever they are shown.
      examples: [observed]

    RouteTimingDTO:
      type: object
      required: [provenance, value_ms]
      additionalProperties: false
      properties:
        provenance:
          $ref: '#/components/schemas/TimingProvenance'
        value_ms:
          type: ['integer', 'null']
          format: int64
          minimum: 0
          description: |
            The duration in force, in milliseconds. Null **exactly when** `provenance` is `unknown`.
            Milliseconds because `group_wait: 500ms` is legal and seconds would round it to "notify
            immediately"; `0` is a real setting and is never a stand-in for "not known".
          examples: [30000]
      description: One route timing with the provenance of its number.

    RouteTimingsDTO:
      type: object
      required:
        - group_wait
        - group_interval
        - repeat_interval
        - route
        - child_routes
        - child_routes_with_timings
        - receiver
        - receiver_basis
        - webhook_receivers
        - routes
        - routes_agree
        - routes_dropped
        - defaults_from_version
        - defaults_verified
        - observed_at
      additionalProperties: false
      properties:
        group_wait:
          $ref: '#/components/schemas/RouteTimingDTO'
        group_interval:
          $ref: '#/components/schemas/RouteTimingDTO'
        repeat_interval:
          $ref: '#/components/schemas/RouteTimingDTO'
        route:
          type: string
          enum: [top_level, oto_receiver]
          description: |
            Which route the three durations above describe.

            - `oto_receiver` — oto identified its own receiver **and** every route delivering to it agrees
              on all three, so these are the numbers actually in force for the alerts oto is sent. This is
              the answer its tuning arithmetic should use.
            - `top_level` — the **fallback**. What governs every alert matching nothing more specific,
              reported when oto could not name its own receiver (`receiver_basis` says why) or when the
              routes reaching it disagree (`routes_agree` is false). ⛔ It is a real answer about a real
              route and it is frequently *not* oto's, so a client must not render it as though it were.
        child_routes:
          type: integer
          format: int32
          minimum: 0
          description: How many descendant routes sit below the top-level one, at any depth.
        child_routes_with_timings:
          type: integer
          format: int32
          minimum: 0
          description: |
            How many of those descendants state a `group_wait`, `group_interval` or `repeat_interval` of
            their own. **A non-zero value here means the top-level route does not govern every alert**:
            these settings are per-route and inherited, so the values that actually apply depend on which
            route matched. `routes` below is that shape in full — this pair is the one-line summary of it.
        receiver:
          type: ['string', 'null']
          maxLength: 256
          description: |
            The receiver oto believes is **its own**, or null when it could not tell. `receiver_basis` says
            how it was decided.
          examples: ['oto']
        receiver_basis:
          $ref: '#/components/schemas/ReceiverBasis'
        webhook_receivers:
          type: array
          maxItems: 256
          items:
            type: string
            maxLength: 256
          description: |
            Every receiver in the configuration with a `webhook_configs` integration, in declaration order.
            With `receiver_basis: ambiguous` this is the **candidate list**, and it is what makes the
            ambiguity actionable instead of a shrug.
        routes:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ReceiverRouteDTO'
          description: |
            **Every delivering route in the tree**, in the order Alertmanager evaluates them, each with its
            inherited receiver, its inherited timings, its matcher path and whether it reaches oto.

            ⭐ **It is a list because the answer is a set.** `continue: true` lets several routes deliver to
            one receiver under different matchers with different timings, so there may be no single triple.
            A client must be able to say *"these two routes reach oto and disagree"* rather than silently
            picking one — see `routes_agree`.
        routes_agree:
          type: boolean
          description: |
            Whether every route reaching oto's receiver resolves to the same three durations. True when
            there is nothing to disagree — no identified receiver, or exactly one reaching route — so it is
            only ever false when there is a real conflict to show. **When it is false the three durations
            above are the top-level route's and describe none of the reaching routes.**
        routes_dropped:
          type: integer
          format: int32
          minimum: 0
          description: |
            How many delivering routes the parser's cap (64 routes, 16 levels deep) discarded. Non-zero
            means `routes` is incomplete and must be rendered as such rather than as the whole picture.
        defaults_from_version:
          type: ['string', 'null']
          maxLength: 64
          description: |
            The Alertmanager version any `default_applies` field is attributed to — the version the source
            itself reported where oto has one. Null when no field defaulted.
          examples: ['0.28.1']
        defaults_verified:
          type: boolean
          description: |
            False when the source runs a release newer than the one oto checked Alertmanager's constants
            against, or when the version could not be read. A client should then say "the default oto last
            verified" rather than asserting the source's own — the defaults are upstream constants oto
            copies, and a copy can go stale.
        observed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            When the configuration was last read off the source, and null **exactly when** nothing has ever
            been read — which is the same condition that makes all three `unknown`. Deliberately **not**
            `updated_at`, which moves on every probe including ones that could not reach the source at all;
            rendering that beside a stale reading would claim it is fresh.
      description: |
        What governs an Alertmanager's batching, and **how oto knows** — read from `config.original` on the
        status call oto already makes, per field, with its provenance.

        **Observed or derived, never typed in.** Every oto tuning knob is a function of these three
        numbers: a `resolve_grace` below one `group_interval` expires a case between two batches of the
        same incident; a `flap_window` below `group_interval` cannot contain two observable transitions; a
        `flap_threshold` above the observable ceiling is dead code that looks correctly configured. Asking an operator to enter them
        by hand produced an answer that was unshared, unvalidated, and silently wrong the moment somebody
        edited `alertmanager.yml`.

        ⚠️ **These settings are per-route and inherited**, so the numbers governing the alerts *oto* is sent
        are the ones on the route delivering to oto's own receiver — usually not the top-level route on any
        Alertmanager that overrides anything. oto walks the whole tree (`routes`) with Alertmanager's own
        semantics: inheritance from the nearest ancestor that states a value, `dispatch.Route.Match`'s rule
        that a route delivers only when no child matched, evaluation order with `continue: true`, and the
        shadowing a matcher-less sibling causes. The three durations above are that route's whenever
        `route` is `oto_receiver`.

        ⛔ **Nothing here evaluates a matcher against a label set, and nothing may.** Deciding which route a
        *particular* alert takes needs that alert's labels and would be a second, invisible implementation
        of somebody else's routing engine. Everything reported is **structural** — true for every alert.
        Where structure cannot decide, the answer stays a set and is shown as one.

    ReceiverBasis:
      type: string
      enum: [sole_webhook, ambiguous, no_webhook, unknown]
      description: |
        **How oto decided which receiver is its own** — an inference, and labelled as one.

        ⛔ **The obvious method is closed, and it is worth knowing why.** oto's ingest path is
        `/api/v1/ingest/alertmanager/{source_id}`, so the webhook URL in an operator's config literally
        contains the id of the source oto is probing; it would identify oto's receiver exactly. It is
        unavailable: `webhook_config.url` is a `SecretURL` and `config.original` is the *marshalled* config,
        so every secret arrives as the literal string `<secret>`. This is verified rather than assumed — the
        checked-in `internal/sources/client/alertmanager/testdata/compose_v0.28.1.yaml` is a real capture of
        oto's own compose Alertmanager and reads `url: <secret>`.

        - `sole_webhook` — exactly one receiver in the whole configuration has a webhook integration, so
          that receiver is oto's. This is the shape the setup guide produces (the receiver block is the
          entire Alertmanager change oto requires), so the common install is answered exactly.
        - `ambiguous` — several receivers have webhook integrations and the URLs that would tell them apart
          are redacted. oto reports **every** route and names the candidates in `webhook_receivers` rather
          than picking one; picking would be a coin toss presented as a reading.
        - `no_webhook` — no receiver has a webhook integration at all, so nothing in this configuration can
          push to oto. That is a real finding about a source, not a parser shortfall.
        - `unknown` — the configuration has never been read, so there is not even a receiver list to reason
          about. This is the same condition that makes `observed_at` null.
      examples: [sole_webhook]

    RouteStepDTO:
      type: object
      required: [matchers, deprecated, continue]
      additionalProperties: false
      properties:
        matchers:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 512
          description: |
            This route's **own** matchers, normalised into Alertmanager's current `matchers` spelling and
            sorted, so they can be pasted into `amtool`. **Empty means the route states none**, and
            therefore takes everything its parent gives it — which is the one structural fact that decides
            reachability.
          examples: [['severity="critical"']]
        deprecated:
          type: boolean
          description: |
            Whether the route spelled its matchers with the deprecated `match` / `match_re`. Both still
            route production traffic, so oto reads them; it renders the current spelling and says where it
            came from rather than quietly rewriting the operator's file in the display.
        continue:
          type: boolean
          description: |
            This route's `continue`. **It is the reason several routes can reach one receiver**: evaluation
            does not stop at a match that sets it, so later siblings are still considered.
      description: One route on the path from the top-level route, as an operator would recognise it.

    InheritedTimingDTO:
      type: object
      required: [provenance, value_ms, from_depth]
      additionalProperties: false
      properties:
        provenance:
          $ref: '#/components/schemas/TimingProvenance'
        value_ms:
          type: ['integer', 'null']
          format: int64
          minimum: 0
          description: The duration in force for this route, in milliseconds.
          examples: [300000]
        from_depth:
          type: ['integer', 'null']
          format: int32
          minimum: 0
          description: |
            The index into this route's `path` of the route that **stated** the value, or null when no
            route on the path states it (`provenance` is then `default_applies`).

            ⭐ **Not decoration.** `group_interval: 5m` inherited from the top-level route and
            `group_interval: 5m` stated on this route send an operator to two different lines of their own
            file, and only the second survives them editing the child. `from_depth == len(path) - 1` means
            "this route states it itself".
          examples: [0]
      description: |
        One route timing with its provenance **and** the route on the path that stated it. `provenance` is
        never `unknown` here: a route appears in the list only because oto read the configuration that
        declares it, so "we could not look" cannot arise.

    ReceiverRouteDTO:
      type: object
      required:
        - receiver
        - path
        - group_wait
        - group_interval
        - repeat_interval
        - group_by
        - group_by_all
        - reaches_oto
        - unreachable
      additionalProperties: false
      properties:
        receiver:
          type: string
          maxLength: 256
          description: The receiver this route delivers to, after inheritance.
          examples: ['oto']
        path:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/RouteStepDTO'
          description: |
            The route chain from the top-level route (index 0) down to this one. Never empty — the top-level
            route is itself a path of length one.
        group_wait:
          $ref: '#/components/schemas/InheritedTimingDTO'
        group_interval:
          $ref: '#/components/schemas/InheritedTimingDTO'
        repeat_interval:
          $ref: '#/components/schemas/InheritedTimingDTO'
        group_by:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 256
          description: The effective grouping labels for this route, inherited.
        group_by_all:
          type: boolean
          description: |
            The `group_by: ['...']` form. Worth surfacing beside the numbers because **no number captures
            it**: grouping by every label means no group ever accumulates a second member, so a group is
            never more than one alert and grouping buys nothing.
        reaches_oto:
          type: boolean
          description: |
            Whether this route delivers to the receiver oto believes is its own. **False for every route
            when oto could not identify one** — which is exactly when a client should show the whole list
            and say why.
        unreachable:
          type: boolean
          description: |
            Whether an earlier matcher-less sibling without `continue` consumes everything before this route
            is evaluated, so it can never fire. It is the only unreachability provable without labels, and
            it is a real misconfiguration rather than a display detail.
      description: |
        One route that **delivers** to a receiver, fully resolved.

        "Delivers" is Alertmanager's own rule from `dispatch.Route.Match`: a route is the answer only when
        **no child of it matched**, so a route with a matcher-less child never delivers anything itself.
        Nothing here evaluates a matcher against a label set — every field is structural and therefore true
        for every alert.

    SourceTestDTO:
      type: object
      required: [ok, checked_at]
      properties:
        ok:
          type: boolean
          description: Whether the Alertmanager status endpoint answered successfully.
        am_version:
          type: ['string', 'null']
          maxLength: 64
        cluster_status:
          type: ['string', 'null']
          maxLength: 64
          examples: [ready]
        cluster_peers:
          type: ['integer', 'null']
          format: int32
          minimum: 0
          examples: [3]
        server_time:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        clock_skew_ms:
          type: ['integer', 'null']
          format: int64
        send_resolved:
          type: object
          additionalProperties:
            type: boolean
          maxProperties: 200
          description: |
            Receiver name → effective `send_resolved`. Any `false` here is a standing warning: that
            receiver will never tell oto an alert resolved.
          examples:
            - oto-webhook: true
        prometheus_ok:
          type: ['boolean', 'null']
          description: Whether the paired Prometheus answered, when one is configured.
        error:
          type: ['string', 'null']
          maxLength: 2000
        checked_at:
          $ref: '#/components/schemas/Timestamp'
      description: The result of probing a source's status endpoint. A read-only probe; it changes nothing upstream.

    ReconcileResultDTO:
      type: object
      required: [source_id, ok, started_at, finished_at, observed, missing_upstream,
                 suppressed_observed, recovered, divergence_count]
      properties:
        source_id:
          $ref: '#/components/schemas/Uuid'
        ok:
          type: boolean
        started_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          $ref: '#/components/schemas/Timestamp'
        observed:
          type: integer
          format: int32
          minimum: 0
          description: Alerts returned by the Alertmanager v2 API in this pass.
          examples: [214]
        suppressed_observed:
          type: integer
          format: int32
          minimum: 0
          description: |
            How many were reported suppressed. This is the **only** way suppression can be observed at
            all — the webhook path can never produce it.
          examples: [12]
        recovered:
          type: integer
          format: int32
          minimum: 0
          description: Present upstream but missing in oto, so a webhook was missed and has now been repaired.
          examples: [0]
        missing_upstream:
          type: integer
          format: int32
          minimum: 0
          description: |
            Open in oto but absent upstream. These are **candidates** for expiry only; the reaper still
            applies the grace period, and only if the source is healthy.
          examples: [3]
        divergence_count:
          type: integer
          format: int32
          minimum: 0
        error:
          type: ['string', 'null']
          maxLength: 2000
      description: |
        The outcome of one forced reconcile pass. The reconciler is **not** a second ingestion path: it
        produces observations that feed the same state machine, and there is exactly one write path into
        alerts.

    RejectionDTO:
      type: object
      required: [id, source_id, received_at, reason, detail, labels]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        source_id:
          $ref: '#/components/schemas/Uuid'
        batch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            The batch this element came from. `null` when no batch row exists — an undecodable body, a
            body over the size cap, or a batch for a source oto cannot serve.
        received_at:
          $ref: '#/components/schemas/Timestamp'
        reason:
          $ref: '#/components/schemas/RejectionReason'
        detail:
          type: string
          maxLength: 2000
          description: |
            Human-readable specifics: which label exceeded which cap. Written **after** redaction, so
            it never carries a secret. Empty when the reason is the whole story.
          examples: ['label value for `password` is 5121 bytes, over the 4096 cap']
        labels:
          type: object
          additionalProperties:
            type: string
          description: |
            The rejected alert's label set, exactly as it was stored — that is, already redacted per
            the source's `redact_labels`, so a matched value reads `[redacted]` here because it reads
            `[redacted]` on disk. There is no plaintext behind this field to ask for.

            Deliberately **not** a `LabelMap`: this is the set oto refused, so it is precisely the one
            that may break `LabelMap`'s bounds — a `too_many_labels` rejection carries more than 64
            entries, and `label_value_too_large` carries a value over 4096 bytes. Bounding the evidence
            by the rule it violated would make the evidence unrenderable.

            **Empty, never absent**, for the rejections that name no alert.
          examples:
            - alertname: HighErrorRate
              cluster: prod-eu
              severity: critical
      description: |
        One element oto refused to normalise, kept so that nothing disappears without a trace.

    FailedBatchDTO:
      type: object
      required: [id, source_id, mode, received_at, status, error, alert_count, truncated_alerts]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        source_id:
          $ref: '#/components/schemas/Uuid'
        mode:
          $ref: '#/components/schemas/IngestBatchMode'
        received_at:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/FailedBatchStatus'
        processed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When the batch stopped.
        error:
          type: string
          maxLength: 2000
          description: |
            Why it stopped. Always present for `failed`, and usually empty for `partial`, which stopped
            by dying rather than by deciding.
          examples: ['alert upsert failed: context deadline exceeded']
        alert_count:
          type: integer
          format: int32
          minimum: 0
          description: How many alerts are sitting in that payload unprocessed — what the failure cost.
          examples: [37]
        truncated_alerts:
          type: integer
          format: int32
          minimum: 0
          description: |
            How many alerts were dropped from the payload at accept time for exceeding the per-batch
            cap. Each one is also a `too_many_alerts` rejection.
          examples: [0]
      description: |
        One batch whose alerts are durably on disk and never reached the product. The `payload` column
        is deliberately absent: it holds up to 8 MiB per row.

    # ---------------------------------------------------------------------------------------------
    # Channels
    # ---------------------------------------------------------------------------------------------

    ChannelTypeDTO:
      type: object
      required: [type, display_name, config_schema, credential_kinds, connection_config_schema, connection_credential_kinds, capabilities, renderers]
      properties:
        type:
          $ref: '#/components/schemas/ChannelType'
        display_name:
          type: string
          maxLength: 120
          examples: ['Slack']
        config_schema:
          type: object
          additionalProperties: true
          description: |
            The provider's JSON Schema (draft 2020-12) for one **channel's** `config` object, served
            **verbatim**.

            These are the same bytes the server validates against on every create and update, and the
            same bytes the settings form renders and pre-validates itself from. There is no second copy
            of these rules anywhere — which is why adding a provider needs no UI code at all.

            A schema may OMIT a control the deployment will not honour, so read it fresh rather than
            caching it across installs. The webhook provider drops `insecure_skip_verify` unless the
            operator set `security.allow_insecure_tls`: a form must never offer a control the server
            is going to refuse with a 422.
        credential_kinds:
          type: array
          maxItems: 7
          items:
            type: string
            enum: [slack_bot_token, slack_app_token, slack_signing_secret, basic, bearer, webhook_signing_secret, none]
          description: |
            Which credential kinds a **channel** of this type accepts directly. v1 has none that do —
            every credential now lives on the connection a channel references — but the field stays for
            a future provider that needs one per destination rather than one per connection.
        connection_config_schema:
          type: object
          additionalProperties: true
          description: |
            The provider's JSON Schema for a **connection's** `config` object — the org-wide setup, not
            one channel's. A Slack connection's schema asks for `team_id`; a webhook connection's is
            currently empty, published anyway so every provider's connection-creation form is generated
            the same schema-driven way.
        connection_credential_kinds:
          type: array
          maxItems: 7
          items:
            type: string
            enum: [slack_bot_token, slack_app_token, slack_signing_secret, basic, bearer, webhook_signing_secret, none]
          description: Which credential kinds a **connection** of this type accepts.
        capabilities:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum: [threading, amend, rich_layout, interactive, broadcast, dedupe_key]
          description: |
            What the provider can do. Capabilities are negotiated centrally by oto's dispatcher, never
            asserted by a provider at send time.
        renderers:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/RendererId'
        rate_limit_class:
          type: string
          enum: [slack, none]
          description: Which pre-send token bucket applies.
      description: |
        A static provider descriptor. `GET /api/v1/channel-types` is what makes both the connection and
        the channel settings UI dynamic: each form is generated from its own schema, so the UI has no
        per-provider code.

    ChannelDTO:
      type: object
      required:
        - id
        - type
        - name
        - config
        - connection_id
        - renderer
        - verbosity
        - thread_updates
        - show_field_emoji
        - enabled
        - health_status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/ChannelType'
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Unique within the org, compared case-insensitively.
          examples: ['#sre-alerts']
        config:
          type: object
          additionalProperties: true
          description: |
            Non-secret, per-destination provider configuration, validated against this provider's
            `config_schema`. Credentials are never part of `config` and never appear in a response — and
            neither is the workspace: a Slack channel's `team_id` lives on its connection now, not here.
          examples:
            - conversation_id: C7F2X9QLM
              conversation_name: sre-alerts
              max_instances: 10
        connection_id:
          $ref: '#/components/schemas/Uuid'
          description: |
            The org-wide connection this destination opens through. The connection carries the
            credential; nothing about it appears here beyond the id — fetch
            `GET /api/v1/channel-connections/{connection_id}` for its kind and rotation timestamp.
        renderer:
          $ref: '#/components/schemas/RendererId'
        verbosity:
          $ref: '#/components/schemas/Verbosity'
        thread_updates:
          type: boolean
          default: true
          description: |
            When false, every delivery mode collapses to an in-place root update. There is no
            exception: there used to be one — the unacked reminder, which was always broadcast — and
            it went with the reminder (git-bug `bd0fb1d`), so this field now means exactly what it
            says for every Reason. Root updates are never gated by verbosity either.
        show_field_emoji:
          type: boolean
          default: true
        enabled:
          type: boolean
          default: true
        health_status:
          $ref: '#/components/schemas/ChannelHealthStatus'
        health_error:
          type: ['string', 'null']
          maxLength: 2000
          description: |
            Non-null unless `health_status` is `healthy` or `unknown`. A revoked token surfaces here as
            `auth_failed` within one delivery attempt, and oto stops retrying rather than hammering.
        health_checked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      description: |
        A **configured destination instance** — "Slack workspace T123, channel #sre-alerts" — not a
        channel type.

    ChannelTestDTO:
      type: object
      required: [ok, checked_at]
      properties:
        ok:
          type: boolean
        provider_conversation_id:
          type: ['string', 'null']
          maxLength: 64
        provider_message_id:
          type: ['string', 'null']
          maxLength: 64
          description: The synthetic card's message handle, if one was posted.
        permalink:
          type: ['string', 'null']
          format: uri
          maxLength: 3000
        error:
          type: ['string', 'null']
          maxLength: 2000
        error_class:
          $ref: '#/components/schemas/DeliveryErrorClass'
        checked_at:
          $ref: '#/components/schemas/Timestamp'
      description: |
        The result of sending one synthetic alert card. The card is rendered through the **same**
        renderer and the same outbound validator as a real notification, so a test that passes proves
        the real path works.

    # ---------------------------------------------------------------------------------------------
    # Notification
    # ---------------------------------------------------------------------------------------------

    MatcherDTO:
      type: object
      required: [name, op, value]
      properties:
        name:
          $ref: '#/components/schemas/LabelName'
        op:
          $ref: '#/components/schemas/MatcherOp'
        value:
          type: string
          maxLength: 4096
      description: One label matcher. For `=~` and `!~` the value is an RE2 regular expression, anchored by Alertmanager convention.

    ThrottleDTO:
      type: object
      required: [max, window_seconds]
      properties:
        max:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: Maximum notifications per subject within the window.
          examples: [5]
        window_seconds:
          type: integer
          format: int32
          minimum: 60
          maximum: 86400
          examples: [3600]
      description: |
        Per-subject throttle. A throttled notification is **recorded as suppressed with a reason**, never
        silently dropped.

    PolicyDTO:
      type: object
      required: [id, name, priority, enabled, matchers, reasons, channel_ids, subject_kinds, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Unique within the org, compared case-insensitively.
          examples: ['critical → #sre-alerts']
        priority:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          default: 100
          description: Lower is evaluated first.
          examples: [100]
        enabled:
          type: boolean
          default: true
        matchers:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/MatcherDTO'
          description: All matchers must match. An empty list matches everything.
        reasons:
          type: array
          minItems: 1
          maxItems: 15
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NotificationReason'
          description: Which facts this policy communicates.
        channel_ids:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        throttle:
          oneOf:
            - $ref: '#/components/schemas/ThrottleDTO'
            - type: 'null'
        subject_kinds:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [alert, case, digest]
          description: |
            WHICH ALTITUDE OF FACT THIS POLICY IS ABOUT, drawn from the same vocabulary
            `NotificationDTO.subject_kind` holds. An **empty array means every kind**, which is the
            default and is the behaviour of every policy written before migration `00072`.

            It is never `null`: "claims every altitude" is an answer rather than an absence, so the
            column is `NOT NULL DEFAULT '{}'` and this array is always present.

            ⚠️ IT OVERLAPS `reasons`, AND THE CONTRACT SAYS SO RATHER THAN HIDING IT. Every Reason is
            about exactly one subject kind, so as a filter this narrows nothing a shorter `reasons` list
            could not. It earns its place twice over: it is the **unit** of `count_min`, and it is a
            declaration an operator can read without knowing the Reason-to-subject map by heart. A
            binding that admits none of the policy's own reasons is refused with a `422` on this field,
            because such a policy would route nothing and record a `no_policy` suppression for every
            fact it saw.

            ⛔ **A POLICY CARRYING `count_min` MUST BIND EXACTLY `["case"]`** — this enum still admits
            all three values because the column does, but only one of them may sit beside a count
            condition (`policies_count_case_ck`, migration `00072`). Violating it is a `422` with code
            `unsupported` on this field. See `count_min` for why the other two bindings are refused
            rather than honoured wrongly.

            ⛔ IT IS NOT A SCHEDULE and never becomes one (SCOPE-BOUNDARY §4.8).
          examples: [['case']]
        count_min:
          type: ['integer', 'null']
          format: int32
          minimum: 2
          maximum: 10000
          description: |
            THE FLOOR TO `throttle`'S CEILING: stay silent until at least this many facts about this
            policy's bound subject kind have happened inside `count_window_seconds`. `null` — the
            default — means no condition.

            **One is not admissible.** The fact being evaluated is itself inside the window, so a
            threshold of one is cleared unconditionally and describes a behaviour that does not exist —
            the same reason zero is not a `digest_floor`.

            It requires `count_window_seconds`, and it requires `subject_kinds` to be **exactly
            `["case"]`**. Both rules are cross-field and come back as a `422` rather than as a schema
            error: the missing window is code `incomplete` on `count_window_seconds`, an unrestricted or
            two-kind binding is code `required` on `subject_kinds`, and a one-kind binding that is not
            `case` is code **`unsupported`** on `subject_kinds`.

            ⛔ **WHY THE UNIT MUST BE THE CASE, AND WHY THE OTHER TWO BINDINGS ARE REFUSED RATHER THAN
            HONOURED WRONGLY** (`policies_count_case_ck`, migration `00072`). A count is a number of
            somethings, so an unrestricted binding supplies no unit and a two-kind binding supplies two —
            adding alert-subject facts to case-subject facts is adding identities to episodes. Of the
            three single bindings only `case` decides anything an operator would recognise:

            - `["alert"]` **would be a permanent mute.** The numerator is `count(DISTINCT subject_id)`,
              and an alert-subject fact's `subject_id` is the alert **identity** — one value, unchanged
              across every firing it ever has. Five re-fires count one, the evaluator's `+1` for the fact
              in hand makes one, and `1 < count_min` suppresses as `below_threshold` every notification
              that policy would ever route, forever. Making it count *occurrences* instead was rejected:
              that is a throttle's numerator wearing a floor's clothes.
            - `["digest"]` **would be a knob nothing reads.** A digest is minted by the digest tick
              against `digest_floor` over `digest_window_seconds` and never passes through the
              suppressors, so a count condition beside it is evaluated by nothing at all. Refusing it is
              also what stops one policy carrying two floors with one of them inert, since `digest` is
              the only binding a digest window and a count condition could otherwise legally share.

            `["case"]` needs no reinterpretation: five firings of one alert are five Cases and therefore
            five distinct subjects, which is the count the feature was sold on. ⚠️ **The limitation is
            part of the feature, not a gap left open** — there is no way to ask for a count over alert
            identities, and there should not be one until somebody names the question it answers.

            **It suppresses, as of migration `00073`.** The evaluator counts the facts already inside
            `count_window_seconds`, adds the one being evaluated, and when the total is still below this
            floor the intent is recorded `status: suppressed` with `suppressed_reason: below_threshold`.
            The columns shipped in `00072` and the reason in `00073`, in that order deliberately: a
            suppression reason nothing can write is a state the contract publishes and the product cannot
            reach. A UI may promise the behaviour.

            ⚠️ WHAT IT GATES IS THE ORDINARY EVALUATION PATH, which is every policy bound to `alert` or
            to `case`. A policy whose `subject_kinds` is `["digest"]` has its count condition read by
            nothing — a digest is minted by the digest tick against `digest_window_seconds` and
            `digest_floor`, its own floor over its own window, and never reaches the suppressors — and
            whether that pairing stays admissible at all is being tightened. Do not build on either
            answer for that one binding.
          examples: [5]
        count_window_seconds:
          type: ['integer', 'null']
          format: int32
          minimum: 60
          maximum: 86400
          description: |
            HOW FAR BACK `count_min` COUNTS. `null` — the default — means no condition.

            It is a **sliding lookback** and not a tiled window, which is why it carries no divisor rule
            where `digest_window_seconds` does: a digest is a report ABOUT a span, so the span has to be
            an object two pods can independently name, whereas this is `[now - W, now]` re-derived at
            every evaluation from the instant of the fact — exactly as the throttle's window is. Its
            floor is therefore the throttle's 60 seconds rather than the digest's 300.

            It is the other half of `count_min` and inherits every cross-field rule stated there,
            including the binding one: a policy carrying a count condition must have `subject_kinds`
            exactly `["case"]`, or it is a `422` with code `unsupported` on `subject_kinds`.

            ⛔ IT IS NOT A SCHEDULE (SCOPE-BOUNDARY §4.8): it says how far back to COUNT, carries no
            timezone, no time of day and no weekday, and never will.
          examples: [3600]
        digest_window_seconds:
          type: ['integer', 'null']
          format: int32
          minimum: 300
          maximum: 86400
          description: |
            The DIGEST WINDOW: summarise what matched this policy over this many seconds, as ONE message
            per window instead of one per fact. `null` — the default — means this policy sends no digest
            and behaves exactly as it did before migration `00058`.

            It must **divide 86400**, so every boundary is a wall-clock boundary in UTC and no window
            straddles midnight (300, 600, 900, 1800, 3600, 7200, …). That rule is not expressible in
            JSON Schema, so this schema states the range only and a window that is in range but not a
            divisor comes back as a `422` with `digest_floor`/`digest_window_seconds` field violations.
            Windows are aligned to the epoch, never to the policy's `created_at`: the boundary has to be
            computable from the clock alone.

            A policy with a window must also list the `digest` reason (`policies_digest_reason_ck`), or
            its digests would be suppressed as `no_policy` once per window, forever.

            ⛔ IT IS A WINDOW OVER FACTS, NOT A SCHEDULE OF WHEN OTO MAY SPEAK (SCOPE-BOUNDARY §4.8).
            There is no timezone here and there never will be: a per-policy timezone is the first half
            of quiet hours, and quiet hours is a rota by another name.
          examples: [3600]
        digest_floor:
          type: ['integer', 'null']
          format: int32
          minimum: 1
          maximum: 10000
          description: |
            Send the digest only if at least this many **Cases opened** inside the window. `null` means
            no floor — send whenever the window was not empty; an empty window never sends at all.

            It counts Cases — one firing episode each — not alerts, which are identities that outlive
            their firings, and not notifications, which would be a count of oto's own chatter and would
            fall when a channel was throttled. It requires `digest_window_seconds`
            (`policies_digest_pair_ck`): a threshold over an unbounded span is not something anything
            can evaluate.
          examples: [5]
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      description: |
        matchers → channels → reasons. A policy decides **whether** and **where**, never how a message
        is rendered.

    NotificationDTO:
      type: object
      required: [id, subject_kind, subject_id, reason, state_version, status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        subject_kind:
          type: string
          enum: [alert, case, digest]
          description: |
            WHAT this fact is about, which selects what `subject_id` resolves against:

            - `alert` — the Alert IDENTITY, a fact true of the label set across every firing it has ever
              had. `subject_id` is an `alerts` row.
            - `case` — ONE FIRING EPISODE. `subject_id` is an `alert_cases` row. An acknowledgement is
              here, because ack lives on the firing rather than on the identity.
            - `digest` — a WINDOW OVER A NAMESPACE, which is not an object at all. `subject_id` is the
              `notification_policies` row that asked.

            It has always been part of the idempotency pre-image, which is why the vocabulary could grow
            (00056, then 00058) without re-keying anything.
        subject_id:
          $ref: '#/components/schemas/Uuid'
        alert_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            Set when the fact is about one specific alert. Always set for `acked`, `unacked`, `refired`
            and `rule_changed`.
        case_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reason:
          $ref: '#/components/schemas/NotificationReason'
        policy_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Which policy matched. `null` once the policy has been deleted.
        state_version:
          type: integer
          format: int32
          minimum: 1
          description: The group state version this intent was computed against.
        status:
          $ref: '#/components/schemas/NotificationStatus'
        suppressed_reason:
          $ref: '#/components/schemas/NotificationSuppressedReason'
        delivery_summary:
          $ref: '#/components/schemas/DeliverySummaryDTO'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            When the intent or its delivery roll-up last moved, or **`null` when the read model serving
            this response does not track one**.

            It is nullable rather than defaulted for a reason. It previously echoed `created_at` on the
            per-alert notification list, which made "this intent has never changed" and "this intent
            changed a minute ago" indistinguishable on the wire — a substitution the caller had no way
            to detect. Null says "unknown"; a timestamp means it.
      description: |
        The channel-agnostic **intent to communicate one fact** about one subject. Idempotent by
        construction: the same fact at the same group state version can exist exactly once, so a retried
        job can never double-notify.

        The internal idempotency hash is deliberately not exposed — it is a write-path mechanism, not a
        client-facing identifier.

    NotificationDetailDTO:
      allOf:
        - $ref: '#/components/schemas/NotificationDTO'
        - type: object
          required: [delivery_summary, deliveries]
          properties:
            delivery_summary:
              $ref: '#/components/schemas/DeliverySummaryDTO'
            deliveries:
              type: array
              maxItems: 64
              items:
                $ref: '#/components/schemas/DeliveryDTO'
            group:
              oneOf:
                - $ref: '#/components/schemas/GroupRefDTO'
                - type: 'null'
            alert:
              oneOf:
                - $ref: '#/components/schemas/AlertRefDTO'
                - type: 'null'
      description: One intent with every materialisation of it.

    DeliveryDTO:
      type: object
      required: [id, notification_id, channel_id, mode, status, attempts, ambiguous, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        notification_id:
          $ref: '#/components/schemas/Uuid'
        channel_id:
          $ref: '#/components/schemas/Uuid'
        channel_name:
          type: string
          maxLength: 120
        channel_type:
          $ref: '#/components/schemas/ChannelType'
        thread_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        thread_seq:
          type: ['integer', 'null']
          format: int32
          minimum: 1
          description: |
            FIFO position within the thread, allocated inside the transaction that created the delivery.
            This is how oto guarantees the root lands first and replies appear in lifecycle order,
            without serialising anything across threads.
        mode:
          $ref: '#/components/schemas/DeliveryMode'
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        attempts:
          type: integer
          format: int32
          minimum: 0
          maximum: 32
        next_attempt_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        provider_message_id:
          type: ['string', 'null']
          maxLength: 64
          description: Non-null whenever `status == "sent"`.
        provider_conversation_id:
          type: ['string', 'null']
          maxLength: 64
          description: |
            The provider's conversation id. Together with `provider_message_id` it is the handle oto
            keeps for the message it posted.

            > There is no `permalink`. One was declared here and written by nothing: oto stores no
            > permalink column, `chat.postMessage` does not return one, and constructing a Slack
            > archive URL needs a workspace domain oto never asks for. A `format: uri` field that is
            > always `null` is a deep link that never links.
        error:
          type: ['string', 'null']
          maxLength: 2000
          description: Non-null whenever `status` is `failed` or `dead`.
        error_class:
          $ref: '#/components/schemas/DeliveryErrorClass'
        ambiguous:
          type: boolean
          description: |
            True when oto crashed after the provider may have accepted the message but before the
            handle was recorded, and then re-sent. The card itself says so. Distributed systems do not
            permit exactly-once delivery, and oto would rather show a labelled duplicate than
            under-deliver a firing alert.
          examples: [false]
        rendered_fallback:
          type: ['string', 'null']
          maxLength: 3000
          description: |
            The message's top-level plain text — the push notification, the search snippet, and the only
            thing a screen reader reads. Always a complete sentence.
          examples: ['[FIRING] HighErrorRate in prod-eu/payments — 4 instances, unacknowledged.']
        sent_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      description: |
        **One materialisation of a Notification on one Channel**, owning retry state and provider ids.
        A delivery is where failure becomes visible: `dead` with `auth_expired` is how "your token was
        revoked three days ago and nobody noticed" stops being invisible.

    DeliveryDetailDTO:
      allOf:
        - $ref: '#/components/schemas/DeliveryDTO'
        - type: object
          properties:
            rendered:
              type: ['object', 'null']
              additionalProperties: true
              description: |
                The exact provider-native payload, persisted **before** the network call. When outbound
                validation rejects a payload the delivery goes straight to `dead` with
                `config_invalid` and the offending payload is retrievable here — it is never silently
                truncated and never sent.
            rendered_hash:
              type: ['string', 'null']
              pattern: '^[0-9a-f]{64}$'
              description: |
                SHA-256 of the rendered payload. An in-place update whose hash matches the thread's last
                hash is skipped as a no-op, which is what stops a flapping alert producing forty
                identical updates.
            provider_response:
              type: ['object', 'null']
              additionalProperties: true
              description: The provider's raw response, for operator debugging.
            notification:
              oneOf:
                - $ref: '#/components/schemas/NotificationDTO'
                - type: 'null'
      description: |
        One delivery including the payload that was actually rendered.

        > There is no `thread`. It referenced a `ChannelThreadDTO` schema that had no Go type behind
        > it anywhere in oto, so the property could never be emitted. `thread_id` and `thread_seq`
        > above are served and are what identify the conversation this delivery belongs to.

    PolicyPreviewDTO:
      type: object
      required: [matched, results]
      properties:
        matched:
          type: boolean
          description: Whether any enabled policy matched at all. `false` means this fact would notify nobody.
        results:
          type: array
          maxItems: 64
          items:
            type: object
            required: [policy_id, policy_name, channel_id, channel_name, channel_type, mode, would_send]
            properties:
              policy_id:
                $ref: '#/components/schemas/Uuid'
              policy_name:
                type: string
                maxLength: 120
              channel_id:
                $ref: '#/components/schemas/Uuid'
              channel_name:
                type: string
                maxLength: 120
              channel_type:
                $ref: '#/components/schemas/ChannelType'
              mode:
                $ref: '#/components/schemas/DeliveryMode'
              would_send:
                type: boolean
                description: False when a verbosity gate or a throttle would suppress it.
              suppressed_reason:
                $ref: '#/components/schemas/NotificationSuppressedReason'
              rendered_fallback:
                type: ['string', 'null']
                maxLength: 3000
                description: The plain-text line that would be sent.
              rendered:
                type: ['object', 'null']
                additionalProperties: true
                description: The provider-native payload that would be sent, rendered by the real renderer.
        warnings:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 500
      description: |
        A **dry run**: "given this alert, who is told, where, and rendered how." It runs the real policy
        matcher and the real renderer and **sends nothing**.

    # ---------------------------------------------------------------------------------------------
    # Silences
    # ---------------------------------------------------------------------------------------------

    SilenceMatcherDTO:
      type: object
      required: [name, value, is_regex, is_equal]
      properties:
        name:
          $ref: '#/components/schemas/LabelName'
        value:
          type: string
          maxLength: 4096
        is_regex:
          type: boolean
        is_equal:
          type: boolean
        op:
          $ref: '#/components/schemas/MatcherOp'
      description: |
        An Alertmanager silence matcher, mirrored verbatim. The four operators are encoded as
        `(is_regex, is_equal)`: `=` is `(false,true)`, `!=` is `(false,false)`, `=~` is `(true,true)`,
        `!~` is `(true,false)`. `op` is the same thing rendered for convenience.

    SilenceDTO:
      type: object
      required: [id, source_id, source_silence_id, matchers, starts_at, ends_at, created_by, comment, state, mirrored_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        source_id:
          $ref: '#/components/schemas/Uuid'
        source_silence_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Alertmanager's own silence id, for cross-referencing and deep links.
          examples: ['b7f3a1c2-9d84-4e15-a0f6-3c8b2d7e1a94']
        matchers:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/SilenceMatcherDTO'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'
        created_by:
          type: string
          minLength: 1
          maxLength: 256
          examples: ['priya@example.com']
        comment:
          type: string
          maxLength: 4096
          examples: ['Deploy window, expected error spike']
        annotations:
          $ref: '#/components/schemas/AnnotationMap'
        state:
          $ref: '#/components/schemas/SilenceState'
        source_updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        mirrored_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: When oto last refreshed this mirror. Silences are synced approximately every 60 seconds.
        alertmanager_url:
          type: ['string', 'null']
          format: uri
          maxLength: 2048
          description: |
            Deep link into the Alertmanager UI for this silence. **This is v1's only silence
            affordance** — a silence write path is safety-critical, because a bug in one suppresses a
            real incident, so oto has to earn it first.
      description: |
        A **read-only mirror** of an Alertmanager silence. oto has no write path into your cluster: it
        cannot create, edit or expire a silence, only show you one.

    SilenceDetailDTO:
      allOf:
        - $ref: '#/components/schemas/SilenceDTO'
        - type: object
          required: [matched_alerts, matched_count]
          properties:
            matched_alerts:
              type: array
              maxItems: 200
              items:
                $ref: '#/components/schemas/AlertRefDTO'
              description: Alerts oto currently believes this silence matches.
            matched_count:
              type: integer
              format: int32
              minimum: 0
            source:
              oneOf:
                - $ref: '#/components/schemas/SourceRefDTO'
                - type: 'null'
      description: One mirrored silence and the alerts it covers.

    # ---------------------------------------------------------------------------------------------
    # Discovery and stats
    # ---------------------------------------------------------------------------------------------

    LabelNameDTO:
      type: object
      required: [name, alert_count, promoted]
      properties:
        name:
          $ref: '#/components/schemas/LabelName'
        alert_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            How many alerts in your org currently carry this label. Always served; results are ordered
            by it, most-used first, with the name as a tiebreak.

            It is a live `count(*)` over the alerts scanned to produce the list, so it is exact for the
            instant it was read — but it is intended for **ranking a typeahead**, not for accounting. A
            filter bar that offers a label matching nothing spends the one minute of an incident that
            matters most.
          examples: [1420]
        promoted:
          type: boolean
          description: |
            Whether this label is one of the promoted, individually indexed columns (`alertname`,
            `severity`, `namespace`, `service`, `cluster`). Filtering on a promoted label is markedly
            cheaper than filtering on an arbitrary one.
      description: A distinct label name, for the filter bar.

    LabelValueDTO:
      type: object
      required: [value, alert_count]
      properties:
        value:
          type: string
          maxLength: 4096
          examples: [payments]
        alert_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            How many alerts currently carry this label with this value. Always served; results are
            ordered by it, most-used first.
      description: A distinct value for one label name, for typeahead.

    EnricherDTO:
      type: object
      required: [name, version, phase, enabled]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9]*)+$'
          maxLength: 64
          examples: ['prom.rule']
        version:
          type: integer
          format: int32
          minimum: 1
        phase:
          $ref: '#/components/schemas/EnrichmentPhase'
        timeout_ms:
          type: integer
          format: int32
          minimum: 0
          description: This enricher's slice of the inline budget. The total inline budget is a 2000 ms ceiling, never a wait.
          examples: [800]
        enabled:
          type: boolean
        health_status:
          type: string
          enum: [healthy, degraded, failing, unknown]
          description: |
            Always `unknown` today, and honestly so: the rolling health counters live in the
            pipeline's Prometheus metrics and are not readable from the registry this endpoint
            serves. It is declared because an invented `healthy` would be worse than an admitted
            `unknown`.
      description: |
        A registered enricher with its phase, version and configured budget.

        > `display_name`, `cache_hit_rate`, `success_rate`, `p95_duration_ms` and `last_run_at` were
        > declared here and populated by nothing — the registry knows an enricher's name, version,
        > phase and timeout, and that is all it knows. They are gone rather than permanently absent;
        > the observed-health half of this resource will return when there is a store to read it
        > from. Scrape `oto_enrichment_*` for the rates and latencies in the meantime.

    StatsOverviewDTO:
      type: object
      required: [alerts, deliveries, sources, generated_at]
      properties:
        alerts:
          type: object
          required: [firing, suppressed, resolved, expired, acked, unacked, flapping]
          properties:
            firing:
              type: integer
              format: int32
              minimum: 0
            suppressed:
              type: integer
              format: int32
              minimum: 0
            resolved:
              type: integer
              format: int32
              minimum: 0
            expired:
              type: integer
              format: int32
              minimum: 0
            acked:
              type: integer
              format: int32
              minimum: 0
            unacked:
              type: integer
              format: int32
              minimum: 0
            flapping:
              type: integer
              format: int32
              minimum: 0
          description: |
            Open-state counts. `resolved` and `expired` are counted separately and are never summed into
            one "closed" bucket, because conflating them is exactly the lie oto exists to avoid.
        deliveries:
          type: object
          required: [sent, failed, dead, skipped, pending]
          properties:
            sent:
              type: integer
              format: int32
              minimum: 0
            failed:
              type: integer
              format: int32
              minimum: 0
            dead:
              type: integer
              format: int32
              minimum: 0
            skipped:
              type: integer
              format: int32
              minimum: 0
            pending:
              type: integer
              format: int32
              minimum: 0
            ambiguous:
              type: integer
              format: int32
              minimum: 0
        sources:
          type: object
          required: [healthy, degraded, unreachable, unknown]
          properties:
            healthy:
              type: integer
              format: int32
              minimum: 0
            degraded:
              type: integer
              format: int32
              minimum: 0
            unreachable:
              type: integer
              format: int32
              minimum: 0
            unknown:
              type: integer
              format: int32
              minimum: 0
            max_clock_skew_ms:
              type: integer
              format: int64
            total_divergence:
              type: integer
              format: int32
              minimum: 0
        channels:
          type: object
          required: [healthy, degraded, auth_failed, config_invalid]
          properties:
            healthy:
              type: integer
              format: int32
              minimum: 0
            degraded:
              type: integer
              format: int32
              minimum: 0
            auth_failed:
              type: integer
              format: int32
              minimum: 0
            config_invalid:
              type: integer
              format: int32
              minimum: 0
        window:
          type: object
          required: [since, until]
          properties:
            since:
              $ref: '#/components/schemas/Timestamp'
            until:
              $ref: '#/components/schemas/Timestamp'
        generated_at:
          $ref: '#/components/schemas/Timestamp'
      description: |
        The dashboard roll-up: open counts, delivery health and source health. Deliberately contains no
        per-person data of any kind.

    AlertQualityDTO:
      type: object
      required: [alertname, cluster_key, cases, notifications, deliveries, acked_cases,
                 ack_rate, auto_resolved, expired, total_firing_seconds, flap_transitions, flap_score]
      properties:
        alertname:
          type: string
          minLength: 1
          maxLength: 1024
          examples: [KubePodCrashLooping]
        cluster_key:
          $ref: '#/components/schemas/ClusterKey'
        cases:
          type: integer
          format: int32
          minimum: 0
          examples: [47]
        notifications:
          type: integer
          format: int32
          minimum: 0
          examples: [47]
        deliveries:
          type: integer
          format: int32
          minimum: 0
        acked_cases:
          type: integer
          format: int32
          minimum: 0
          description: Never exceeds `cases`.
          examples: [0]
        ack_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: '`acked_cases / cases`, or 0 when there were none.'
          examples: [0]
        auto_resolved:
          type: integer
          format: int32
          minimum: 0
          description: Episodes that ended with an explicit upstream resolution.
        expired:
          type: integer
          format: int32
          minimum: 0
          description: Episodes oto stopped hearing about. Counted apart from `auto_resolved`, always.
        total_firing_seconds:
          type: integer
          format: int64
          minimum: 0
        flap_transitions:
          type: integer
          format: int32
          minimum: 0
          description: |
            Lifecycle transitions recorded across the window. This is the stored quantity; `flap_score`
            below is derived from it.
        flap_score:
          type: number
          format: float
          minimum: 0
          description: |
            **`flap_transitions / cases`, and `0` when `cases` is `0`.** Transitions per
            episode — how much state-churn one firing of this rule costs on average.

            The derivation is stated here because the daily rollup stores no `flap_score` column, and an
            undocumented ratio is a number a reader will assume means something else. In particular it
            is **not** the same quantity as `AlertDTO.flap_score`, which is a live per-alert EWMA of
            transitions per hour against the org's flapping threshold. Same name, different scale,
            different subject: this one is per alertname per cluster over the reporting window and is
            never compared against that threshold.
      description: |
        Alert hygiene, per alertname per cluster. This is the row that answers *"this rule fired 47 times
        this month, cost 47 notifications, and was acknowledged 0 times"* — which does more good than any
        enrichment, because **the best alert is the one that no longer exists**.

        There is **no user column here and no way to add one**: per-person response-time metrics,
        leaderboards and per-individual aggregates are not merely absent from this API, they are
        unrepresentable in the underlying schema.

    # ---------------------------------------------------------------------------------------------
    # Identity
    # ---------------------------------------------------------------------------------------------

    OrgDTO:
      type: object
      required: [id, slug, name, settings]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
          examples: [acme]
        name:
          type: string
          minLength: 1
          maxLength: 200
          examples: ['Acme Corp']
        settings:
          $ref: '#/components/schemas/OrgSettingsDTO'
      description: The tenant boundary. Every resource in this API belongs to exactly one org.

    OrgSettingsDTO:
      type: object
      required:
        - resolve_grace_s
        - flap_threshold
        - flap_window_s
        - flap_digest_interval_s
        - raw_retention_days
        - event_retention_months
        - default_verbosity
      properties:
        resolve_grace_s:
          type: integer
          format: int32
          minimum: 60
          maximum: 86400
          default: 300
          description: |
            How long past its upstream end time a case is held before the reaper may expire it.
            Must exceed the `EndsAt` lease Prometheus refreshes (typically 3–4 minutes), or a single
            missed scrape looks like an expiry.
        flap_threshold:
          type: integer
          format: int32
          minimum: 3
          maximum: 100
          default: 5
          description: |
            Transitions within `flap_window_s` before an alert is **marked** flapping. Below 3 a single
            rolling deploy is mislabelled as flapping and a healthy alert is shown as noisy; above 100
            the damper can never engage and is dead code that looks configured.
        flap_window_s:
          type: integer
          format: int32
          minimum: 300
          maximum: 86400
          default: 7200
          description: |
            A window shorter than one `group_interval` cannot contain two transitions oto is able to
            observe. Whether it is long ENOUGH is arithmetic this bound cannot do: one observable
            fire → resolve → fire cycle costs `group_interval + max(group_interval, for)` and yields two
            counted transitions, so a window holds about `2 × floor(W / cycle)` of them. The default of
            7200 is `flap_threshold × cycle` for the modal real rule (5 × 20m, rounded up); the previous
            1800 held at most 6 transitions for ANY rule shape at `group_interval: 5m`, which made a
            threshold of 5 unreachable and the damper dead code. See ADR 0026.
        flap_digest_interval_s:
          type: integer
          format: int32
          minimum: 60
          maximum: 86400
          default: 900
          description: A digest more often than once a minute is not a digest.
        raw_retention_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          default: 30
          description: |
            How long raw webhook bodies and rejection records are kept. They age out by dropping whole
            daily partitions, never by deleting rows, and a dropped partition is unrecoverable.

            **The default 30 is chosen, not derived.** A replay is refused when the alerts a stored
            batch would touch have moved on since it arrived — a later batch already wrote to the
            case, or the case closed while this batch still says firing — and never because the batch
            is old. So this window is the depth of `GET /sources/{id}/rejections` and
            `GET /sources/{id}/failed-batches`, which take no date range, and the window in which a
            stored batch can be replayed at all: past the boundary there are no bytes.

            Nothing an alert page shows is served from here; the two source feeds named above are the
            only operations in this contract that read `ingest_batches` or `ingest_rejections`.
            Lowering it empties those feeds and costs reproducibility of an ingestion bug, not
            history. See ADR 0024.
        event_retention_months:
          type: integer
          format: int32
          minimum: 1
          maximum: 120
          default: 13
          description: |
            How long `alert_events` are kept. Monthly partitions are dropped whole and permanently.

            **This is the only setting here that destroys something oto cannot rebuild.** Past the
            boundary `GET /alerts/{id}/events`, `GET /cases/{id}/events` and the group timeline
            return nothing — including every human comment and unack note, which live nowhere else.

            What survives at any value: the alert and its labels, every case with its ack and
            outcome, the rule snapshot bound at fire time, the notification and delivery record, and
            the daily rollups. None of those are ever reaped.

            13 is the longest default that keeps one org inside ADR 0014's scale envelope. Raise it to
            120 (10 years) if an audit requires it, and expect ADR 0014's revisit triggers at volume.
            There is no cold-storage export: an aged-out month is not archived anywhere. See ADR 0024.
        default_verbosity:
          $ref: '#/components/schemas/Verbosity'
      description: |
        Org-level tuning, as **effective values**. **Grouping is on by default and flap scoring is on by
        default** — oto defaults to quiet, and every damping decision it makes is a visible state rather
        than a silent drop. Storm collapse is not here: it was removed rather than defaulted off.

        Every bound above is enforced **server-side** on `PATCH /api/v1/org/settings`, not merely by the
        settings form: the request that sets `resolve_grace_s` to 0 arrives from `curl` long before it
        arrives from a form. Values already stored outside a bound are **clamped on read** rather than
        rejected, so a row written before a bound existed can never fail an alert.

        To find out whether a value here is this org's own or oto's shipped default, read
        `GET /api/v1/org/settings`, which returns the same numbers alongside their **origin**.

    UserDTO:
      type: object
      required: [id, email, display_name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: ['string', 'null']
          format: email
          maxLength: 254
          examples: ['priya@example.com']
          description: |
            The member's address, or **null** when they have never given oto one.

            A null email means this is a **shadow member**: somebody oto knows only as a Slack
            workspace member who has pressed a button on one of its messages. The row exists so
            that the press is attributable and so that a redelivered press can be recognised as
            the same act rather than performed twice; it cannot sign in, and oto will never mail
            it. The member's `display_name` is their Slack handle.

            It stays **required** and becomes nullable rather than optional, so a client is typed
            for the absence instead of for a key that may or may not be there. A synthetic
            address is never substituted: an invented mailbox would be indistinguishable from a
            real one on every screen that shows this field.
        display_name:
          type: string
          minLength: 1
          maxLength: 120
          examples: ['Priya R.']
        slack_user_id:
          type: ['string', 'null']
          pattern: '^[UW][A-Z0-9]{2,}$'
          description: The linked Slack identity, when one has been linked.
          examples: ['U7A2K9QLM']
      description: |
        A human principal. Password hashes and token material never appear in any response.

        `email` is nullable — see its own description. A member with no address is one oto has
        only ever seen act in Slack.

    MeDTO:
      type: object
      required: [principal_kind, org, search]
      properties:
        principal_kind:
          type: string
          enum: [user, pat]
          description: Whether this request was authenticated by a session or by a personal access token.
        user:
          oneOf:
            - $ref: '#/components/schemas/UserDTO'
            - type: 'null'
        org:
          $ref: '#/components/schemas/OrgDTO'
        token_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Present when `principal_kind` is `pat`.
        session_expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        search:
          $ref: '#/components/schemas/SearchDTO'
      description: |
        The current principal, its org and that org's settings. v1 has no roles and no scopes: every
        authenticated principal has full access to its own org and none to any other.

    SearchDTO:
      type: object
      required: [partial_match_enabled]
      properties:
        partial_match_enabled:
          type: boolean
          description: |
            Whether partial/substring matching on alert names is available. Alert search always runs a
            full-text query over alertname, summary and description; this is `true` only when this
            deployment's Postgres also has the `pg_trgm` extension enabled, which lets search find a
            substring inside a compound alertname (e.g. "error" inside `CheckoutErrorRateHigh`) that
            word-based full-text search can never split on its own. Enabling `pg_trgm` is a one-time,
            operator-run, self-service step oto never performs itself; see
            docs/runbooks/alert-search-partial-match.md.
      description: This deployment's free-text alert-search capabilities.

    ApiTokenDTO:
      type: object
      required: [id, kind, name, prefix, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum: [pat, ingest]
          description: |
            `pat` reads and writes the API; `ingest` is scoped to exactly one source's webhook and can
            never read an alert.
        name:
          type: string
          minLength: 1
          maxLength: 120
          examples: ['laptop CLI']
        prefix:
          type: string
          pattern: '^oto_(pat|ingest)_[A-Za-z0-9]{4}$'
          description: The kind literal plus four characters, so a token can be identified without revealing it.
          examples: ['oto_pat_AbCd']
        source_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Always set for `ingest` tokens, always null for `pat`.
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      description: |
        A bearer credential. **The secret is never returned by this schema** — only a SHA-256 hash of it
        is stored, so a lost token can only be replaced, never recovered.

    ApiTokenCreatedDTO:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: '#/components/schemas/ApiTokenDTO'
        secret:
          type: string
          minLength: 20
          maxLength: 200
          pattern: '^oto_pat_[A-Za-z0-9]+$'
          description: '**Returned exactly once.** There is no endpoint that can show it again.'
          examples: ['oto_pat_AbCdE7fG2hJ9kL4mN1pQ6rS3tU8vW5xY']
      description: A newly minted personal access token, with its secret.

    # ---------------------------------------------------------------------------------------------
    # Ingest
    # ---------------------------------------------------------------------------------------------

    AlertmanagerWebhookAlert:
      type: object
      required: [status, labels, startsAt]
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [firing, resolved]
          description: |
            Only these two values ever appear on a webhook. `suppressed` is **not** observable here:
            Alertmanager's mute stage drops muted alerts before the webhook is called.
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          description: |
            May be the Go **zero time** `"0001-01-01T00:00:00Z"` when unset — not `null`, not omitted.
            oto treats the zero time as "no end time known", never as the year 1.
        generatorURL:
          type: string
        fingerprint:
          type: string
          description: |
            Alertmanager's FNV-1a fingerprint. oto **recomputes** this locally and stores its own value;
            a mismatch is recorded as a metric and a note on the batch, and never fails the ingest.
      description: One element of the webhook's `alerts[]`. Decoded leniently — unknown fields are kept, not rejected.

    AlertmanagerWebhookPayload:
      type: object
      required: [version, status, alerts]
      additionalProperties: true
      properties:
        version:
          type: string
          description: |
            The hardcoded literal `"4"`. **Not a feature-detection signal**: oto does not branch on it
            and does not reject other values.
          examples: ['4']
        groupKey:
          type: string
          description: |
            Alertmanager's own group key. Stored verbatim for observability and **never parsed** — it is
            unescaped, unbounded, and embeds the route path, so it changes whenever `alertmanager.yml`
            is reloaded. oto derives its own durable `group_key` instead.
        truncatedAlerts:
          type: integer
          format: int64
          minimum: 0
          description: |
            A **number**, despite the upstream docs rendering it in a string-looking position. Non-zero
            means the operator set `max_alerts` and those alert bodies are permanently lost; oto can only
            report "+N more". Leave `max_alerts: 0`.
        status:
          type: string
          enum: [firing, resolved]
          description: '`resolved` only when **every** alert in the group is resolved. A single payload may mix both.'
        receiver:
          type: string
        notification_reason:
          type: string
          description: |
            Alertmanager 0.32.0 and later. One of `none`, `first notification`, `new alerts added`,
            `some alerts resolved`, `all alerts resolved`, `repeat interval elapsed`, `unknown`.

            This field is why oto is quieter than stock Alertmanager: `repeat interval elapsed` means
            "nothing changed", so oto updates the existing message instead of posting a new one. Empty
            or absent on older Alertmanager, where oto falls back to diffing fingerprint sets.
        groupLabels:
          type: object
          additionalProperties:
            type: string
        commonLabels:
          type: object
          additionalProperties:
            type: string
        commonAnnotations:
          type: object
          additionalProperties:
            type: string
        routeLabels:
          type: object
          additionalProperties:
            type: string
          description: |
            Emitted on the wire but **absent from the published Alertmanager documentation**. Its
            existence is precisely why this endpoint must decode leniently.
        externalURL:
          type: string
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertmanagerWebhookAlert'
      description: |
        The Alertmanager v4 webhook envelope, as actually emitted on the wire.

        **`additionalProperties` is `true` everywhere in this schema, deliberately.** Alertmanager sends
        undocumented fields (`routeLabels`), Grafana Unified Alerting sends a superset (`orgId`,
        `title`, `message`, `state`, `silenceURL`, `dashboardURL`, `panelURL`, `imageURL`), and a
        custom `payload:` template can produce any shape at all. Rejecting unknown fields here would
        break on the next Alertmanager release and would delete alerts permanently. This is the exact
        opposite of the strict policy every other request body in this document is bound by, because the
        trust model is the opposite.

    IngestAcceptedDTO:
      type: object
      required: [batch_id, alert_count, rejected_alerts, truncated_alerts, duplicate]
      properties:
        batch_id:
          $ref: '#/components/schemas/Uuid'
        alert_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: |
            Alerts accepted for processing. Capped at 10 000: a larger batch is truncated, the excess is
            recorded with a reason, and the rest is processed.
          examples: [2]
        duplicate:
          type: boolean
          description: |
            True when this exact batch was already accepted — the normal, expected outcome for an HA
            Alertmanager pair or a retry after a network blip. The original `batch_id` is returned and
            nothing is processed twice.
          examples: [false]
        truncated_alerts:
          type: integer
          format: int32
          minimum: 0
          description: How many alerts were dropped by oto's own 10 000 cap.
        rejected_alerts:
          type: integer
          format: int32
          minimum: 0
          description: |
            How many individual alerts failed a bound check and were recorded as rejections. The rest of
            the batch was still processed, and the response is still a 202.
      description: |
        The webhook receipt. **A 2xx is a promise**: oto never returns one for a payload it failed to
        persist. Alertmanager ignores this body on 2xx, so it exists for humans and for oto's own tests.

    # ---------------------------------------------------------------------------------------------
    # Streaming (SSE). One named schema per event type, because the generated TS client needs them.
    # ---------------------------------------------------------------------------------------------

    UiEventKind:
      type: string
      enum:
        - alert.upserted
        - case.upserted
        - group.upserted
        - event.appended
        - delivery.updated
        - source.health
        - resync
      description: |
        The closed set of stream frame types. `heartbeat` is not listed here because it is not a frame:
        it is sent as a bare SSE comment line (`: ping`) every 15 seconds and carries no data.
      examples: [alert.upserted]

    UiEventResource:
      type: string
      enum: [alert, case, group, alert_event, delivery, source]
      examples: [alert]

    StreamFrame:
      type: object
      required: [seq, kind, org_id, at, data]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: |
            Strictly monotonic per-deployment sequence, and the value echoed in the SSE `id:` field.
            **Clients must not assume contiguity** — gaps are normal, because sequences are allocated
            across orgs from one counter.
          examples: [918274]
        kind:
          $ref: '#/components/schemas/UiEventKind'
        resource:
          oneOf:
            - $ref: '#/components/schemas/UiEventResource'
            - type: 'null'
          description: Absent for `resync`, which is about the stream itself rather than any resource.
        id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The resource this frame is about. Absent for `resync`.
        org_id:
          $ref: '#/components/schemas/Uuid'
        at:
          $ref: '#/components/schemas/Timestamp'
        data:
          oneOf:
            - $ref: '#/components/schemas/AlertUpsertedData'
            - $ref: '#/components/schemas/CaseUpsertedData'
            - $ref: '#/components/schemas/GroupUpsertedData'
            - $ref: '#/components/schemas/EventAppendedData'
            - $ref: '#/components/schemas/DeliveryUpdatedData'
            - $ref: '#/components/schemas/SourceHealthData'
            - $ref: '#/components/schemas/ResyncData'
          description: |
            Discriminated by `kind`. The payload is deliberately **small** — a change notice, not a
            resource. Clients re-read the relevant endpoint for full detail, which keeps frames well
            under the 4 KiB cap and keeps the stream cheap.
      description: |
        One frame on the SSE stream, serialised as the `data:` line. The SSE `event:` field carries the
        same value as `kind`, so a client may either add typed listeners per event name or attach one
        listener and switch on `kind`.

    AlertUpsertedData:
      type: object
      required: [state, alertname, last_seen_at]
      properties:
        state:
          $ref: '#/components/schemas/State'
        severity:
          type: ['string', 'null']
          maxLength: 4096
        alertname:
          type: string
          minLength: 1
          maxLength: 1024
        namespace:
          type: ['string', 'null']
          maxLength: 4096
        cluster_key:
          $ref: '#/components/schemas/ClusterKey'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        total_cases:
          type: integer
          format: int32
          minimum: 0
        is_flapping:
          type: boolean
      description: Payload of an `alert.upserted` frame. An alert was created or its projection changed.

    CaseUpsertedData:
      type: object
      required: [alert_id, seq, state, ack_state, started_at]
      properties:
        alert_id:
          $ref: '#/components/schemas/Uuid'
        group_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        seq:
          type: integer
          format: int32
          minimum: 1
        state:
          $ref: '#/components/schemas/State'
        ack_state:
          $ref: '#/components/schemas/AckState'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        ended_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      description: Payload of an `case.upserted` frame.

    GroupUpsertedData:
      type: object
      required: [state, firing_count, total_count, acked_count, last_activity_at]
      properties:
        state:
          $ref: '#/components/schemas/GroupState'
        severity:
          type: ['string', 'null']
          maxLength: 4096
        firing_count:
          type: integer
          format: int32
          minimum: 0
        total_count:
          type: integer
          format: int32
          minimum: 0
        acked_count:
          type: integer
          format: int32
          minimum: 0
        last_activity_at:
          $ref: '#/components/schemas/Timestamp'
      description: Payload of a `group.upserted` frame. Drives the live counts on the landing view.

    EventAppendedData:
      type: object
      required: [type, occurred_at, recorded_at, actor_kind, summary]
      properties:
        alert_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        case_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        group_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        type:
          $ref: '#/components/schemas/AlertEventType'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
        actor_kind:
          $ref: '#/components/schemas/ActorKind'
        actor_label:
          type: ['string', 'null']
          maxLength: 200
        summary:
          type: string
          minLength: 1
          maxLength: 500
      description: |
        Payload of an `event.appended` frame — enough to render a new timeline row immediately without
        refetching.

    DeliveryUpdatedData:
      type: object
      required: [notification_id, channel_id, mode, status]
      properties:
        notification_id:
          $ref: '#/components/schemas/Uuid'
        channel_id:
          $ref: '#/components/schemas/Uuid'
        mode:
          $ref: '#/components/schemas/DeliveryMode'
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        error_class:
          $ref: '#/components/schemas/DeliveryErrorClass'
      description: Payload of a `delivery.updated` frame. This is how a failing channel becomes visible live.

    SourceHealthData:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/SourceHealthStatus'
        last_reconcile_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        divergence_count:
          type: integer
          format: int32
          minimum: 0
        warnings:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 500
      description: Payload of a `source.health` frame. Drives the "source unreachable" banner.

    ResyncData:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [buffer_overflow, replay_window_exceeded]
          description: |
            `buffer_overflow` — this connection fell behind and its ring buffer was dropped. oto never
            blocks a writer for a slow reader.

            `replay_window_exceeded` — the requested `Last-Event-ID` is older than the 24-hour replay
            window, or the gap exceeds 10 000 events.
          examples: [buffer_overflow]
      description: |
        Payload of a `resync` frame. **The client MUST refetch** the lists it is displaying; incremental
        state after this point is not trustworthy.

    # ---------------------------------------------------------------------------------------------
    # Ops
    # ---------------------------------------------------------------------------------------------

    HealthDTO:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
      description: Liveness. Answers as long as the process is running; says nothing about dependencies.

    ReadyDTO:
      type: object
      required: [status, database, migrations]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          type: string
          enum: [ok, unreachable]
        migrations:
          type: string
          enum: [applied, pending, unknown]
        schema_version:
          type: ['string', 'null']
          maxLength: 64
          examples: ['00011']
        detail:
          type: ['string', 'null']
          maxLength: 500
      description: Readiness. Reports whether the database is reachable and every migration has been applied.

    VersionDTO:
      type: object
      required: [version, commit, schema_version]
      properties:
        version:
          type: string
          maxLength: 64
          examples: ['1.0.0']
        commit:
          type: string
          maxLength: 64
          examples: ['9f2c1a7b3e4d5f6a7b8c9d0e1f2a3b4c5d6e7f80']
        built_at:
          $ref: '#/components/schemas/Timestamp'
        go_version:
          type: string
          maxLength: 32
          examples: ['go1.24.0']
        schema_version:
          type: string
          maxLength: 64
          examples: ['00011']
      description: Build and schema identification. Unauthenticated, so a deployment can be identified before login.

    # ---------------------------------------------------------------------------------------------
    # Delivery drills
    # ---------------------------------------------------------------------------------------------

    DrillStatus:
      type: string
      enum: [running, passed, failed, timed_out]
      description: |
        `timed_out` is a **different verdict from `failed`** on purpose. "Slack rejected the card" and
        "nothing has picked the job up in ninety seconds" send an operator to completely different
        places — the second usually means no worker is running, which no per-stage error could say.

    DrillStageName:
      type: string
      enum:
        - accept
        - process
        - identity
        - case
        - rule_snapshot
        - policy
        - thread
        - ordering
        - delivery
      description: |
        One link in the chain a real alert travels, in causal order. Each one is a row some part of
        oto writes, and a drill reports its status by **looking at that row** rather than by being
        told — so a stage that stops writing its row is a stage the drill notices.

    DrillStageStatus:
      type: string
      enum: [pending, passed, failed, skipped]
      description: |
        `skipped` is not a failure and never sets `failed_stage`. Only `rule_snapshot` uses it: a
        drill's alert matches no Prometheus rule, because oto did not write one in anybody's cluster,
        so there is nothing to capture and saying so is more honest than a green tick.

    DrillStageDTO:
      type: object
      required: [name, status, detail]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/DrillStageName'
        status:
          $ref: '#/components/schemas/DrillStageStatus'
        detail:
          type: string
          maxLength: 2000
          description: |
            One sentence an operator can act on. It names the provider's own error code where there is
            one (`slack: not_in_channel`) and never the underlying error string, which can carry a
            request URL and therefore a token.
          examples: ['no notification policy matched this group''s labels, so nothing was sent.']
        facts:
          type: object
          additionalProperties:
            type: string
            maxLength: 1000
          description: |
            Small pieces of evidence shown beside the stage — an `alert_key`, a group `generation`, a
            Slack `thread_ts`, a `policy` name. Keys are stable and snake_case. A display surface, not
            a second API: do not parse behaviour out of it.
      description: One reported link of the pipeline chain.

    DrillDestinationDTO:
      type: object
      required: [channel_id, channel_name, status, mode]
      additionalProperties: false
      properties:
        channel_id:
          $ref: '#/components/schemas/Uuid'
        channel_name:
          type: string
          maxLength: 200
          examples: ['#sre-alerts']
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        mode:
          $ref: '#/components/schemas/DeliveryMode'
        thread_id:
          type: ['string', 'null']
          maxLength: 64
          description: The Slack thread root `ts`. A string, never a float.
        provider_message_id:
          type: ['string', 'null']
          maxLength: 64
        error:
          type: ['string', 'null']
          maxLength: 2000
        error_class:
          # `DeliveryErrorClass` is ALREADY `type: ['string','null']`, so wrapping
          # it in `oneOf: [$ref, null]` made `null` match BOTH branches — and
          # `oneOf` demands exactly one. Every successful destination renders
          # `error_class: null`, so the only shape a PASSING drill can produce was
          # rejected by its own published contract. The four other uses of this
          # schema `$ref` it directly; this was the outlier.
          $ref: '#/components/schemas/DeliveryErrorClass'
      description: One channel the drill's card reached, and what happened there.

    DeliveryDrillDTO:
      type: object
      required:
        - id
        - source_id
        - severity
        - status
        - stages
        - destinations
        - started_by_label
        - started_at
        - deadline_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        source_id:
          $ref: '#/components/schemas/Uuid'
        severity:
          type: string
          maxLength: 64
          description: The raw severity label the synthetic alert fired at.
          examples: [warning]
        status:
          $ref: '#/components/schemas/DrillStatus'
        failed_stage:
          oneOf:
            - $ref: '#/components/schemas/DrillStageName'
            - type: 'null'
          description: |
            The **first** stage that failed, or `null`. This single field is the operator-facing point
            of the whole feature: not "it did not work" but "the policy matched nothing". Later stages
            are left `pending` rather than reported as cascading failures.
        stages:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DrillStageDTO'
          description: |
            **Always every stage**, including the ones that never started. How far it got is half of
            what the screen is read for.
        destinations:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/DrillDestinationDTO'
        alert_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The synthetic Alert, once identity resolved. Fetch it with `?synthetic=true`.
        case_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        notification_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        batch_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        started_by_label:
          type: string
          maxLength: 200
          description: |
            Who ran it, frozen at write time so the receipt stays readable after the user is gone.
            Past-tense attribution in the `acked_by` mould — **actor, never subject**. No per-person
            metric is derived from it.
          examples: ['Ada Lovelace']
        started_at:
          $ref: '#/components/schemas/Timestamp'
        deadline_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When the verdict was frozen. Non-null means `status` will never change again.
        disposed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            When the synthetic signal rows were deleted. A non-null value alongside a non-null
            `finished_at` is the normal, healthy end state of a drill: the receipt survives, the fake
            alert does not.
      description: |
        One end-to-end rehearsal of the notification path, driven by a synthetic Alert oto
        manufactured and pushed through the **real** ingest endpoint.

    # ---------------------------------------------------------------------------------------------
    # Request bodies
    # ---------------------------------------------------------------------------------------------

    StartDrillRequest:
      type: object
      required: [source_id]
      additionalProperties: false
      properties:
        source_id:
          $ref: '#/components/schemas/Uuid'
        severity:
          type: string
          maxLength: 64
          description: |
            The raw severity label the synthetic alert fires at. Defaults to `warning`.

            It is the **one** knob, because severity is what a notification policy most often matches
            on: an operator whose only policy routes `severity=critical` would otherwise get
            `no_policy` from every drill and conclude oto was broken when it is working exactly as
            configured. Every further knob is a way for the drill to stop resembling a real alert.
          examples: [critical]
      description: |
        Start one delivery drill against one AlertSource. The payload is accepted **as if** it had
        arrived on that source's webhook, so it picks up the source's cluster identity, its
        `inject_labels`, its `ignore_labels` and its redaction — which is most of what makes the
        answer mean anything.

    AckRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 2000
          description: An optional note recorded on the case and shown on the timeline and the chat card.
          examples: ['Known deploy, rolling back']
      description: |
        Acknowledge the current case. **An acked alert is still firing** — acknowledgement is
        orthogonal to state, and it says "a human has seen this", not "this is over".

    UnackRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 2000
      description: |
        Withdraw an acknowledgement. Recorded on the timeline with `reason: manual`, to distinguish it
        from the automatic unack that happens when a new case opens.

    CommentRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
          description: Must not be blank after trimming.
          examples: ['Confirmed upstream provider incident, tracking on their status page.']
      description: Add a human note to the timeline. Appends an immutable `comment.added` event.

    CreateCasePolicyRequest:
      type: object
      required: [alertname]
      additionalProperties: false
      properties:
        namespace:
          type: string
          maxLength: 1024
          default: ''
          description: |
            Omitting it means the **absent-namespace partition** — the one every alert that carries no
            `namespace` label falls into. Leading and trailing whitespace is trimmed, because the stored
            value has to be the one a lookup compares against.
        alertname:
          type: string
          minLength: 1
          maxLength: 1024
          description: Must not be blank after trimming.
          examples: ['KubePodCrashLooping']
        retention_window_seconds:
          type: integer
          format: int32
          minimum: 0
          maximum: 86400
          default: 0
          description: |
            W, in seconds. `0` is legal and is not a no-op: it records "no window here, deliberately",
            which is a different statement from having no row at all.
          examples: [600]
      description: |
        Set the case retention window for one `(namespace, alertname)` pair. The pair is the rule's
        identity: a second create for the same pair is a `409`, and the way to change a window is
        `PATCH /case-policies/{id}`.

    UpdateCasePolicyRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        retention_window_seconds:
          type: integer
          format: int32
          minimum: 0
          maximum: 86400
      description: |
        Partial update. `namespace` and `alertname` are deliberately absent because together they are the
        rule's identity — moving a window from one pair to another is deleting one rule and writing a
        second, and a field that cannot be sent cannot be sent by accident.

    CreateClusterRequest:
      type: object
      required: [cluster_key, display_name]
      additionalProperties: false
      properties:
        cluster_key:
          $ref: '#/components/schemas/ClusterKey'
        display_name:
          type: string
          minLength: 1
          maxLength: 120
      description: |
        Create an identity/failure domain. **`cluster_key` participates in alert identity and cannot be
        changed afterwards** — changing it would re-key every alert in the cluster.

    UpdateClusterRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
      description: |
        Partial update. Every field is optional, and `cluster_key` is deliberately absent because it is
        immutable.

    CreateSourceRequest:
      type: object
      required: [name, cluster_id, kind, base_url]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Must not be blank after trimming. Unique within the org, compared case-insensitively.
        cluster_id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/SourceKind'
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://[^\s]+[^/]$'
          description: Absolute http(s) URL with no trailing slash.
        prometheus_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://[^\s]+[^/]$'
        tls_skip_verify:
          type: boolean
          default: false
        inject_labels:
          $ref: '#/components/schemas/LabelMap'
        ignore_labels:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LabelName'
          default: [prometheus_replica, __replica__, monitor, replica, pod_template_hash]
        redact_labels:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 256
        redact_annotations:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 256
        push_enabled:
          type: boolean
          default: true
        reconcile_interval_seconds:
          type: integer
          format: int32
          minimum: 10
          maximum: 3600
          default: 30
          description: |
            How often the API v2 reconciler polls this source, in seconds. There is no
            `reconcile_enabled` to accompany it - the reconciler runs for every source (ADR 0006).
            `additionalProperties: false`, so sending one is refused by name rather than ignored.
        credential:
          $ref: '#/components/schemas/CredentialInput'
      description: |
        Register an Alertmanager. The response returns the ingest token **once**; there is no way to
        retrieve it later.

    UpdateSourceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        cluster_id:
          $ref: '#/components/schemas/Uuid'
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://[^\s]+[^/]$'
        prometheus_url:
          type: ['string', 'null']
          format: uri
          maxLength: 2048
          pattern: '^https?://[^\s]+[^/]$'
        tls_skip_verify:
          type: boolean
        inject_labels:
          $ref: '#/components/schemas/LabelMap'
        ignore_labels:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LabelName'
        redact_labels:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 256
        redact_annotations:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 256
        push_enabled:
          type: boolean
        reconcile_interval_seconds:
          type: integer
          format: int32
          minimum: 10
          maximum: 3600
          description: |
            How often the API v2 reconciler polls this source, in seconds.

            ⛔ `reconcile_enabled` IS GONE AND CANNOT BE SENT. `PATCH {"reconcile_enabled": false}`
            used to return 200 and persist, switching off the component ADR 0006 calls mandatory
            for that source forever, with nothing on any screen to say so. Because this body is
            `additionalProperties: false`, sending it now fails validation naming the field rather
            than being ignored - a client that still has it in a runbook finds out. How often oto
            polls is tunable here; whether it polls is not.
        credential:
          $ref: '#/components/schemas/CredentialInput'
      description: |
        Partial update; every field is optional and only the supplied ones change. `kind` is absent
        because changing an Alertmanager into a Grafana would reinterpret every payload already stored
        against it.

        Note that **changing `ignore_labels` does not re-key existing alerts.** New identities are
        created from that point forward. This is documented behaviour, not a defect.

    CredentialInput:
      type: object
      required: [kind]
      additionalProperties: false
      writeOnly: true
      properties:
        kind:
          type: string
          enum: [slack_bot_token, slack_app_token, slack_signing_secret, basic, bearer, webhook_signing_secret, none]
        values:
          type: object
          additionalProperties:
            type: string
            maxLength: 4096
          maxProperties: 8
          description: |
            Secret material, sealed with AES-256-GCM before it touches disk. **Write-only: no endpoint
            in this API ever returns it**, and it is never logged.
      description: |
        Secret material for an upstream, a connection, or a channel. Supplying this replaces any
        existing credential and stamps a new rotation timestamp.

    CreateChannelRequest:
      type: object
      required: [type, name, config, connection_id]
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/ChannelType'
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Must not be blank after trimming. Unique within the org, compared case-insensitively.
        config:
          type: object
          additionalProperties: true
          description: |
            Per-destination provider configuration, validated against that provider's published JSON
            Schema — the same bytes served by `GET /api/v1/channel-types` and used to render the
            settings form. Schema failures come back as ordinary `violations[]` with the JSON Pointer as
            `field` and the failing keyword as `code`, so a `#channel-name` where a channel ID belongs
            highlights the exact control.

            Two rules the schema cannot express are enforced server-side: an `Authorization` header in a
            webhook channel's `headers` is rejected (credentials belong in the credential store), and a
            webhook URL resolving to a loopback or link-local address is rejected unless the deployment
            explicitly allows private targets.
        connection_id:
          $ref: '#/components/schemas/Uuid'
          description: |
            The org-wide connection this destination opens through — create one first with
            `POST /api/v1/channel-connections`. `connection_id`'s own `type` must match this request's
            `type`; a mismatch is a `422` on this field, because a Slack destination pointed at a webhook
            connection would carry a credential that means nothing to the Slack provider.
        renderer:
          $ref: '#/components/schemas/RendererId'
        verbosity:
          $ref: '#/components/schemas/Verbosity'
        thread_updates:
          type: boolean
          default: true
        show_field_emoji:
          type: boolean
          default: true
        enabled:
          type: boolean
          default: true
      description: |
        Create a destination instance under an existing connection. There is no `credential` field here
        any more — the connection carries it, and several channels can reference the same one.

    UpdateChannelRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        config:
          type: object
          additionalProperties: true
        connection_id:
          $ref: '#/components/schemas/Uuid'
          description: Re-points this destination at a different connection. The same type-match rule as `CreateChannelRequest.connection_id` applies.
        renderer:
          $ref: '#/components/schemas/RendererId'
        verbosity:
          $ref: '#/components/schemas/Verbosity'
        thread_updates:
          type: boolean
        show_field_emoji:
          type: boolean
        enabled:
          type: boolean
      description: |
        Partial update. `type` is absent because a channel's provider is its identity; `config` is
        replaced wholesale and re-validated against the provider schema.

    ChannelConnectionDTO:
      type: object
      required: [id, type, name, config, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/ChannelType'
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Unique within the org, compared case-insensitively.
          examples: ['Acme Slack workspace']
        config:
          type: object
          additionalProperties: true
          description: |
            Non-secret, org-wide provider configuration, validated against this provider's
            `connection_config_schema`. A Slack connection's carries `team_id`; a webhook connection's is
            currently empty.
          examples:
            - team_id: T9TK3CUKW
        credential_kind:
          type: ['string', 'null']
          enum: [slack_bot_token, slack_app_token, slack_signing_secret, basic, bearer, webhook_signing_secret, none, null]
          description: |
            Which kind of credential is attached. **The credential itself is never returned** — only its
            kind and rotation timestamp.
        credential_rotated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      description: |
        One **org-wide provider setup** — a Slack workspace's bot token, or a webhook receiver family's
        shared credential — set up once and referenced by several channels.

    CreateChannelConnectionRequest:
      type: object
      required: [type, name, config]
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/ChannelType'
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Must not be blank after trimming. Unique within the org, compared case-insensitively.
        config:
          type: object
          additionalProperties: true
          description: |
            Connection-level provider configuration, validated against that provider's published
            `connection_config_schema`.
        credential:
          $ref: '#/components/schemas/CredentialInput'
      description: |
        Create a connection. A `slack` connection must carry a `slack_bot_token` credential; a `webhook`
        connection may have none, a `basic`/`bearer` credential to authenticate outbound to a shared
        receiver, or a `webhook_signing_secret` to sign the outbound payload for the receiver to verify.

    UpdateChannelConnectionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        config:
          type: object
          additionalProperties: true
        credential:
          $ref: '#/components/schemas/CredentialInput'
      description: |
        Partial update. `type` is absent because a connection's provider is its identity; supplying
        `credential` rotates the secret in place, so every channel referencing this connection never
        spends a moment pointing at nothing.

    ResolveConversationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: A Slack channel display name, with or without a leading `#`.
        conversation_id:
          type: string
          pattern: '^[CGD][A-Z0-9]{2,}$'
          description: A Slack channel id.
      description: |
        Ask for the other half of one Slack channel. Supply exactly one of `name` or `conversation_id` —
        the response fills in the one you didn't send.

    ResolveConversationDTO:
      type: object
      required: [conversation_id, conversation_name]
      properties:
        conversation_id:
          type: string
        conversation_name:
          type: string
      description: Both halves of one Slack channel, as Slack itself answered.

    CreatePolicyRequest:
      type: object
      required: [name, reasons, channel_ids]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Must not be blank after trimming. Unique within the org, compared case-insensitively.
        priority:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          default: 100
        enabled:
          type: boolean
          default: true
        matchers:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/MatcherDTO'
        reasons:
          type: array
          minItems: 1
          maxItems: 15
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NotificationReason'
        channel_ids:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        throttle:
          $ref: '#/components/schemas/ThrottleDTO'
        subject_kinds:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [alert, case, digest]
          description: |
            Bind this policy to an altitude of fact. Optional: omitting it — like sending `[]` — claims
            every kind, which is the shipped behaviour and what every payload written before migration
            `00072` means, so adding this field keeps existing clients valid.

            A binding that admits none of the policy's own `reasons` is a `422` on this field: such a
            policy routes nothing and records a `no_policy` suppression for every fact it sees, which
            would look configured on the settings screen and be silent in the channel.

            ⛔ **If this request carries `count_min`, this field must be exactly `["case"]`** — anything
            else is a `422` with code `unsupported` here (`policies_count_case_ck`). An alert's subject is
            its identity and does not change when it fires again, so a count over alert-subject facts
            could never pass a threshold above one and would mute the policy permanently; a digest is
            minted against `digest_floor` by the digest tick, which never reads `count_min` at all.
          examples: [['case']]
        count_min:
          type: integer
          format: int32
          minimum: 2
          maximum: 10000
          description: |
            Stay silent until at least this many facts about the bound subject kind have happened inside
            `count_window_seconds` — the floor to `throttle`'s ceiling. Optional; omitting it means no
            condition.

            One is not admissible: the fact being evaluated is itself inside the window, so a threshold
            of one clears unconditionally. It requires `count_window_seconds`, and it requires
            `subject_kinds` to be exactly `["case"]` — a count needs a unit, and the Case is the only
            unit that can move: an alert's subject is its identity, unchanged across every firing, and a
            digest never reaches the suppressors that would read this. Both rules are cross-field and
            come back as a `422`, the binding one with code `unsupported` on `subject_kinds`.
          examples: [5]
        count_window_seconds:
          type: integer
          format: int32
          minimum: 60
          maximum: 86400
          description: |
            How far back `count_min` counts, as a sliding lookback from the instant of the fact — not a
            tiled window, so there is no divisor rule here. Optional; omitting it means no condition, and
            supplying it without `count_min` is a `422`. It inherits `count_min`'s binding rule too: a
            policy with a count condition must bind exactly `["case"]`.
          examples: [3600]
        digest_window_seconds:
          type: integer
          format: int32
          minimum: 300
          maximum: 86400
          description: |
            Summarise what matched this policy over this many seconds instead of sending one message per
            fact. Optional; omitting it means no digest, which is what every payload written before
            migration `00058` says and why adding it keeps existing clients valid.

            It must divide 86400 — a rule JSON Schema cannot state, so an in-range non-divisor comes back
            as a `422` with code `alignment` on this field. A policy with a window must also list the
            `digest` reason, or its digests would be suppressed as `no_policy` once per window.
        digest_floor:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
          description: |
            Send the digest only if at least this many Cases opened inside the window. Requires
            `digest_window_seconds`; omitting it means no floor.
      description: Create a routing policy. Use the preview endpoint to see what it would do before saving.

    UpdatePolicyRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        priority:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
        enabled:
          type: boolean
        matchers:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/MatcherDTO'
        reasons:
          type: array
          minItems: 1
          maxItems: 15
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NotificationReason'
        channel_ids:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        throttle:
          oneOf:
            - $ref: '#/components/schemas/ThrottleDTO'
            - type: 'null'
        digest_window_seconds:
          type: ['integer', 'null']
          format: int32
          minimum: 300
          maximum: 86400
          description: |
            An explicit `null` turns the summary off; omitting the field leaves it alone. Clearing the
            window also requires clearing `digest_floor` in the same request, because a floor without a
            window is a threshold over an unbounded span (`policies_digest_pair_ck`).
        digest_floor:
          type: ['integer', 'null']
          format: int32
          minimum: 1
          maximum: 10000
          description: |
            An explicit `null` removes the floor — send whenever the window was not empty — which is a
            different request from omitting the field.
        subject_kinds:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [alert, case, digest]
          description: |
            THE ONE FIELD ON THIS REQUEST THAT IS NOT NULLABLE, and the asymmetry is the column's:
            `subject_kinds` is `NOT NULL DEFAULT '{}'`, so there is no `null` to set. **An empty array is
            how a binding is removed** — it means "claim every altitude" — and omitting the field leaves
            the binding alone. `null` is refused rather than silently treated as `[]`.

            Narrowing a binding is cross-checked against both other axes: it is a `422` if the new
            binding admits none of the policy's reasons, and a `422` if the policy carries a `count_min`
            and the new binding is not exactly `["case"]` — code `required` when it names no single kind,
            code **`unsupported`** when the single kind it names is `alert` or `digest`
            (`policies_count_case_ck`). The check runs against the MERGED policy, so a `PATCH` that
            touches only this field can be refused for a `count_min` it never mentioned; clear the count
            condition in the same request to widen the binding.
          examples: [['case']]
        count_min:
          type: ['integer', 'null']
          format: int32
          minimum: 2
          maximum: 10000
          description: |
            An explicit `null` turns the count condition off, which is a different request from omitting
            the field. `policies_count_pair_ck` is **symmetric**, unlike the digest's pair rule, so
            clearing this requires clearing `count_window_seconds` in the same request — neither half of a
            count condition means anything alone.

            ⛔ **Turning a count condition ON requires the policy's `subject_kinds` to be exactly
            `["case"]`** after the merge, whether this request restates the binding or leaves it alone;
            otherwise it is a `422` on `subject_kinds` (`policies_count_case_ck`). See `PolicyDTO.count_min`
            for why `alert` would mute the policy permanently and `digest` would be read by nothing.
        count_window_seconds:
          type: ['integer', 'null']
          format: int32
          minimum: 60
          maximum: 86400
          description: |
            An explicit `null` turns the count condition off, and must be sent together with a `null`
            `count_min` for the reason above.
      description: Partial update; every field is optional and only the supplied ones change.

    PolicyPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        reason:
          $ref: '#/components/schemas/NotificationReason'
        policy:
          $ref: '#/components/schemas/CreatePolicyRequest'
      description: |
        Describe the fact to dry-run. Supply the subject — `case_id` — plus the `reason` to simulate;
        omitting `reason` defaults to `fired`. Supplying an
        inline `policy` evaluates that unsaved draft **in addition to** the stored policies, which is
        what lets the settings form answer "who would this reach?" before anything is saved.

        This endpoint never sends anything.

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples: ['priya@example.com']
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 1024
          writeOnly: true
      description: |
        Local password login. v1 has no SSO and no OIDC; passwords are hashed with argon2id, and a
        failed login is answered with an unspecific 401 that does not reveal whether the account exists.

    CreateTokenRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Must not be blank after trimming. For your own recall — it is shown in the token list.
          examples: ['laptop CLI']
        expires_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Optional expiry, which must be in the future. Omit for a token that never expires.
      description: |
        Mint a personal access token. The secret is returned exactly once in the response and only its
        hash is stored, so it can never be shown again.

