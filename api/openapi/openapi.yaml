        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/sources/{id}/reconcile:
    post:
      operationId: reconcileSource
      summary: Force one reconcile pass now
      tags: [Sources]
      description: |
        Run the reconciler immediately instead of waiting for its interval.

        The reconciler is **not a second ingestion path**: it reads the Alertmanager v2 API, produces
        observations, and feeds them to the same state machine that the webhook feeds. There is exactly
        one write path into alerts.

        It is also the **only** way suppression can ever be observed, because Alertmanager's mute stage
        drops silenced, inhibited and muted alerts before any webhook fires. Turning reconciliation off
        means `suppressed` can never appear.

        Its `divergence_count` — where oto and Alertmanager disagree — is the canary for every
        correctness bug in the system.
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: The reconcile result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
