    SettingBoundDTO:
      type: object
      required: [min, max, why]
      additionalProperties: false
      properties:
        min:
          type: integer
          format: int32
        max:
          type: integer
          format: int32
        why:
          type: string
          description: |
            The argument for the range, in one sentence. It is rendered into the 422 an out-of-range
            write receives, and returned here so a form can say the same thing *before* the write — a
            caller told only "invalid" tries a different wrong number.
      description: One knob's server-enforced range, with the reason it is what it is.

    SettingOrigin:
      type: string
      enum: [default, org, config]
      description: |
        Where an effective value came from, in precedence order:

        - `default` — oto's shipped value is in force and will follow oto's default if that moves;
        - `org` — this org wrote it and it overrides the shipped default;
        - `config` — **this deployment's own configuration** is forcing it, it beats an org override, and
          a `PATCH` naming this key is refused with `409`.

        `config` exists because operators run oto under IaC. Without it, somebody edits a value in the UI,
        the next deploy reverts it, and nobody can work out why the setting changed back — the deployment
        had an opinion and nothing anywhere said so. Look the key up in `config_keys` to find out where it
        is set.

        There is still no hierarchy: one tenant level, one shipped default, one deployment. "Inherited
        from a parent org" remains an answer to a question oto does not have.
      examples: [default]

    OrgSettingsViewDTO:
      type: object
      required: [settings, origins, config_keys, shadowed, bounds]
      additionalProperties: false
      properties:
        settings:
          $ref: '#/components/schemas/OrgSettingsDTO'
        origins:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SettingOrigin'
          description: |
            Per settings key, whether the effective value is oto's default, this org's own, or this
            deployment's configuration.
        config_keys:
          type: object
          additionalProperties:
            type: string
            maxLength: 200
          description: |
            Per key whose origin is `config`, the environment variable or file key that set it —
            `OTO_TUNING_RESOLVE_GRACE_S` or `tuning.resolve_grace_s`. **Keys with any other origin are
            absent**, so a present key means "this is where to go and change it".

            Without this, "managed by configuration" is a wall: it tells an operator they cannot fix the
            value here and nothing about where they can, which turns a five-second edit into an
            archaeology exercise across a Helm chart, a values file and a Deployment's env block.
          examples: [{resolve_grace_s: OTO_TUNING_RESOLVE_GRACE_S}]
        shadowed:
          $ref: '#/components/schemas/OrgSettingsPatchDTO'
        bounds:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SettingBoundDTO'
          description: |
            Per integer settings key, the range the server will accept. The one key that is not an
            integer, `default_verbosity`, is absent; its legal values are its own
            schema's. The bounds apply to a declarative value too: configuration is authoritative about
            *which* value is in force, not about which values are legal.
      description: |
        The effective tuning **and** where each value came from. The pairing is the feature: an effective
        value with no origin cannot be acted on, because "600 because we chose it", "600 because the
        deployment forces it" and "600 because that is what oto ships" behave identically today and
        diverge the moment anything moves.

        Precedence is **shipped default → org override → declarative configuration**, highest last.

    OrgSettingsPatchDTO:
      type: object
      additionalProperties: false
      properties:
        resolve_grace_s: {type: integer, format: int32}
        flap_threshold: {type: integer, format: int32}
        flap_window_s: {type: integer, format: int32}
        flap_digest_interval_s: {type: integer, format: int32}
        raw_retention_days: {type: integer, format: int32}
        event_retention_months: {type: integer, format: int32}
        default_verbosity:
          $ref: '#/components/schemas/Verbosity'
      description: |
        A **partial** tuning: every field is optional and an absent field means "this key is not set".

        As `shadowed` on `OrgSettingsViewDTO` it carries the org's own overrides that are **not in force**,
        because this deployment's configuration is forcing something else. Only shadowed keys are present,
        so an empty object means nothing this org wrote is being overridden. The values are still stored in
        `orgs.settings` and take effect again the moment the corresponding config key is removed — which is
        exactly why they are shown rather than hidden.

        No bounds are stated here: these are values already stored, and the read path *clamps* rather than
        rejects, so a value written before a bound existed can never fail this response.

    OrgSettingsViewResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/OrgSettingsViewDTO'
        meta:
          $ref: '#/components/schemas/Meta'

    UpdateOrgSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        resolve_grace_s:
          type: integer
          format: int32
          minimum: 60
          maximum: 86400
        flap_threshold:
          type: integer
          format: int32
          minimum: 3
          maximum: 100
        flap_window_s:
          type: integer
          format: int32
          minimum: 300
          maximum: 86400
        flap_digest_interval_s:
          type: integer
          format: int32
          minimum: 60
          maximum: 86400
        raw_retention_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
        event_retention_months:
          type: integer
          format: int32
          minimum: 1
          maximum: 120
        default_verbosity:
          $ref: '#/components/schemas/Verbosity'
        reset:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            maxLength: 64
          description: |
            Settings keys to return to oto's shipped default. After a reset the key's origin reports
            `default` again. An unknown key is rejected with 422, never ignored.
          examples: [[resolve_grace_s]]
      description: |
        A partial write. **An omitted key is left alone**; `reset` is the only way to return one to the
        default. Every bound here is a copy of the server's own table and the server checks the *merged*
        state regardless — this schema is a courtesy to the form, not the boundary.

    ApiTokenListResponse:
      type: object
      required: [data, page, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiTokenDTO'
        page:
          $ref: '#/components/schemas/PageInfo'
        meta:
          $ref: '#/components/schemas/Meta'

    ApiTokenCreatedResponse:
