  examples:

    SnoozeForFourHours:
      summary: One of the presets — 4 hours, with a reason
      description: |
        The relative form. oto resolves it against its own clock, so the window is bounded even if the
        caller's clock is wrong.
      value:
        duration_seconds: 14400
        note: 'deploy window, expected until 17:00'

    SnoozeUntilInstant:
      summary: An absolute end instant
      description: |
        The other spelling. Give one or the other — both is a `422`, and so is neither, because there is
        no indefinite snooze and therefore no default window.
      value:
        until: '2026-08-08T17:00:00.000Z'
        note: 'known-noisy during the migration'

    UnsnoozeTwoAlerts:
      summary: Wake two rows a person selected on the Quiet tab
      description: |
        The ids are the ones the operator had on screen. There is no filter form of this request, so the
        extent of the gesture is exactly what is written here.
      value:
        alert_ids:
          - 0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b77
          - 0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b78
        note: 'deploy finished early'

    UnsnoozeAlertsAccount:
      summary: 200 — one alert woke, one was already awake
      description: |
        Partial is the normal case and is still a `200`. Every id named in the request appears exactly
        once, in the order it was given, so a surface can report per row rather than per request.
      value:
        data:
          requested: 2
          woken: 1
          skipped: 1
          results:
            - alert_id: 0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b77
              outcome: woken
              reason: null
            - alert_id: 0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b78
              outcome: skipped
              reason: not_snoozed
        meta:
          request_id: 01JD8Z2K7M3TQ9

    ProblemSnoozeTooLong:
      summary: 422 — a snooze longer than 30 days
      description: |
        The upper bound is not advisory. An unexpiring snooze is a mute, and a muted channel is how a
        real incident goes unseen; the same bound is enforced in the domain constructor and by a CHECK
        constraint, so no path can write one.
      value:
        type: https://oto.dev/errors/validation_failed
        title: Validation failed
        status: 422
        detail: 1 field failed validation.
        instance: /api/v1/alerts/01J9F3Q0V6N5X8B2C4D6E8F0A1/snooze
        code: validation_failed
        request_id: 01JD8Z2K7M3TQ9
        violations:
          - field: until
            code: max
            message: 'a snooze may last at most 30 days; there is no indefinite snooze'

    AlertRollupPage:
      summary: The alert list rolled up by alert name
      description: |
        Counts are over the **whole filtered result set**, not over a page — which is the only reason
        the endpoint exists. `severity_counts` reports the raw label values as written upstream, so a
        deployment using `sev1`/`P1` sees its own vocabulary back.
      value:
        data:
          - key: KubePodCrashLooping
            group_by: alertname
            state: firing
            total_count: 47
            firing_count: 31
            suppressed_count: 2
            resolved_count: 12
            expired_count: 2
            flapping_count: 4
            severity_counts:
              critical: 31
              warning: 16
            first_seen_at: '2026-07-02T11:04:18.221Z'
            last_seen_at: '2026-08-08T09:20:12.443Z'
          - key: KubeletDown
            group_by: alertname
            state: resolved
            total_count: 3
            firing_count: 0
            suppressed_count: 0
            resolved_count: 3
            expired_count: 0
            flapping_count: 0
            severity_counts:
              critical: 3
            first_seen_at: '2026-08-01T02:12:00.000Z'
            last_seen_at: '2026-08-03T18:44:51.019Z'
        page:
          next_cursor: eyJrIjoiS3ViZWxldERvd24iLCJoIjoiOWYxYzJhM2I0ZDVlNmY3MCJ9
          has_more: true
          limit: 2
        meta:
          request_id: 01JD8Z2K7M3TQ9
          elapsed_ms: 21

    ProblemValidationFailed:
      summary: 422 — three fields failed validation
      description: |
        The canonical validation failure. `violations[]` is always present on this code, every `field`
        is a `/`-separated path in **JSON** names, and every `code` comes from a closed set — so the UI
        can map each violation onto the exact form control that produced it without any per-endpoint
        knowledge. A few other codes carry `violations[]` too when they can name the parameter or
        setting at fault; see the `Problem` schema.
      value:
        type: https://oto.dev/errors/validation_failed
        title: Validation failed
        status: 422
        detail: 3 fields failed validation.
        instance: /api/v1/notification-policies
        code: validation_failed
        request_id: 01JD8Z2K7M3TQ9
        violations:
          - field: name
            code: required
            message: name is required
          - field: matchers/0/name
            code: labelname
            message: must be a valid Prometheus label name
          - field: channel_ids
            code: min_items
            message: channel_ids must contain at least 1 item

    ProblemProviderSchemaFailed:
      summary: 422 — provider config rejected by its own JSON Schema
      description: |
        Channel config failures come back in exactly the same shape as any other 422. The `field` is the
        JSON Pointer from the schema validator and the `code` is the JSON Schema keyword that failed, so
        a settings form generated from `config_schema` can highlight the offending control without
        knowing anything about Slack.
      value:
        type: https://oto.dev/errors/validation_failed
        title: Validation failed
        status: 422
        detail: The channel configuration does not satisfy the slack provider schema.
        instance: /api/v1/channels
        code: validation_failed
        request_id: 01JD8Z2K7M3TQA
        violations:
          - field: config/conversation_id
            code: pattern
            message: 'must be a channel ID such as C7F2X9QLM, not a #name'
          - field: config/max_instances
            code: maximum
            message: must be <= 20

    ProblemConflict:
      summary: 409 — a name the caller chose is already taken
      description: |
        A unique violation on a key **the caller supplied**. Re-read and retry with a different value.
        Contrast this with a unique violation on a key oto computed (`alert_key`, `group_key`, the
        notification `idempotency_key`), which is not an error at all — it is the idempotency
        mechanism, and it never reaches the caller.
      value:
        type: https://oto.dev/errors/conflict
        title: Conflict
        status: 409
        detail: A channel named "#sre-alerts" already exists in this organisation.
        instance: /api/v1/channels
        code: channel_name_taken
        request_id: 01JD8Z2K7M3TQB

    ProblemIdempotencyKeyReuse:
      summary: 409 — this Idempotency-Key was already used, and it worked
      description: |
        The caller retried a credential-minting request with a key it had already spent. **The first
        attempt succeeded**, so nothing was minted a second time; `detail` names what that attempt
        created so the caller can act on it. The secret is not repeated — it never can be. See
        `IdempotencyKeyHeader`.
      value:
        type: https://oto.dev/errors/conflict
        title: Conflict
        status: 409
        detail: >-
          This Idempotency-Key was already used, and that request created
          0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b77; its secret was returned to that request and oto cannot
          return it a second time. If you never received it, revoke that id and retry with a new key.
        instance: /api/v1/api-tokens
        code: idempotency_key_reuse
        request_id: 01JD8Z2K7M3TQF

    ProblemPrecondition:
      summary: 412 — the entity is in the wrong state
      value:
        type: https://oto.dev/errors/precondition_failed
        title: Precondition failed
        status: 412
        detail: Case 3 of this alert is resolved and can no longer be acknowledged.
        instance: /api/v1/alerts/0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b77/ack
        code: case_terminal
        request_id: 01JD8Z2K7M3TQC

    ProblemNotFound:
      summary: 404 — no such resource in this org
      value:
        type: https://oto.dev/errors/not_found
        title: Not found
        status: 404
        detail: No alert with that id.
        instance: /api/v1/alerts/0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b77
        code: alert_not_found
        request_id: 01JD8Z2K7M3TQD

    ProblemUnauthenticated:
      summary: 401 — missing or bad credential
      value:
        type: https://oto.dev/errors/unauthenticated
        title: Unauthenticated
        status: 401
        detail: The presented credential is missing, expired or revoked.
        instance: /api/v1/alerts
        code: unauthenticated
        request_id: 01JD8Z2K7M3TQE

    ProblemUnknownParameter:
      summary: 400 — an unknown query parameter
      description: |
        Unknown query parameters are rejected rather than ignored. A typo silently returning the
        unfiltered list is how a UI quietly starts lying about what it is showing.
      value:
        type: https://oto.dev/errors/malformed_request
        title: Malformed request
        status: 400
        detail: 'Unknown query parameter: "sevrity".'
        instance: /api/v1/alerts
        code: unknown_parameter
        request_id: 01JD8Z2K7M3TQF

    ProblemCursorMismatch:
      summary: 400 — cursor does not match the current filter set
      description: |
        Every cursor is bound to the filter set that minted it. Changing a filter invalidates
        pagination, so the client must restart from the first page rather than silently paging through
        a different result set.
      value:
        type: https://oto.dev/errors/malformed_request
        title: Malformed request
        status: 400
        detail: The cursor was issued for a different filter set. Restart pagination.
        instance: /api/v1/alerts
        code: cursor_filter_mismatch
        request_id: 01JD8Z2K7M3TQG

    ProblemIngestUnauthorized:
      summary: 401 — ingest token missing, revoked, or scoped to a different source
      description: |
        One of only three 4xx codes this endpoint may return, and permanent by nature: retrying with the
        same credential can never succeed, so Alertmanager discarding the notification loses nothing.
      value:
        type: https://oto.dev/errors/unauthenticated
        title: Unauthenticated
        status: 401
        detail: The ingest token is not valid for this source.
        instance: /api/v1/ingest/alertmanager/0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b77
        code: unauthenticated
        request_id: 01JD8Z2K7M3TQH

    ProblemIngestUnavailable:
      summary: 503 — backpressure, with Retry-After
      description: |
        The **only** response oto gives for any transient condition on the ingest path. 5xx is the only
        class Alertmanager retries, so this is the designed backpressure channel: the alert is not lost,
        it simply arrives on Alertmanager's next attempt.
      value:
        type: https://oto.dev/errors/unavailable
        title: Service unavailable
        status: 503
        detail: Ingest capacity is exhausted. Retry shortly.
        instance: /api/v1/ingest/alertmanager/0198f3c1-6a2e-7c31-9b4d-2f5a1c8e0b77
        code: unavailable
