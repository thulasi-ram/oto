  # =================================================================================================
  # Snoozes (org-wide)
  # =================================================================================================

  /api/v1/snoozes:
    get:
      operationId: listActiveSnoozes
      summary: Everything oto is currently quiet about, org-wide
      tags: [Alerts]
      description: |
        **Every active snooze in the org, with its expiry, soonest wake-up first.**

        This is the counterweight that makes snooze safe to ship. §B.8.6 requires a persistent,
        dismissible banner enumerating every quiet period in force "so a snooze cannot be forgotten" —
        a damper nobody can enumerate is the silent suppression oto refuses to ship, arriving by the
        back door. This endpoint is what that banner reads.

        > ### ⛔ This is not `GET /api/v1/alerts?snoozed=true`, and that cannot be made into it
        >
        > That operation pages **alerts**. It answers *which alerts are quiet* and structurally cannot
        > answer *who asked, why, and until when*, because those are facts about an `alert_snoozes`
        > row and one alert has a whole history of them. Nor can it order by expiry, which is the one
        > ordering a banner is read in. Use `?snoozed=true` to filter the alert list; use this to
        > review the quiet periods themselves.

        ### What "active" means here

        A row appears while it is **open and its clock has not run out**, evaluated against **oto's**
        clock rather than the caller's — a client whose clock is wrong must not be able to disagree
        with the server about what is muted. A snooze whose time has passed but which the 60-second
        expiry sweep has not yet closed is already gone from this list: it is no longer suppressing
        anything, and listing it would overstate how quiet oto is.

        Ended snoozes are **not** here. Per-alert history, including how each one finished, is at
        `GET /api/v1/alerts/{id}/snoozes`.

        ### Ordering

        By `snoozed_until` ascending, so the banner reads as a countdown: what comes back first is at
        the top. `remaining_seconds` is computed server-side against the same instant for every row on
        the page, so the list never disagrees with itself about what time it is.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of active snoozes, soonest wake-up first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveSnoozeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # =================================================================================================
  # Cases
  # =================================================================================================

  /api/v1/cases:
    get:
      operationId: listCases
      summary: List firing episodes across the whole organisation
      tags: [Cases]
      description: |
        **What is firing that somebody needs to acknowledge.**

        A Case is ONE contiguous firing episode of ONE alert, `(alert_id, seq)`. It is what a human
        acknowledges, and this is the only list in the product that can be filtered by acknowledgement
        — `alerts` carries no ack column, because a receipt belongs to the firing it was given for and
        the alert identity outlives that firing. `?state=open&ack=unacked` is the queue.

        **Filter semantics** are the alert list's: comma-separated values within one parameter are
        OR-ed, distinct parameters are AND-ed, and **unknown query parameters are rejected** with
        `400 unknown_parameter` rather than silently ignored.

        **A case's `state` is `open` or `closed`, and it is the only liveness axis here.** The four
        words `firing | suppressed | resolved | expired` describe the ALERT, and every alert-shaped
        object in this contract carries them. What an episode adds is `resolve_reason` — `upstream`
        for a resolution the source asserted, `timeout` for one oto never heard — and
        `suppression_reason`, which names the silence that muted that firing. A client wanting the
        four-word reading composes it from those fields exactly as the server does.

        There used to be a separate `open` boolean here. While `state` held four values the two were
        genuinely different questions; with two values they are one, and `open` is gone.

        **Every row carries its alert**, batch-loaded for the whole page in one further query. An
        episode has no `alertname` and no `severity` of its own — those describe the identity, not the
        firing — so a row without the reference could not be rendered without a request per row.

        **Ordering is fixed at `-started_at`** (newest episode first) with the case id as tiebreak, and
        there is no `sort` parameter: a keyset cursor is only sound over an indexed total order, and
        this list has exactly one.

        **What this endpoint deliberately does not offer:** the label selector, free-text `q`,
        `flapping` and `snoozed`. The first two are answered by GIN indexes on the ALERT and reaching
        them once per case row turns a keyset page into a scan of the identity table; the last two are
        properties of the identity that say nothing about which of its episodes you are looking at.
        Use `GET /api/v1/alerts` for those, and `GET /api/v1/alerts/{id}/cases` to open one alert's
        history.
      parameters:
        - name: state
          in: query
          description: |
            Comma-separated EPISODE states — `open`, `closed`, or both. This is `alert_cases.state`
            and it is the whole of what an episode says about itself. Naming both values is the same
            as omitting the parameter.
          schema:
            type: array
            maxItems: 2
            uniqueItems: true
            items:
              $ref: '#/components/schemas/CaseState'
          style: form
          explode: false
          examples:
            live:
              summary: Only episodes that are still running
              value: [open]
        - name: ack
          in: query
          description: |
            Comma-separated acknowledgement states. **`unacked` is the queue people work from** and is
            what this endpoint exists to answer; it is served by `case_ack_idx (org_id, ack_state,
            started_at DESC, id DESC) WHERE ended_at IS NULL`, so pair it with `state=open`.
          schema:
            type: array
            maxItems: 2
            uniqueItems: true
            items:
              $ref: '#/components/schemas/AckState'
          style: form
          explode: false
          examples:
            queue:
              summary: Nobody has looked at these
              value: [unacked]
        # ⛔ `group_id` WAS A PARAMETER HERE AND IT IS DELETED, NOT DEPRECATED (git-bug
        # `7570090`, migration `00069`). It took AlertGroup ids and asked "which episodes is
        # that thread about"; `alert_groups` and the `alert_cases.group_id` column are both
        # gone, so there is no membership left to select on and no Case belongs to any
        # container any more.
        #
        # ⭐ REMOVING IT FROM THIS LIST IS WHAT MAKES THE FAILURE LOUD. The parameter is no
        # longer declared, so `httpx.NewParams` puts it in `unknown` and an old caller gets
        # `400 unknown_parameter` naming `group_id` — TOLD, in one round trip. The interim
        # `deprecated: true` served an EMPTY PAGE instead, which let a dashboard that had
        # quietly stopped showing anything look merely idle. What must never happen is the
        # third outcome: accepting the parameter and ignoring it, which serves the whole
        # org's case list under a filtered request. That is a silent widening of a filtered
        # read and it is the one failure nothing reports.
        #
        # ⛔ AND IT IS DELIBERATELY NOT RENAMED TO `conversation_id`, which is what the same
        # rename did to `GET /notifications`. That parameter had a successor because a
        # notification still has a delivery target to be narrowed by; this one has none,
        # because the Case IS the conversation. Filtering Cases by conversation id would be
        # filtering them by their own id, which is `GET /api/v1/cases/{id}`. Nothing is
        # offered under a new name because there is nothing left to ask.
        - name: severity
          in: query
          description: |
            Comma-separated severity values, matched against the alert's promoted `severity` label. Not
            a closed enum — operators choose their own vocabulary.
          schema:
            type: array
            maxItems: 16
            uniqueItems: true
            items:
              type: string
              maxLength: 4096
          style: form
          explode: false
          examples:
            urgent:
              value: [critical, warning]
        - name: cluster
          in: query
          description: Comma-separated cluster keys. Cluster participates in alert identity, so this is an identity filter, not a tag filter.
          schema:
            type: array
            maxItems: 32
            uniqueItems: true
            items:
              $ref: '#/components/schemas/ClusterKey'
          style: form
          explode: false
        - name: namespace
          in: query
          description: Comma-separated namespaces, matched against the alert's promoted `namespace` label.
          schema:
            type: array
            maxItems: 64
            uniqueItems: true
            items:
              type: string
              maxLength: 4096
          style: form
          explode: false
        - name: alertname
          in: query
          description: Comma-separated alert names, matched exactly against the alert's promoted `alertname` label.
          schema:
            type: array
            maxItems: 64
            uniqueItems: true
            items:
              type: string
              maxLength: 1024
          style: form
          explode: false
        - $ref: '#/components/parameters/SyntheticParam'
        - name: since
          in: query
          description: |
            Lower bound on `started_at` — the same column this list is ordered and paged by, so it
            narrows the very scan the cursor walks. Page backwards through the sorted list to reach an
            upper bound.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of firing episodes, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListItemListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

