  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: Audit the notification intents
      tags: [Notification]
      description: |
        Every intent oto formed, including the ones it deliberately suppressed and why. Suppression is
        always recorded: damping that cannot be inspected is indistinguishable from a bug, and silence
        that cannot be explained destroys trust.
      parameters:
        - name: status
          in: query
          description: Comma-separated statuses.
          schema:
            type: array
            maxItems: 6
            uniqueItems: true
            items:
              $ref: '#/components/schemas/NotificationStatus'
          style: form
          explode: false
        - name: reason
          in: query
          description: Comma-separated reasons.
          schema:
            type: array
            maxItems: 15
            uniqueItems: true
            items:
              $ref: '#/components/schemas/NotificationReason'
          style: form
          explode: false
        - name: suppressed_reason
          in: query
          description: Comma-separated suppression reasons. Implies `status=suppressed`.
          schema:
            type: array
            maxItems: 7
            uniqueItems: true
            items:
              type: string
              enum: [channel_disabled, no_policy, snoozed, throttled, below_threshold, verbosity, duplicate_render]
          style: form
          explode: false
        - name: conversation_id
          in: query
          description: |
            Narrow to one CONVERSATION — "show me every intent that landed on this thread". The id alone
            is discriminating without the kind beside it: it holds an `alert_cases.id` for a case
            conversation and a `notification_policies.id` for a digest, and one cannot accidentally match
            the other.

            ⛔ **It was spelled `group_id` and that spelling is now REJECTED, not ignored.** `group_id`
            named `notifications.group_id`, a column deleted with `alert_groups` (git-bug `7570090`,
            migration `00069`); the delivery target it asked about survived under the new name. An
            unknown query parameter is a `400 unknown_parameter` (§E.3), so a caller still sending the
            old name is told so in one round trip rather than served the whole unfiltered audit page.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: alert_id
          in: query
          schema:
