        The single snapshot bound to this episode. Because it was captured at fire time rather than read
        live, an episode from six weeks ago still reports the threshold that was actually in force then —
        even if the rule has since been changed or deleted outright.

        A `404` here means no snapshot could be captured for this episode at all (no Prometheus URL
