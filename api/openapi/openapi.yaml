      tags: [Channels]
      description: |
        Static descriptors for every registered provider: display name, capabilities, accepted credential
        kinds, available renderers, and the **JSON Schema for its configuration**.

        That schema is served verbatim and is the same bytes the server validates against. The settings
        form renders and pre-validates itself from it, which is why adding a provider requires a schema
        file and **no UI code at all**.

        v1 ships exactly two providers: `slack` (full) and `webhook` (a generic JSON POST). The webhook
        provider exists to prove the abstraction holds and is deliberately denied Slack-specific
        affordances.
      responses:
        '200':
          description: Provider descriptors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelTypeListResponse'
        '400':
