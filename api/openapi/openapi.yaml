openapi: 3.1.0

info:
  title: oto API
  version: 1.0.0
  summary: The alert history layer your Prometheus stack does not have.
  description: |
    ## What oto is

    **oto** (音, Japanese for *sound* — a chime) is a self-hosted alert-history layer that sits over an
    existing Prometheus/Alertmanager stack. For every alert that has ever fired it can show: when it
    first appeared, every episode since, **what the rule said at that moment**, who was told, on which
    channel, in which thread, who acknowledged it, and how it ended — as one continuous, replayable
    timeline.

    oto is **not** an incident manager, an on-call/paging system, a workflow engine, a rule editor, or
    an AI investigator, and it has **no write path into your cluster**. Silences are a strictly
    read-only mirror of Alertmanager's.

    ## The resource model

    The vocabulary below is binding. Do not introduce synonyms; the words `incident`, `issue`, and
    unqualified `event` do not exist in this API.

    | Resource | Means |
    |---|---|
    | **Alert** | The **identity of a label set** within `(org, cluster)`, keyed by `alert_key`. Created on first sight, survives resolution forever. The nearest analogue is Sentry's *Issue*. |
    | **AlertCase** | One **contiguous firing episode** of an Alert, addressed as `(alert_id, seq)`. This is what you acknowledge and whose firing duration is measured, and since git-bug `7570090` it is also the **conversation**: one Case owns exactly one chat thread. |
    | **AlertEvent** | One **immutable thing that happened at one instant**. Append-only; this is the timeline. Every event carries two timestamps — `occurred_at` (the upstream claim, which is what the UI displays) and `recorded_at` (oto's own clock, which is what timelines are ordered by). They are never conflated, because upstream clock skew is measured rather than rejected. |
    | **RuleSnapshot** | A content-addressed capture of a Prometheus alerting rule (`expr`, `for`, `keep_firing_for`, labels, annotations) at fire time. Rule drift between cases is detected and surfaced. |
    | **AlertSource** | One configured Alertmanager, optionally paired with its Prometheus. HA replicas share a Cluster. |
    | **Channel** | A configured *destination instance* ("Slack workspace T123, #sre-alerts") — not a channel *type*. |
    | **Notification** | The channel-agnostic **intent** to communicate one fact. Idempotent. |
    | **NotificationDelivery** | **One materialisation** of a Notification on one Channel, owning retry state and provider ids. |

    Current state is always a *projection* over the append-only event log, never the only record.
    `Alert.state` is the state of the current open case (or, if none is open, of the most recent one).

    ⛔ **`AlertGroup` WAS A RESOURCE IN THE TABLE ABOVE AND IS NOT ONE NOW** (git-bug `7570090`,
    migration `00069`). It *was* one generation of one machine-derived grouping of alerts, keyed by
    `(org, cluster, alertname, namespace-or-∅)`, and it owned the chat thread. It is deleted root and
    branch — the `alert_groups` table, the `/alert-groups` routes and the `AlertGroup.state`
    projection with it — because a conversation holds exactly **one Case**: a generation held many,
    which is what made "ack the thread" and "ack the episode" two requests instead of one. The word is
    kept on the record here so that a reader who meets it in an older client, an `alert_events.group_id`
    column or a tombstone below knows what it named; **it is not part of the binding vocabulary, and
    nothing creates, addresses or resolves one.** What survives is residue and is labelled as such
    wherever it appears: the `group_id` on an event or frame payload is the historical
    `alert_events.group_id` column, and `GroupState` is an enum nothing advances. The one filter that
    named it, `?group_id=` on `GET /cases`, is **deleted rather than deprecated** — a Case has no
    membership to select on, so that spelling is now `400 unknown_parameter` and a caller still
    sending it is told rather than served an empty page.

    ## The alert lifecycle

    The authoritative state machine runs on the **AlertCase** and has **two orthogonal axes**.

    `state` — *what the world is doing* — is owned by ingestion and the reconciler:

    - `firing` — Alertmanager reports this label set active and not suppressed.
    - `suppressed` — active but silenced, inhibited or muted. **Never observable via a webhook**:
      Alertmanager's mute stage drops muted alerts before the webhook fires, so only the API v2
      reconciler can ever set this state.
    - `resolved` *(terminal)* — an explicit per-alert `status="resolved"` observation was received.
    - `expired` *(terminal)* — oto stopped hearing about the alert while its source was healthy.

    **`expired` is not `resolved`.** Losing sight of an alert is not the alert going away, and oto never
    fabricates a resolution. The reaper that produces `expired` is *blocked* while the owning source is
    anything other than healthy, so killing Alertmanager can never mass-resolve your alerts.

    `ack_state` — *what humans have done* — is owned by this API and is `unacked` or `acked`. **An acked
    alert is still firing.** Acking from the Slack button and acking via `POST /cases/{id}/ack` go
    through the same service method and produce identical state.

    **`ack_state` belongs to the case and to nothing else.** An acknowledgement is a receipt for
    one firing episode; it has no meaning once that episode has closed, and an Alert outlives every one
    of its episodes. So there is no `ack` filter on `GET /alerts`, no `ack_state` on `AlertDTO` and no
    ack counter on a roll-up bucket — ask `include=current_case`, or ask the group surface, which
    reads each member's ack from that member's own episode.

    A re-fire of the same `alert_key` opens a **new case** on the same Alert, at the next `seq` and
    **unacknowledged** — always. A Case is strictly terminal: `open` then `closed`, once. There used
    to be a grace window inside which a re-fire reopened the closed episode and carried its
    acknowledgement across the gap; there is not, because the second firing is not the one that was
    signed for. `flap_score` and `is_flapping` are **RETIRED**: they are read from the row and never
    written again, so each is the last verdict the removed flap detector recorded rather than a
    current one, and no notification is withheld because an alert is noisy. Flap noise is handled at
    case formation by the **case retention window**, below.
    `storm_mode` was their companion and is gone: storm damping is removed,
    because a storm is many DIFFERENT alerts arriving together and the thing that owns many different
    alerts is an incident, which oto does not model.

    ## Conventions

    - Every path is under `/api/v1`, and evolution is additive-only. The ops surface
      (`/healthz`, `/readyz`, `/metrics`, `/openapi.json`) is deliberately unversioned.
    - **The UI has zero private endpoints.** Everything the UI does, this document describes.
    - Every collection response is enveloped as `{ data, page, meta }`; every single-resource response as
      `{ data, meta }`.
    - **Pagination is keyset only. There is no `OFFSET` anywhere in oto, and no `total` on an unbounded
      collection.** See the `Cursor` and `PageInfo` schemas.
    - All timestamps are RFC 3339 UTC with milliseconds, e.g. `2026-08-07T09:14:22.114Z`.
    - Errors are RFC 9457 `application/problem+json`. A 422 always carries `violations[]` whose `field`
      values are `/`-separated **JSON** paths (`matchers/0/name`), never Go field names.
    - Every mutating endpoint accepts an `Idempotency-Key` request header. The retention window is
      **24 hours**, and the endpoints whose response carries a secret **refuse** a replay rather than
      replaying it — see `IdempotencyKeyHeader` for why oto cannot return a credential twice.
    - Unknown query parameters are **rejected** with `400 unknown_parameter`, and unknown JSON body
      fields are rejected with `422`. This is how the UI and the API stay honest.

    ### Validation bounds are one source of truth

    Every bound expressed in this document (`maxLength`, `pattern`, `enum`, `minimum`, `maxItems`, …) is
    byte-identical to the corresponding Go `validate` struct tag and the corresponding PostgreSQL
    `CHECK` constraint. CI asserts the three agree. If this document and the server disagree, that is a
    build failure, not a documentation nit.

    ### The ingest path is different on purpose

    `POST /api/v1/ingest/alertmanager/{source_id}` decodes **leniently** and applies hand-written bounds
    instead of strict binding, because a 4xx on that path makes Alertmanager delete the notification
    permanently. It may return only `202`, `400`, `401`, `413` and `503`. It never returns `429`, and it
    never returns a 4xx for anything transient. See the endpoint description for the full contract.
  contact:
    name: oto
    url: https://github.com/otohq/oto
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: '{origin}'
    description: |
      A self-hosted oto deployment. oto always serves this API from the root of its own origin, so the
      only variable is where you installed it.
    variables:
      origin:
        default: https://oto.internal
        description: The scheme and host of your oto deployment, with no trailing slash and no path.

externalDocs:
  description: The binding specification (SPEC.md) — this document renders §E of it.
  url: https://github.com/otohq/oto/blob/main/docs/design/SPEC.md

tags:
  - name: Ingest
    description: |
      The Alertmanager/Grafana webhook receiver. Decoupled from everything else: the handler durably
      records the raw payload and enqueues work in one short transaction, and makes **no outbound
      network call**. Authenticated with an ingest token scoped to exactly one source.
  - name: Alerts
    description: Alert identities, their episodes, their timelines and the human actions taken on them.
  - name: Cases
    description: |
      Individual firing episodes, addressed directly — and the per-`(namespace, alertname)` **case
      retention window** that decides when a resolved episode closes, and therefore whether a flapping
      alert is one case or six.
  - name: Rules
    description: Content-addressed rule snapshots captured at fire time. The differentiator.
  - name: Sources
    description: Alertmanager/Prometheus registry, clusters, credentials and per-source health.
  - name: Channels
    description: Provider descriptors and configured destination instances.
  - name: Notification
    description: Policies, notification intents, deliveries and the dry-run preview.
  - name: Silences
    description: A read-only mirror of Alertmanager silences. oto has no silence write path.
  - name: Discovery
    description: Label and enricher discovery, used to populate the filter bar and settings screens.
  - name: Drills
    description: |
      Delivery drills: one synthetic alert pushed through the **real** pipeline — ingestion, alert
      identity, grouping, the notification policy match, the rule snapshot, threading, the ordering
      gate and the delivery record — so an operator can prove the notification path works without
      waiting for an outage. The result names the stage that failed. A drill's alert is marked
      synthetic, is excluded from every statistic oto reports, and is deleted automatically.
  - name: Stats
    description: |
      Alert-hygiene accounting. Team- and alert-scoped only: per-person response-time metrics,
      leaderboards and per-individual aggregates are unrepresentable in oto by construction.
  - name: Streaming
    description: The SSE live stream with durable, replayable resume.
  - name: Identity
    description: Sessions, the current principal and personal access tokens.
  - name: Integrations
    description: Inbound provider callbacks. Slack interactivity is HTTP-only; oto implements no Socket Mode client.
  - name: Ops
    description: Unversioned operational surface. Unauthenticated by design.

security:
  - sessionCookie: []
  - bearerPat: []

paths:

  # =================================================================================================
  # Ingest
  # =================================================================================================

  /api/v1/ingest/alertmanager/{source_id}:
    post:
      operationId: ingestAlertmanagerWebhook
      summary: Receive an Alertmanager or Grafana webhook batch
      tags: [Ingest]
      security:
        - ingestToken: []
      description: |
        Durably persist one raw webhook batch and enqueue it for processing. Point a stock Alertmanager
        `webhook_config` here with the ingest bearer token; **no other Alertmanager configuration is
        required.**

        ### What this handler does, and what it refuses to do

        In one short transaction it records the raw body and enqueues work — nothing else. It makes
        **no outbound network call** to Slack, Prometheus or Kubernetes, and it runs on a dedicated
        connection pool with a 2-second statement timeout so that a slow dashboard query can never
        starve ingestion. Target p99 is under 250 ms for a 200-alert batch.

        **A 2xx is a promise.** oto never returns one for a payload it failed to persist.

        ### The response contract is deliberately narrow

        Alertmanager retries **only** 5xx. A 4xx — including 429 — makes it discard the notification
        **permanently and silently**: the alert is gone, and nobody finds out. Therefore:

        | Condition | Status |
        |---|---|
        | Durably persisted, or a duplicate of one already persisted | `202` |
        | Overload, pool exhaustion, statement timeout, slow database, queue insert failure — **anything transient** | `503` with `Retry-After` |
        | Missing, invalid or revoked token, or a token scoped to a different source | `401` |
        | Body over 8 MiB | `413` |
        | Body that cannot be decoded at all, or nested deeper than 32 levels | `400` |

        **This endpoint never returns 429, and never returns a 4xx for anything transient.** The three
        4xx codes above are the only ones it can produce, and all three are genuinely permanent — a
        retry with the same bytes and the same token could not succeed. Every one of them is also
        recorded as a rejection, so nothing disappears without a trace.

        ### Per-alert problems never fail the batch

        Bounds are applied per alert, not per request. An alert with more than 64 labels, a label value
        over 4 KiB, an invalid label name, a missing `alertname`, or a `startsAt` outside
        `now - 365d … now + 24h` is **recorded as a rejection with a reason and a metric**, the rest of
        the batch is processed, and the response is still `202`. Excess annotations are dropped, long
        annotation values truncated with a marker, and a batch over 10 000 alerts truncated — always
        recorded, never silent. No input under 8 MiB presented with a valid token can produce a 4xx.

        ### Duplicates are expected

        A clustered Alertmanager is at-least-once by design, and a network partition guarantees
        duplicates. oto derives a dedup key from the batch content, so a replay returns `202` with the
        original `batch_id` and `duplicate: true`, and produces exactly one alert, one case and
        one chat message.

        ### Redaction happens before persistence

        Label and annotation values matching the source's redaction globs are removed from the in-memory
        payload **before** the raw batch is written, so a secret in an annotation never lands on disk and
        never reaches a log line.
      parameters:
        - $ref: '#/components/parameters/SourceIdPathParam'
      requestBody:
        required: true
        description: |
          The Alertmanager v4 webhook envelope. Decoded **leniently**: unknown fields are accepted and
          ignored rather than rejected, because Alertmanager emits undocumented fields, Grafana Unified
          Alerting emits a superset, and a custom `payload:` template can emit anything. A body that
          cannot be decoded into the envelope at all is recorded and answered with `400`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertmanagerWebhookPayload'
            examples:
              alertmanagerV4:
                $ref: '#/components/examples/AlertmanagerWebhookRequest'
      responses:
        '202':
          description: |
            Accepted and durably persisted, or recognised as a duplicate of a batch already persisted.
            Alertmanager ignores this body on 2xx; it exists for humans and for oto's own tests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAcceptedResponse'
              examples:
                accepted:
                  $ref: '#/components/examples/IngestAcceptedFresh'
                duplicate:
                  $ref: '#/components/examples/IngestAcceptedDuplicate'
        '400':
          description: |
            The body could not be decoded into the webhook envelope, or exceeded the 32-level nesting
            limit. Permanent: the same bytes will never decode. Recorded as a rejection.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: |
            The ingest token is missing, malformed, revoked, expired, or scoped to a different source.
            Permanent by nature. Note this is a `401` and never a `403`: a token for the wrong source is
            simply not a credential for this endpoint.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unauthenticated:
                  $ref: '#/components/examples/ProblemIngestUnauthorized'
        '413':
          description: |
            The body exceeded 8 388 608 bytes (8 MiB). Permanent. Recorded as a rejection. Configure
            `max_alerts` upstream, or split the receiver.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: |
            oto is shedding load — pool exhaustion, statement timeout, a slow database, or a failed
            queue insert. **The only response for any transient condition**, because 5xx is the only
            class Alertmanager retries. The alert is not lost; it arrives on the next attempt, well
            inside Alertmanager's retry budget.
          headers:
            Retry-After:
              description: Seconds to wait. oto asks for 5.
              schema:
                type: integer
                format: int32
                minimum: 1
                examples: [5]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unavailable:
                  $ref: '#/components/examples/ProblemIngestUnavailable'

  # =================================================================================================
  # Alerts
  # =================================================================================================

  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: List, filter and search alerts
      tags: [Alerts]
      description: |
        The workhorse. Keyset-paginated and designed to render ten thousand alerts with every filter
        below applied at p95 under 300 ms.

        **Filter semantics.** Comma-separated values within one parameter are OR-ed; distinct parameters
        are AND-ed. So `?state=firing,suppressed&severity=critical` means *(firing OR suppressed) AND
        critical*. Label selectors follow the same rule: repeated `label[k]=v` for one key OR together,
        and distinct keys AND together.

        **Unknown query parameters are rejected** with `400 unknown_parameter`. A typo must not silently
        return an unfiltered list — that is how a dashboard starts quietly lying about what it shows.

        **Sorting** is deliberately restricted to two keys, because a keyset cursor is only sound over an
        indexed, total ordering.

        **`include` avoids the N+1.** Without it the response is one row per alert; with it, the named
        sub-resources are batch-loaded and embedded. `rule` is the one that embeds a **reference**
        rather than the object — see `RuleSnapshotRefDTO` — and
        `GET /api/v1/rule-snapshots/batch` resolves a whole page of those refs in one further call, so
        showing `expr` on the list costs two requests rather than one per row (ADR 0025).

        **`snoozed` is the tab selector, and omitting it still returns both.** A snooze suppresses
        oto's own *notifications*; it says nothing about the signal, so a snoozed alert is still
        firing and still whatever severity it was. `snoozed=false` is the main tab and `snoozed=true`
        is the **Quiet** tab — the same list and the same filters over what oto is being quiet about.
        Splitting them is safe only because the Quiet tab is always present and its count carries the
        worst state inside it; a snooze badge on row 400 of a scrolling list was not.

        **To group these results, use `GET /api/v1/alerts/rollups`**, which applies every filter below
        and aggregates server-side. Do not roll up a page client-side: the counts are then computed over
        whatever happened to load and are silently wrong the moment the result exceeds one page.
      parameters:
        - name: state
          in: query
          description: |
            Comma-separated lifecycle states. Remember that `resolved` and `expired` are different
            things and are never merged.
          schema:
            type: array
            maxItems: 4
            uniqueItems: true
            items:
              $ref: '#/components/schemas/State'
          style: form
          explode: false
          examples:
            open:
              summary: Only live alerts
              value: [firing, suppressed]
        - name: severity
          in: query
          description: |
            Comma-separated severity values. Not a closed enum — operators choose their own vocabulary,
            and oto matches whatever the promoted `severity` label actually contains.
          schema:
            type: array
            maxItems: 16
            uniqueItems: true
            items:
              type: string
              maxLength: 4096
          style: form
          explode: false
          examples:
            urgent:
              value: [critical, warning]
        - name: cluster
          in: query
          description: Comma-separated cluster keys. Cluster participates in alert identity, so this is an identity filter, not a tag filter.
          schema:
            type: array
            maxItems: 32
            uniqueItems: true
            items:
              $ref: '#/components/schemas/ClusterKey'
          style: form
          explode: false
          examples:
            eu:
              value: [prod-eu]
        - name: namespace
          in: query
          description: Comma-separated namespaces, matched against the promoted `namespace` label.
          schema:
            type: array
            maxItems: 64
            uniqueItems: true
            items:
              type: string
              maxLength: 4096
          style: form
          explode: false
          examples:
            twoNamespaces:
              value: [payments, checkout]
        - name: alertname
          in: query
          description: Comma-separated alert names, matched exactly against the promoted `alertname` label.
          schema:
            type: array
            maxItems: 64
            uniqueItems: true
            items:
              type: string
              maxLength: 1024
          style: form
          explode: false
          examples:
            oneRule:
              value: [KubePodCrashLooping]
        - $ref: '#/components/parameters/SourceFingerprintParam'
        - name: label
          in: query
          description: |
            Arbitrary label selector, expressed as `label[<name>]=<value>`. Values may be comma-separated
            to OR them; distinct names AND together.

            - `label[team]=core` — alerts labelled `team=core`.
            - `label[team]=core,platform` — `team=core` **or** `team=platform`.
            - `label[!tier]=canary` — **negation**: alerts *not* labelled `tier=canary`. The `!` prefix
              on the key is the negation marker, and it is the one piece of this parameter that OpenAPI
              cannot express structurally.

            Label names must match `^[a-zA-Z_][a-zA-Z0-9_]*$` (optionally prefixed with `!`); anything
            else is a `422` with the failing parameter reported verbatim, brackets included, as
            `label[…]`.
          style: deepObject
          explode: true
          schema:
            type: object
            maxProperties: 32
            additionalProperties:
              type: string
              maxLength: 4096
          examples:
            teamAndNotCanary:
              summary: 'team is core or platform, and tier is not canary'
              value:
                team: core,platform
                '!tier': canary
        - $ref: '#/components/parameters/MatcherParam'
        - name: flapping
          in: query
          description: Restrict to alerts carrying the retired detector's last flapping verdict, or exclude them. Nothing is damped on flapping — the verdict is a stored historical value and is never recomputed (SPEC §B.6.2).
          schema:
            type: boolean
        - $ref: '#/components/parameters/SnoozedParam'
        - $ref: '#/components/parameters/SyntheticParam'
        - name: since
          in: query
          description: |
            Lower bound on `last_seen_at`. Combined with `sort`, this is the time-range control: page
            backwards through the sorted list to reach an upper bound.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: q
          in: query
          description: |
            Free-text search across `alertname` and the `summary` and `description` annotations, backed
            by a full-text index. Not a regular-expression search and not a label search — use `label[…]`
            for those.
          schema:
            type: string
            maxLength: 200
          examples:
            oom:
              value: oom
        - name: sort
          in: query
          description: |
            Sort order. Only these two are accepted, because keyset pagination requires a total order
            backed by an index; any other value is a `422`.
          schema:
            type: string
            enum: ['-last_seen_at', '-first_seen_at']
            default: '-last_seen_at'
        - name: include
          in: query
          description: |
            Bounded whitelist of sub-resources to embed, batch-loaded to avoid an N+1. Anything outside
            this set is a `422`.
          schema:
            type: array
            maxItems: 3
            uniqueItems: true
            items:
              type: string
              enum: [current_case, enrichments, rule]
          style: form
          explode: false
          examples:
            listView:
              value: [current_case]
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
              examples:
                firstPage:
                  $ref: '#/components/examples/AlertListPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/alerts/rollups:
    get:
      operationId: listAlertRollups
      summary: Aggregate the alert list into buckets, server-side
      tags: [Alerts]
      description: |
        **Group alerts by name, namespace or source fingerprint — over the whole filtered result set,
        not over one page.**

        Every filter `listAlerts` accepts is accepted here and applied identically, so the buckets always
        summarise exactly the list beside them. Each bucket carries counts by state, by acknowledgement,
        by damping facet and by raw severity, plus a roll-up `state`: **a bucket is as alive as its
        liveliest member**, and `resolved` and `expired` are never merged, because "the upstream said it
        ended" and "we stopped hearing about it" are different facts and the second is the more
        interesting one.

        ### Why this is a separate endpoint and not a `group_by` mode of `listAlerts`

        A bucket is not an alert. One operation would have to return `oneOf` two schemas; its `sort`
        enum (`-last_seen_at`, `-first_seen_at`) does not apply to buckets, which are keyset-ordered by
        their own key; and `include=` embeds sub-resources of an alert, of which a bucket has none.

        ### ⛔ A roll-up was never `/alert-groups`, and that route is now gone as well

        An **AlertGroup** *was* one generation of one machine-derived grouping, keyed by
        `(org, cluster, alertname, namespace-or-∅)` from the alert's own labels: it had a row, it had a
        generation, and it owned exactly one chat thread. It is deleted, root and branch (git-bug
        `7570090`), so there is no `/alert-groups` left to confuse this with. A **roll-up** is what it
        always was — a view over the alert list, with no row, no generation and no thread, alive for the
        duration of one query — and the distinction is kept on the record because "group the alerts" is
        the request that used to arrive meaning either one.

        ### Cost

        `alertname` is a streaming aggregate over the `(org_id, alertname, …)` index. `namespace` and
        `fingerprint` are index-only scans plus a sort. None of the three is a sequential scan; an axis
        that would be is not in the enum.
      parameters:
        - name: group_by
          in: query
          required: true
          description: |
            The axis to bucket on. Closed set: each member is answerable from an index, and an axis that
            would require a sequential scan is not offered rather than offered and slow.

            - `alertname` — one bucket per alerting rule. "This rule fired 47 times this month."
            - `namespace` — one bucket per promoted `namespace` label; alerts carrying none bucket under
              the empty string.
            - `fingerprint` — one bucket per upstream `source_fingerprint`. This is the grouping that
              answers *"is this the same thing coming back?"*.
          schema:
            type: string
            enum: [alertname, namespace, fingerprint]
          examples:
            byRule:
              value: alertname
        - name: state
          in: query
          description: Comma-separated lifecycle states, applied before aggregation.
          schema:
            type: array
            maxItems: 4
            uniqueItems: true
            items:
              $ref: '#/components/schemas/State'
          style: form
          explode: false
        - name: severity
          in: query
          description: Comma-separated severity values, applied before aggregation.
          schema:
            type: array
            maxItems: 16
            uniqueItems: true
            items:
              type: string
              maxLength: 4096
          style: form
          explode: false
        - name: cluster
          in: query
          description: Comma-separated cluster keys.
          schema:
            type: array
            maxItems: 32
            uniqueItems: true
            items:
              $ref: '#/components/schemas/ClusterKey'
          style: form
          explode: false
        - name: namespace
          in: query
          description: Comma-separated namespaces.
          schema:
            type: array
            maxItems: 64
            uniqueItems: true
            items:
              type: string
              maxLength: 4096
          style: form
          explode: false
        - name: alertname
          in: query
          description: Comma-separated alert names.
          schema:
            type: array
            maxItems: 64
            uniqueItems: true
            items:
              type: string
              maxLength: 1024
          style: form
          explode: false
        - $ref: '#/components/parameters/SourceFingerprintParam'
        - name: label
          in: query
          description: |
            Arbitrary label selector, identical in every respect to the one on `listAlerts`.
          style: deepObject
          explode: true
          schema:
            type: object
            maxProperties: 32
            additionalProperties:
              type: string
              maxLength: 4096
        - $ref: '#/components/parameters/MatcherParam'
        - name: flapping
          in: query
          description: Restrict to alerts carrying the retired detector's last flapping verdict, or exclude them. Nothing is damped on flapping — the verdict is a stored historical value and is never recomputed (SPEC §B.6.2).
          schema:
            type: boolean
        - $ref: '#/components/parameters/SnoozedParam'
        - $ref: '#/components/parameters/SyntheticParam'
        - name: since
          in: query
          description: Lower bound on `last_seen_at`.
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: q
          in: query
          description: Free-text search, identical to the one on `listAlerts`.
          schema:
            type: string
            maxLength: 200
        - $ref: '#/components/parameters/LimitParam'
        - name: cursor
          in: query
          description: |
            Keyset position, opaque. Here the position is the **bucket key** rather than a timestamp:
            a bucket key appears exactly once per result set, so ordering by it is total and paging over
            it can neither skip nor repeat a bucket. The cursor is bound to both the filter set **and**
            `group_by` — regrouping invalidates it, because the keys themselves change.
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: A page of roll-up buckets, ordered by bucket key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRollupListResponse'
              examples:
                byAlertName:
                  $ref: '#/components/examples/AlertRollupPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/alerts/unsnooze:
    post:
      operationId: unsnoozeAlerts
      summary: Wake several named alerts at once
      tags: [Alerts]
      description: |
        End the active snooze on **each alert named in the body**, so the Quiet tab can resume a
        selection in one gesture instead of one request per row.

        ### It takes a list of ids, and it will never take a filter

        The body carries an explicit `alert_ids` array. There is deliberately no filter-scoped form of
        this operation — no `?severity=`, no `?cluster=`, no "everything currently quiet" — because a
        filter is evaluated on the server against rows the caller never saw. A filter-scoped wake would
        let one press resume thousands of alerts whose extent the person pressing it cannot see, and
        the notifications that follow land in channels nobody agreed to wake. **The caller must name
        what it is waking**, which is a bound the server can check and a person can read back.

        `alert_ids` is capped at **100**, the same ceiling `GET /api/v1/rule-snapshots/batch` puts on the
        ids it will resolve in one call: one page of the UI's list. A caller paging at this contract's
        200 ceiling makes two calls, which is still constant in the size of the page. Over the cap is a
        `422` naming `alert_ids`, exactly like every other bounded list in this contract.

        ### The answer is an account, not a count

        Every id in the request appears exactly once in `results`, in the order it was given:

        - `outcome: woken` — the alert was snoozed and now is not. The `alert_snoozes` row is closed
          with `ended_reason: manual`, an `alert.unsnoozed` event is appended, and the channel is told
          notifications have resumed — identically to `POST /api/v1/alerts/{id}/unsnooze`.
        - `outcome: skipped`, `reason: not_snoozed` — the alert was already awake. **A skip is a normal
          outcome, not an error.** Refusing the other ninety-nine because one had already woken would
          make the button unusable in exactly the situation it exists for. The deleted
          `POST /api/v1/alert-groups/{id}/unsnooze` followed the same rule for its members (git-bug
          `7570090`); this operation is the only fan-out oto still serves, so the rule lives here now.
        - `outcome: skipped`, `reason: alert_not_found` — no alert with that id exists **in this org**. An id
          belonging to another tenant is reported identically to an id belonging to nobody, because
          telling the two apart is an existence oracle: it would confirm a competitor's row is real.

        ### Why partial success is a `200` and not a `207`

        A response is `200` whether every id woke, some did, or none did. The request is what succeeded:
        it was authorised, bounded, and every id named in it was reached and concluded on. `207` would
        say something went wrong, and nothing did — a skip is an outcome this operation is *for*. There
        is no `412` either: the single-alert unsnooze answers `412 not_snoozed` because it addresses one
        entity and has nothing else to report, whereas here there is always an account to return.

        `Idempotency-Key` is accepted and never required. Waking is a compare-and-set — a second call
        finds each alert already awake and reports `not_snoozed` — so a retry finishes the job without
        acting twice, which is the same reason the single-alert and group unsnooze take no key either.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsnoozeAlertsRequest'
            examples:
              twoRows:
                $ref: '#/components/examples/UnsnoozeTwoAlerts'
      responses:
        '200':
          description: |
            The per-alert account. `requested` is `results.length`, and `woken + skipped` equals it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsnoozeAlertsResponse'
              examples:
                oneWokeOneWasAwake:
                  $ref: '#/components/examples/UnsnoozeAlertsAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

