  /api/v1/rule-snapshots:
    get:
      operationId: listRuleSnapshots
      summary: Version history for one RuleKey
      tags: [Rules]
      description: |
        Every captured version of one rule, newest first. Rule identity is
        `(source_id, rule_file, rule_group, rule_name)`; `source_id` and `rule_name` are required
        because a bare alert name is not an identity — two files can define the same one, which is
        exactly the ambiguity `match_confidence` exists to report.

        **Keyset-paginated over `(captured_at, id)`, for real:** `next_cursor` is issued whenever more
        versions exist, and following it reaches every capture. It used to be served from a
        200-version in-memory history, which meant `next_cursor` was always `null` and a heavily edited
        rule had history this endpoint could not show.

        Versions are the **distinct texts** the rule has had, not the fires: a rule that fired ten
        thousand times unchanged has exactly one.
      parameters:
        - name: source_id
          in: query
          required: true
          description: The source whose rules to search.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: rule_name
          in: query
          required: true
          description: The rule name, equal to the alert's `alertname`.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: rule_group
          in: query
          description: Narrows an otherwise ambiguous match.
          schema:
            type: string
            maxLength: 4096
        - name: rule_file
          in: query
          description: Narrows an otherwise ambiguous match.
          schema:
            type: string
            maxLength: 4096
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of snapshots, newest capture first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSnapshotListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/rule-snapshots/batch:
    get:
      operationId: batchGetRuleSnapshots
      summary: Resolve many snapshot ids at once, for the alert list
      tags: [Rules]
      description: |
        **The second half of `include=rule`, and what lets the alert list show what the rule said.**

        `GET /api/v1/alerts?include=rule` gives each row a `RuleSnapshotRefDTO` — an id, and nothing
        more. This turns a page of those ids into the snapshots themselves in **one** call. Two
        requests render a list of fifty alerts with their expressions; one request per row would be
        fifty-one, which is why the list never showed the rule at all.

        ### Why the join is client-side and not an embedded object

        `alerts/api` may not name the rules module's types (CONTEXT.md §5, layering rule 4/5), and a
        hand-copied `RuleSnapshotDTO` living under `alerts` would be the second copy that drifts —
        two answers to "what did the rule say", diverging quietly. On top of that, `expr` runs to
        64 KiB and every snapshot carries two label maps: embedding all of it in each of two hundred
        rows is the payload explosion `include=` exists to keep opt-in. The full reasoning, and the
        options weighed against it, are in **ADR 0025**.

        ### Content addressing makes this cheap

        A snapshot is deduplicated by content, so a rule that has not been edited is **one row**
        however many alerts fired under it. A page of fifty alerts under three distinct rules asks
        about three snapshots, not fifty — pass the ids as they come off the rows and let the server
        collapse them.

        ### ⛔ An id with no snapshot is absent from the result, never a 404

        `rule_snapshots` is append-only and nothing deletes from it, so the only ways to miss are an
        id belonging to another org or one a caller invented. Failing the whole request for either
        would blank the rule column of a page that is otherwise entirely answerable. Join by `id` and
        render a miss as *unknown* — which is a different fact from a snapshot whose `origin` is
        `unavailable`, and the two must stay distinguishable.

        ### ⛔ This is not a page

        There is no `page` object and no cursor: the caller enumerated the set itself, so there is
        nothing to page through and no `next_cursor` that could ever exist.
      parameters:
        - name: id
          in: query
          required: true
          description: |
            The snapshot ids to resolve, comma-separated (repeating the parameter is equivalent).

            **Duplicates are accepted and are the normal case** — they are what a page of alert rows
            looks like when nothing has changed upstream — and are collapsed server-side. The cap is
            100 rather than the usual 200 because 200 UUIDs is a 7.4 KB request line, which survives
            a default proxy header buffer only until a session cookie joins it; 100 is exactly one
            page of the UI's alert list, and a caller paging at the contract's 200 ceiling makes two
            calls, which is still constant in the size of the page.
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: '#/components/schemas/Uuid'
          style: form
          explode: false
      responses:
        '200':
          description: |
            The snapshots among the requested ids that exist in this org, newest capture first.
            Ids with no snapshot are **absent**; the array may be shorter than the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSnapshotBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/rule-snapshots/{id}:
    get:
      operationId: getRuleSnapshot
      summary: Get one captured rule definition
      tags: [Rules]
      description: |
        One content-addressed snapshot. Snapshots are immutable and deduplicated by content, so two
        cases that fired under an identical definition point at the same row.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

