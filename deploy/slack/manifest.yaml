# oto — Slack app manifest
#
# HOW TO USE THIS FILE
#   https://api.slack.com/apps → "Create New App" → "From an app manifest"
#   → pick your workspace → paste this file → Create.
#   Full setup guide: docs/setup/slack.md
#
#   ⚠️ ONE EDIT BEFORE YOU PASTE: replace `<your-oto-host>` in
#   `settings.interactivity.request_url` with the public HTTPS host your oto is
#   reachable at. Everything else in this file is correct as written.
#
# WHAT THIS APP IS
#   An INTERNAL, customer-built Slack app (ADR 0018). You create it in your own
#   workspace, it is installed only there, and oto never talks to any oto-operated
#   service. There is no OAuth flow, no client secret and no token refresh: you
#   paste three credentials into your own oto config and that is the whole of it.
#
# HOW TO READ THE SCOPE LIST
#   Every scope below is justified by a specific Slack API method that oto's code
#   actually calls. The complete set of methods oto can invoke is fixed by the
#   `API` interface in `internal/channels/providers/slack/channel.go`, which has
#   exactly THREE methods: chat.postMessage, chat.update and auth.test. There is
#   nothing else. In particular oto NEVER reads Slack back — no
#   conversations.history, no conversations.replies, no conversations.info, no
#   search. oto's own database is its memory of Slack (ADR 0008).
#
#   ⛔ THE LIST IS ONE SCOPE LONG, AND IT USED TO BE SIX. The first live run
#   settled it by observation rather than by argument: the only calls oto made
#   were chat.postMessage, chat.update and auth.test. `channels:read` and
#   `groups:read` existed for a `conversations.info` probe that NOTHING CALLED —
#   `Channel.Probe` and `Channel.ResolveConversation` had zero callers — and
#   `files:write`, `channels:history` and `incoming-webhook` were never reachable
#   from any code path at all. A scope an app cannot use is a scope an admin
#   approved for nothing, and it is exactly the kind of thing that makes the next
#   request harder to justify.
#
#   Each scope cites the Slack documentation page that states the requirement.
#   Scopes deliberately NOT requested are listed at the bottom with the reason,
#   because a reviewer should be able to see what was declined as well as what
#   was asked for.

display_information:
  name: oto
  description: Alert-first Alertmanager notifications, updated in place instead of reposted.
  long_description: >-
    oto turns Prometheus Alertmanager webhooks into one live Slack card per alert
    group. When an alert changes, oto edits the existing message rather than
    posting a new one, so a channel shows the current state of the world instead
    of a scrollback of stale notifications. Threads carry the detail; the card
    carries the answer to "do I need to act?". oto stores alert history, rule
    definitions captured at fire time, and acknowledgements. It is self-hosted:
    this app talks only to your own oto instance and to Slack.
  background_color: "#1f2933"

features:
  bot_user:
    # oto posts as a bot user. Everything it sends is attributed to this name.
    display_name: oto
    # `always_online: false` lets Slack show the bot's real connection state.
    always_online: false

  app_home:
    # oto has no App Home surface and no DM conversation with users. All three
    # tabs are off so the app cannot be mistaken for something that reads DMs.
    home_tab_enabled: false
    messages_tab_enabled: false
    messages_tab_read_only_enabled: true

oauth_config:
  scopes:
    bot:
      # ---------------------------------------------------------------------
      # chat:write — "Send messages as your Slack app"
      #
      # WHY: this is the whole product. It covers BOTH verbs oto uses:
      #   * chat.postMessage — the root alert card, thread replies, and the
      #     broadcast reply used by the unacked reminder (SPEC §H.5).
      #   * chat.update      — editing the existing card in place. ADR 0008
      #     makes this the PRIMARY verb: it is Tier 3 (50+/min) where
      #     chat.postMessage is ~1 message/second/channel, and it is what keeps
      #     one current card in the channel instead of twelve stale ones.
      #
      # CODE: Channel.Deliver / Channel.Amend,
      #       internal/channels/providers/slack/channel.go
      #
      # SOURCE (chat.postMessage, "Bot token: chat:write"):
      #   https://docs.slack.dev/reference/methods/chat.postMessage/
      # SOURCE (chat.update, "Bot token: chat:write"):
      #   https://docs.slack.dev/reference/methods/chat.update/
      # SOURCE (scope description):
      #   https://docs.slack.dev/reference/scopes/chat.write/
      # STATUS: VERIFIED
      - chat:write

      # ---------------------------------------------------------------------
      # THAT IS THE WHOLE LIST.
      #
      # `auth.test` — the third and last method oto calls — requires NO SCOPE.
      # oto uses it to prove a token is alive and to render "connected to
      # <workspace> as @oto" in the settings UI, and it is the whole of
      # `Channel.Probe`.
      #   SOURCE: https://docs.slack.dev/reference/methods/auth.test/  [VERIFIED]

settings:
  # Socket Mode: OFF, because oto does not implement it. There is no WebSocket
  # client anywhere in the codebase; `OTO_SLACK_APP_TOKEN` is accepted by the
  # config loader and read by nothing, and a channel's `transport: socket_mode`
  # is inert too (see the comments in
  # `internal/channels/providers/slack/config.go`). This setting used to be
  # `true`, which produced an app whose Acknowledge button had nowhere to POST:
  # every press went to a socket nothing was listening on.
  #
  # oto implements exactly ONE interactivity transport — a public HTTPS Request
  # URL authenticated by the signing secret (docs/setup/slack.md §3). Slack will
  # not save a Request URL while Socket Mode is on, so this line and the
  # `request_url` below are a single decision, not two.
  #
  # ⚠️ Do NOT generate an app-level (`xapp-…`) token. Its only purpose is to open
  # a Socket Mode connection, and nothing in oto reads it.
  #
  # SOURCE (manifest schema, `settings.socket_mode_enabled`):
  #   https://docs.slack.dev/reference/app-manifest/
  socket_mode_enabled: false

  # Interactivity must be on for the Acknowledge button to deliver a
  # `block_actions` payload at all, and `request_url` is the endpoint Slack
  # POSTs that payload to. oto verifies the HMAC-SHA256 signature over the raw
  # body and enqueues the ack.
  #
  # The PATH is fixed by oto's router — `internal/channels/api/router.go`
  # registers `/integrations/slack/interactions` on the sub-router that
  # `internal/app/routes.go` mounts at `/api/v1`. Do not change it. Only the
  # host is yours.
  #
  # ⚠️ REPLACE `<your-oto-host>` with your public HTTPS host before pasting this
  # file into Slack. Slack does not verify the URL on save, so leaving the
  # placeholder in surfaces later as a button that fails rather than as an error
  # now.
  #
  # Every URL button and every URL overflow option in oto's card ALSO delivers an
  # interaction payload that must be acknowledged, which is why this switch is
  # required even though only one button does real work (SPEC §H.1 S9).
  interactivity:
    is_enabled: true
    request_url: https://<your-oto-host>/api/v1/integrations/slack/interactions

  # oto subscribes to ZERO Slack events. It does not watch messages, joins,
  # reactions or channel changes. There is deliberately no `event_subscriptions`
  # block: oto is a one-way producer of alert facts plus one inbound button.

  # No token rotation. Bot tokens for an internal app do not expire, and the
  # refresh machinery exists to serve OAuth-distributed apps, which this is not
  # (ADR 0018).
  token_rotation_enabled: false

  # Not an Enterprise Grid org-wide app. Install to a single workspace.
  org_deploy_enabled: false

# ---------------------------------------------------------------------------
# SCOPES DELIBERATELY NOT REQUESTED — please check these off too
#
# chat:write.public — "Send messages to channels your Slack app isn't a member
#   of". REFUSED, and re-examined during the scope trim rather than inherited.
#   It would let oto post into any public channel in the workspace without being
#   invited, which is a far larger blast radius than the product needs, and it
#   would BUY NOTHING: oto posts only to conversations an operator has explicitly
#   configured, and the act of inviting the bot is the operator's own consent,
#   recorded in the channel's history where an auditor can see it. Slack's
#   `not_in_channel` error is classified as a terminal state transition and
#   surfaces in oto's UI telling the operator to invite the bot — a loud, early,
#   fixable failure, which is strictly better than an app that can silently reach
#   anywhere.
#   SOURCE: https://docs.slack.dev/reference/scopes/chat.write.public/  [VERIFIED]
#
# channels:read / groups:read — REFUSED (they were requested until the first live
#   run). They existed for one `conversations.info` call in `Channel.Probe`,
#   which confirmed the destination existed and was not archived before an alert
#   depended on it. `Probe` had ZERO CALLERS, so the scopes bought nothing that
#   was happening; and even had it been wired, §H.9 already classifies
#   `channel_not_found`, `is_archived` and `not_in_channel` as terminal at
#   DELIVERY time — marking the thread dead, degrading the channel and surfacing
#   the fix in oto's UI. Two workspace-wide metadata read scopes to learn the same
#   fact a few minutes earlier is not a trade worth asking an admin to approve.
#   `conversations.info` is no longer in the `API` interface, so nothing can
#   regress into needing them without the interface changing first.
#
# im:read / mpim:read — REFUSED, and now moot. They applied only to
#   `conversations.info` against a DM, which oto no longer calls at all.
#
# files:write — REFUSED. oto uploads nothing. It was in the manifest and there has
#   never been a code path that could use it: the card is Block Kit, and a chart
#   image would be a rendering decision oto has not taken (SPEC §H.3's block
#   budget is seven blocks and none of them is an image).
#
# incoming-webhook — REFUSED. It is an alternative POSTING mechanism, bound to one
#   channel chosen at install time, and oto does not use it: destinations are
#   configured in oto and posted to with `chat.postMessage` under a bot token.
#   Requesting it adds a channel-picker to the install flow that decides nothing.
#
# users:read / users:read.email — REFUSED. oto attributes an acknowledgement by
#   reading `team.id` and `user.id` out of the SIGNED interaction payload and
#   resolving them against its own `slack_identities` table. It makes no Slack
#   API call to identify a human and never reads the workspace directory.
#   (SPEC §H.8 sketches an email-match fallback; it is not implemented, and if
#   it ever is, it would require `users:read.email` and a separate review.)
#   SOURCE: https://docs.slack.dev/reference/scopes/users.read.email/  [VERIFIED]
#
# channels:history / groups:history / conversations.replies — REFUSED, and this
#   is architectural rather than cautious. oto never reads Slack back to
#   reconstruct its own state; the `(channel_id, ts)` pair in oto's database is
#   the memory of Slack (ADR 0008). No read scope can ever be needed.
#   (`channels:history` was requested. It was never called. ADR 0020's Amendment 4
#   reads `conversations.history` to record what Slack actually returns for a
#   thread_broadcast — that was a HUMAN reading a live workspace with their own
#   credentials during verification, not oto, and oto must not acquire the scope
#   to do it.)
#
# channels:join — REFUSED. oto does not add itself to channels. A human invites
#   it, which is an auditable act in the channel's own history.
#
# reactions:write, files:write, im:write, usergroups:read, commands — REFUSED.
#   oto adds no reactions, uploads no files, opens no DMs, resolves no
#   usergroup memberships (mention targets are literal ids from oto's own
#   config) and registers no slash commands.
#
# connections:write — NOT REQUESTED, and it could not be granted here anyway: it
#   is an app-level token scope, and the manifest schema documents only
#   `oauth_config.scopes.bot` and `.user`. It exists to authorise
#   `apps.connections.open`, the Socket Mode handshake — which oto never makes,
#   because oto has no WebSocket client. `socket_mode_enabled` above is `false`
#   for the same reason. Do not generate an `xapp-…` token for this app.
#   SOURCE: https://docs.slack.dev/reference/scopes/connections.write/  [VERIFIED]
#   SOURCE: https://docs.slack.dev/reference/app-manifest/  [VERIFIED]
#
# NO SCOPE NEEDED (listed so a reviewer is not surprised to see the call):
#   auth.test — "No scopes required". oto calls it to prove a token is alive and
#     to show "connected to <workspace> as @oto" in the settings UI.
#     SOURCE: https://docs.slack.dev/reference/methods/auth.test/  [VERIFIED]
# ---------------------------------------------------------------------------
