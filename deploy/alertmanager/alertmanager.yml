# Dev-only Alertmanager configuration.
#
# Everything routes to one webhook receiver pointed at oto on the host, so that
# `amtool alert add alertname=Test severity=critical` — or a rule firing in the
# compose Prometheus — produces a real webhook v4 body on the real ingest path.
#
# The receiver block below is the ENTIRE Alertmanager change oto requires
# (SPEC §J.1). Nothing else is needed.
#
# ⚠️ TWO PLACEHOLDERS BELOW MUST BE REPLACED BEFORE ANYTHING REACHES oto.
# The ingest route is per source — `/api/v1/ingest/alertmanager/{source_id}` —
# and authenticates with that source's own token, so neither value can be known
# until the source exists. Create one and read both off the response, which is
# the only time the token is ever returned:
#
#   curl -sS -X POST http://localhost:8080/api/v1/sources \
#     -H "authorization: Bearer $OTO_PAT" -H 'content-type: application/json' \
#     -d '{"cluster_id":"…","name":"dev","kind":"alertmanager",
#          "base_url":"http://localhost:9093",
#          "prometheus_url":"http://localhost:9090"}'
#
# `webhook_url` from that response goes in `url`, `ingest_token` goes in
# `credentials`, then `docker compose restart alertmanager`.

global:
  resolve_timeout: 5m

route:
  receiver: oto
  group_by: ["alertname", "namespace"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: oto
    webhook_configs:
      # send_resolved MUST stay true: oto distinguishes `resolved` from `expired`
      # and will raise a persistent source_health warning if it is off (C15).
      - send_resolved: true
        # REPLACE the trailing uuid with your source id (see the header note).
        # The all-zero uuid is a deliberate placeholder: it 404s rather than
        # quietly posting to a route that does not exist.
        url: http://host.docker.internal:8080/api/v1/ingest/alertmanager/00000000-0000-0000-0000-000000000000
        max_alerts: 0
        http_config:
          # REPLACE with the `ingest_token` from the source-creation response.
          # It is returned exactly once; only its sha256 is stored.
          authorization:
            type: Bearer
            credentials: oto_ingest_REPLACE_ME

inhibit_rules: []
