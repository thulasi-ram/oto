{{- include "oto.validateValues" . -}}
{{/*
The non-secret half of oto's configuration.

Every key here is exactly what koanf reads: OTO_<SECTION>_<KEY>, resolved to
<section>.<key> by config.envKeyToPath. Nothing is invented — if a variable is
not in internal/platform/config/config.go it is not in this ConfigMap.

⛔ NO SECRET GOES IN HERE. OTO_DB_URL, OTO_SECURITY_SECRET_KEY,
OTO_SLACK_APP_TOKEN, OTO_SLACK_SIGNING_SECRET and OTO_BOOTSTRAP_PASSWORD live in
the Secret, and the pods layer the Secret's envFrom on top of this one.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oto.configMapName" . }}
  labels:
    {{- include "oto.labels" (dict "ctx" . "component" "config") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  OTO_ENV: {{ .Values.config.env | quote }}
  OTO_SERVICE: {{ .Values.config.service | quote }}

  # HTTP. `addr` is derived from api.containerPort so the listener, the probes
  # and the Service cannot disagree.
  OTO_HTTP_ADDR: {{ printf ":%d" (int .Values.api.containerPort) | quote }}
  OTO_HTTP_BASE_URL: {{ .Values.config.http.base_url | quote }}
  {{- with .Values.config.http.cors_origins }}
  # Comma-joined; koanf splits it back. Emitted only when non-empty, because an
  # empty value is not the same thing as "CORS disabled" to the unmarshaller.
  OTO_HTTP_CORS_ORIGINS: {{ join "," . | quote }}
  {{- end }}
  OTO_HTTP_READ_TIMEOUT: {{ .Values.config.http.read_timeout | quote }}
  OTO_HTTP_WRITE_TIMEOUT: {{ .Values.config.http.write_timeout | quote }}
  OTO_HTTP_IDLE_TIMEOUT: {{ .Values.config.http.idle_timeout | quote }}
  OTO_HTTP_SHUTDOWN_TIMEOUT: {{ .Values.config.http.shutdown_timeout | quote }}
  OTO_HTTP_REQUEST_TIMEOUT: {{ .Values.config.http.request_timeout | quote }}
  OTO_HTTP_MAX_BODY_BYTES: {{ int64 .Values.config.http.max_body_bytes | quote }}

  # The two pools (SPEC §G.10). oto derives the ingest and general sizes from
  # these three; it does not take them directly.
  OTO_DB_MAX_CONNS: {{ int .Values.config.db.max_conns | quote }}
  OTO_DB_INGEST_SHARE_PERCENT: {{ int .Values.config.db.ingest_share_percent | quote }}
  OTO_DB_INGEST_MIN_CONNS: {{ int .Values.config.db.ingest_min_conns | quote }}
  OTO_DB_INGEST_STATEMENT_TIMEOUT: {{ .Values.config.db.ingest_statement_timeout | quote }}
  OTO_DB_GENERAL_STATEMENT_TIMEOUT: {{ .Values.config.db.general_statement_timeout | quote }}
  OTO_DB_MAX_CONN_LIFETIME: {{ .Values.config.db.max_conn_lifetime | quote }}
  OTO_DB_MAX_CONN_IDLE_TIME: {{ .Values.config.db.max_conn_idle_time | quote }}
  OTO_DB_CONNECT_TIMEOUT: {{ .Values.config.db.connect_timeout | quote }}
  OTO_DB_AUTO_MIGRATE: {{ .Values.config.db.auto_migrate | quote }}

  OTO_LOG_LEVEL: {{ .Values.config.log.level | quote }}
  OTO_LOG_FORMAT: {{ .Values.config.log.format | quote }}
  OTO_LOG_SOURCE_LOCATION: {{ .Values.config.log.source_location | quote }}

  OTO_TELEMETRY_METRICS_ENABLED: {{ .Values.config.telemetry.metrics_enabled | quote }}
  OTO_TELEMETRY_METRICS_PATH: {{ .Values.config.telemetry.metrics_path | quote }}
  OTO_TELEMETRY_TRACING_ENABLED: {{ .Values.config.telemetry.tracing_enabled | quote }}
  OTO_TELEMETRY_OTLP_ENDPOINT: {{ .Values.config.telemetry.otlp_endpoint | quote }}
  OTO_TELEMETRY_OTLP_INSECURE: {{ .Values.config.telemetry.otlp_insecure | quote }}
  OTO_TELEMETRY_TRACE_SAMPLE_RATE: {{ .Values.config.telemetry.trace_sample_rate | quote }}

  OTO_JOBS_ENABLED: {{ .Values.config.jobs.enabled | quote }}
  OTO_JOBS_QUEUE_INGEST: {{ int .Values.config.jobs.queue_ingest | quote }}
  OTO_JOBS_QUEUE_DEFAULT: {{ int .Values.config.jobs.queue_default | quote }}
  OTO_JOBS_QUEUE_DELIVERY: {{ int .Values.config.jobs.queue_delivery | quote }}
  OTO_JOBS_FETCH_INTERVAL: {{ .Values.config.jobs.fetch_interval | quote }}
  OTO_JOBS_JOB_TIMEOUT: {{ .Values.config.jobs.job_timeout | quote }}
  OTO_JOBS_RESCUE_AFTER: {{ .Values.config.jobs.rescue_after | quote }}

  OTO_INGEST_RETRY_AFTER: {{ .Values.config.ingest.retry_after | quote }}
  OTO_INGEST_ACQUIRE_TIMEOUT: {{ .Values.config.ingest.acquire_timeout | quote }}

  OTO_RETENTION_RAW_PAYLOADS: {{ .Values.config.retention.raw_payloads | quote }}
  OTO_RETENTION_EVENTS: {{ .Values.config.retention.events | quote }}
  OTO_RETENTION_UI_EVENTS: {{ .Values.config.retention.ui_events | quote }}

  OTO_SLACK_ENABLED: {{ .Values.config.slack.enabled | quote }}
  OTO_SLACK_MODE: {{ .Values.config.slack.mode | quote }}

  OTO_SECURITY_SESSION_TTL: {{ .Values.config.security.session_ttl | quote }}
  OTO_SECURITY_SESSION_COOKIE: {{ .Values.config.security.session_cookie | quote }}
  OTO_SECURITY_ALLOW_PRIVATE_TARGETS: {{ .Values.config.security.allow_private_targets | quote }}
  OTO_SECURITY_ALLOW_INSECURE_TLS: {{ .Values.config.security.allow_insecure_tls | quote }}
  OTO_SECURITY_LOGIN_RATE_BURST: {{ int .Values.config.security.login_rate_burst | quote }}
  OTO_SECURITY_LOGIN_RATE_REFILL: {{ .Values.config.security.login_rate_refill | quote }}
  OTO_SECURITY_LOGIN_MAX_CONCURRENT: {{ int .Values.config.security.login_max_concurrent | quote }}
{{- with .Values.tuning }}

  # The declarative tuning layer. A key here is AUTHORITATIVE: the settings API
  # reports its origin as `config`, names the variable below, and refuses a PATCH
  # on it with 409 rather than accepting a value your next deploy would revert.
  {{- range $key, $value := . }}
  {{- if kindIs "slice" $value }}
  OTO_TUNING_{{ $key | upper }}: {{ join "," $value | quote }}
  {{- else }}
  OTO_TUNING_{{ $key | upper }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
