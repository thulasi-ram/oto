{{- if .Values.serviceAccount.create }}
{{/*
⛔ NO ROLE AND NO ROLEBINDING, DELIBERATELY. oto reads nothing from the
Kubernetes API: `k8scontext` — pod/owner/node/event resolution via informers — is
DEFERRED-POST-V1 in SPEC §I.1 precisely because it needs cluster RBAC. A chart
that requested permissions its binary never uses would be asking an operator to
trust it with reach it does not need, and the token is not mounted for the same
reason.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oto.serviceAccountName" . }}
  labels:
    {{- include "oto.labels" (dict "ctx" . "component" "rbac") | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
