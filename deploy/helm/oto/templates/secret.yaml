{{- if not .Values.existingSecret }}
{{/*
oto's secret material.

⛔ RENDERED ONLY WHEN `existingSecret` IS EMPTY. The moment an operator names a
Secret they manage, this chart stops having an opinion about their secrets: no
Secret is created, nothing is templated from values, and `helm get values` on the
release reveals nothing.

The keys are spelled as the environment variables themselves only because that is
what `existingSecretKeys` DEFAULTS to. Nothing consumes this Secret with an
`envFrom`: every key is projected individually with `secretKeyRef` (see the ⭐
block on `oto.secretEnv`), which is exactly what lets an operator point
`existingSecretKeys.databaseUrl` at a Secret that already calls the DSN
`DATABASE_URL`. Rename a key here and the chart still maps it onto OTO_DB_URL.

Empty values are omitted rather than written as "": OTO_SECURITY_SECRET_KEY set
to the empty string and OTO_SECURITY_SECRET_KEY absent mean the same thing to the
binary, but only the second is honest about what the deployment configured.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oto.fullname" . }}
  labels:
    {{- include "oto.labels" (dict "ctx" . "component" "secrets") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.existingSecretKeys.databaseUrl }}: {{ .Values.secrets.databaseUrl | quote }}
  {{- with .Values.secrets.secretKey }}
  {{ $.Values.existingSecretKeys.secretKey }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.slackAppToken }}
  {{ $.Values.existingSecretKeys.slackAppToken }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.slackSigningSecret }}
  {{ $.Values.existingSecretKeys.slackSigningSecret }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.bootstrapPassword }}
  {{ $.Values.existingSecretKeys.bootstrapPassword }}: {{ . | quote }}
  {{- end }}
{{- end }}
