{{/*
`oto api` — the HTTP surface. Jobs are ENQUEUED here and never worked; the worker
Deployment works them. Splitting them is what lets a storm be answered with more
ingest workers rather than more HTTP handlers (cmd/oto/main.go).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oto.fullname" . }}-api
  labels:
    {{- include "oto.labels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- $wave := include "oto.workloadAnnotations" . | trim }}
  {{- if or .Values.commonAnnotations $wave }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $wave }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "oto.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "oto.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # A change to either object rolls the pods. Without this a `helm upgrade`
        # that only edits configuration leaves every pod running the old values
        # and reports success.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "oto.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "oto.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          envFrom:
            {{- include "oto.envFrom" . | nindent 12 }}
          env:
            {{- include "oto.secretEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # ⭐ /healthz IS LIVENESS AND NEVER TOUCHES POSTGRES. A database outage
          # must not make Kubernetes restart every oto pod; the API is designed to
          # serve while the pools are down and to say so on /readyz.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          # ⭐ /readyz IS READINESS AND IT REPORTS THE TRUTH: 200 only when both
          # pools answer a ping AND the applied goose version matches the one this
          # binary was built against. A pod mid-rolling-deploy that is two
          # migrations behind is taken out of the Service rather than left serving
          # queries against columns that do not exist yet (internal/app/ops.go).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.api.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
