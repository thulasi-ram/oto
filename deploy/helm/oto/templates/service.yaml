{{/*
The API Service. The worker has no listener and therefore no Service — and no
headless one either: nothing in oto discovers a worker by DNS, River's queue is
the only thing that hands a worker work.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oto.fullname" . }}
  labels:
    {{- include "oto.labels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- if or .Values.service.annotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "oto.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
