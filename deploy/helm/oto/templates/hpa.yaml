{{- if .Values.api.autoscaling.enabled }}
{{/*
⚠️ SCALE THE API, NOT THE WORKER, AND WATCH THE CONNECTION COUNT. Every replica
opens its own pair of pgx pools — `config.db.max_conns` each — so an HPA with
maxReplicas: 10 is a standing claim on 10 × max_conns connections against your
Postgres. Size `max_connections` upstream before raising this.
*/}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "oto.fullname" . }}-api
  labels:
    {{- include "oto.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "oto.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.api.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.api.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
{{- end }}
