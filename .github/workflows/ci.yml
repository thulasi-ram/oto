name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  go-lint:
    name: go / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./pkg ./db ./test ./tools)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: $unformatted"
            exit 1
          fi

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # The depguard rules in .golangci.yml are the layering contract
      # (CONTEXT.md §5). A failure here is an architecture failure.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  go-build:
    name: go / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/oto ./cmd/oto
      - run: ./bin/oto -version

  go-test:
    name: go / test
    runs-on: ubuntu-latest
    needs: [go-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Integration tests bring up a real Postgres via testcontainers-go;
      # mocked databases lie about SQL semantics.
      - run: go test -race -count=1 ./...

  # Gate G1 of SPEC §L.8.1 — Go DTO → OpenAPI.
  #
  # It reflects every `*DTO`/`*Request`/`*Query` struct in internal/**/api and
  # diffs the derived schema against api/openapi/openapi.yaml: json tags,
  # required/optional, types, enums, nullability and the `validate` bounds. It is
  # a separate job from `go / test` because it is pure reflection over YAML —
  # seconds, no Docker — and a contract failure should not wait behind
  # `go test -race ./...`.
  #
  # The same package carries the RATCHET: an operation declared in the contract
  # and named by no test fails here on the day it is added.
  contract-dto:
    name: contract / gate G1 (Go DTO -> OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -count=1 ./test/contract/

  # Gate G2 of SPEC §L.8.1 — RUNNING SERVER → OpenAPI.
  #
  # It assembles the real composition root over a real, fully migrated Postgres
  # (testcontainers), mounts the real route tree on a real HTTP server, mints a
  # real credential through the real `oto bootstrap` path, and calls every
  # declared operation. For each response it asserts the status is one the
  # contract declares, the Content-Type is one the contract declares, and the
  # BYTES the handler wrote validate against that media type's schema.
  #
  # ⚠️ It DEVIATES from the SPEC, which names `schemathesis`. The argument is in
  # test/contract/server/doc.go: schemathesis is Python, this repository's CI
  # installs Go and Node, and oto's server cannot be started without the Go test
  # harness — so the Python would buy a request generator at the price of a third
  # toolchain and a second way to stand the product up. Exhaustiveness is
  # recovered by a ratchet instead: an operation the contract declares and the
  # probe table does not drive fails the gate.
  contract-server:
    name: contract / gate G2 (running server -> OpenAPI)
    runs-on: ubuntu-latest
    needs: [go-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Docker is preinstalled on ubuntu-latest; testcontainers finds it on the
      # default socket, so no DOCKER_HOST is set here (unlike `just server-check`,
      # which has to cope with colima on a contributor's laptop).
      - run: go test -count=1 ./test/contract/server/

  ui:
    name: ui / gates G3 + G4 + lint + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund

      # Gate G3 (SPEC §L.8.1): regenerate the TypeScript client from
      # api/openapi/openapi.yaml and assert the checked-in copy is byte-identical.
      # This gate existed and was never run; when it was finally run it produced
      # 292 diff lines, and the UI had been typed against a contract three
      # features behind the server for as long as that took. Drift now fails here,
      # not in a browser.
      - name: gate G3 — openapi -> ts client is not stale
        run: npm run generate:check

      # Gate G4 (SPEC §L.8.1): the same trick one layer down. `gen-validators.mjs`
      # emits one valibot schema per component schema into
      # src/api/generated/validators.ts, which is CHECKED IN; this regenerates it
      # and fails on any diff. G3 protects the TYPES, which vanish at build time;
      # G4 protects the RUNTIME check, which is the only thing that can notice a
      # server whose body no longer matches the contract. It is also what makes
      # §L.8's "no hand-written valibot schema may describe an API response"
      # enforceable — a form schema must `v.pipe` into the generated request
      # schema, and there is now one to pipe into.
      - name: gate G4 — openapi -> valibot validators are not stale
        run: npm run gen:validators:check

      - run: npm run typecheck
      - run: npm run build

      # `--passWithNoTests` lives in the script, not here: vitest exits 1 on an
      # empty suite, which is how the ui job was red at HEAD from the commit that
      # introduced it. An empty suite is a gap to fill, not a build to break.
      - run: npm run test

  vocabulary:
    name: scope / vocabulary (AC-49)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # SCOPE-BOUNDARY AC-49 / SPEC §P-18. oto is not an on-call product, and the
      # vocabulary always drifts before the schema does: a word arrives, then the
      # concept, then the column, then the rota. The gate scans internal/,
      # web/src/ and db/migrations/ for the banned terms and the forbidden
      # person-subject columns. Known debt is enumerated in
      # tools/lintvocab/baseline.txt and can only shrink.
      - run: go run ./tools/lintvocab

  reachability:
    name: scope / reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The unreachable-feature gate. This codebase was written against a
      # specification and barely executed until late, and the defect that
      # produced is not dead code: it is a setting the operator sets that no
      # branch reads, a response field the contract promises that no line
      # populates, a service fully implemented and never constructed. Every one
      # of the fifteen-plus known instances was found by RUNNING the product.
      # This job finds them by reading it: zero-write / zero-read struct fields,
      # json tags that do not round-trip with api/openapi/openapi.yaml, and
      # exported New* constructors with no caller outside their own file.
      #
      # It needs the build cache populated, because imports are resolved from
      # export data rather than a second type-check of the world.
      #
      # Known debt is enumerated in tools/lintreach/baseline.txt and can only
      # shrink; a baseline line that stops matching is an error, so a paid debt
      # cannot keep its exemption.
      - run: go build ./...
      - run: go run ./tools/lintreach
