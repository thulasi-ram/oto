name: release

# The other half of deploy/helm/oto. The chart's `image.repository` names a GHCR
# path, and until this workflow existed nothing in the repository ever wrote to
# it: `buildx`, `docker/build-push-action` and `packages: write` appeared
# nowhere, so `helm install oto deploy/helm/oto` left the pre-install
# `oto migrate` hook in ImagePullBackOff and SPEC acceptance criterion 31
# ("`helm install oto` with a Postgres URL and a Slack token is the entire
# install") could not be met by anyone who had not built the image themselves.
#
# ⭐ THE GIT TAG IS THE INPUT AND THE ONLY INPUT. Every tag published here is
# derived from the tag being pushed, which is why there is no
# `workflow_dispatch` (ci.yml has one; this workflow must not). Dispatched from a
# branch, `github.ref_name` is a branch name, `docker/metadata-action` derives no
# version from it, and the run would publish an artifact with no name anyone
# could pin — or fail confusingly at the push. A release is a tag.
#
# ⚠️ THIS WORKFLOW RUNS NO TESTS, AND THAT IS THE INTENT. `ci` triggers on
# pushes to main and on pull requests, so the commit a tag points at has already
# been through all eight jobs. Re-running them here would double the wall clock
# to re-answer a question already answered, and would tempt a tag onto a commit
# that had never seen a pull request.

on:
  push:
    tags:
      # The trailing `*` admits `v0.1.0-rc.1` without a second workflow.
      # metadata-action recognises a prerelease and withholds the moving `X.Y`
      # tag from it on its own, so an rc never becomes what `0.1` resolves to.
      - "v[0-9]+.[0-9]+.[0-9]+*"

# ⚠️ NOT `cancel-in-progress`, unlike ci.yml. Cancelling a half-finished
# multi-architecture push can leave a manifest list pointing at blobs that never
# finished uploading, and a tag is pushed once — there is no later run on the
# same ref to correct it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # ⭐ DERIVED, NOT TYPED. `github.repository` is `<owner>/oto`, and GHCR accepts
  # the built-in GITHUB_TOKEN for a package under this repository's own owner and
  # nowhere else — so the one path this workflow is able to publish to is the one
  # it computes. A hand-written namespace is a namespace that can silently stop
  # matching the repository, which is exactly the defect this workflow closes:
  # the chart's default used to name an owner this repository is not under.
  # metadata-action lower-cases it before use.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: image / build + push (ghcr)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR under this repository's owner
      id-token: write # mint the OIDC token the provenance attestation is signed with
      attestations: write # write that attestation back to the registry
    steps:
      - uses: actions/checkout@v4

      # ⭐ NO QEMU STEP, DELIBERATELY. The Dockerfile pins its build stage to
      # $BUILDPLATFORM and cross-compiles with GOARCH=$TARGETARCH, and the
      # runtime stage is a COPY onto distroless/static — no arm64 instruction is
      # ever EXECUTED on this amd64 runner, so there is nothing to emulate.
      # Emulating the Go compiler under QEMU costs minutes per architecture to
      # produce the same bytes. This is only correct because CGO is off.
      #
      # No `cache-from: type=gha` either: this workflow runs a handful of times a
      # year, on a ref that has no warm cache to read, and ci.yml builds no
      # image to populate one.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: derive the tags the chart and an incident both need
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # ⛔ `latest=false` IS LOAD-BEARING, NOT TIDINESS. metadata-action
          # defaults to `latest=auto`, which publishes `latest` for any semver
          # tag. values.yaml argues in the chart's own voice that a floating tag
          # makes "which build is this" unanswerable, and Chart.yaml marks the
          # chart `artifacthub.io/prerelease: "true"`. Publishing a `latest`
          # nothing references, while telling operators not to use one, is a
          # contradiction; it can be added at 1.0 when it means something.
          flavor: latest=false
          tags: |
            # ⭐ `{{version}}` DROPS THE LEADING `v`, and that is the tag the
            # chart resolves to: _helpers.tpl falls back to `.Chart.AppVersion`
            # verbatim and Chart.yaml carries `"0.1.0"`, no `v`. A workflow that
            # published only `v0.1.0` would leave the chart's own default
            # broken, which is the bug this file exists to fix.
            type=semver,pattern={{version}}
            # The moving minor line, for an operator who tracks patches.
            # Withheld automatically from a prerelease tag.
            type=semver,pattern={{major}}.{{minor}}
            # The `v`-prefixed alias, so the image tag and the git tag can be
            # named with the same string.
            type=ref,event=tag
            # Incident forensics: the digest answers "which commit", but only if
            # someone can get from a commit back to an image without a release
            # note.
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Both are genuinely reachable: CGO is off, nothing in the build stage
          # is host-specific, and gcr.io/distroless/static-debian12 publishes
          # both architectures. arm64 is not decoration — it is what a Graviton
          # or Ampere node pool pulls.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ⭐ THE THREE LINKER STAMPS ARE THE POINT. The Dockerfile has declared
          # these ARGs all along and nothing has ever passed them, so every
          # artifact this repository produced answered `oto dev` — the one
          # question GET /api/v1/version exists to answer, unanswerable.
          #
          # VERSION keeps the leading `v`: cmd/oto/version.go prints it verbatim
          # ("oto %s"), and `oto v0.1.0` is what a release is called.
          # BUILD_DATE is metadata-action's own RFC3339 timestamp, so the stamp
          # and the org.opencontainers.image.created label cannot disagree.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          # buildx would otherwise attach its own provenance, which adds
          # `unknown/unknown` entries to the manifest list and duplicates the
          # attestation the next step writes — the GitHub-signed one, which
          # `gh attestation verify` can actually check.
          provenance: false

      # "Which commit produced this digest", answerable without trusting a
      # release note. One step and an OIDC token; an SBOM is worth less here,
      # because the runtime layer ships no packages and the module graph of the
      # single static binary is already reported by `go version -m`.
      - name: attest the provenance of the digest
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ⭐ THE ASSERTION THAT WOULD HAVE CAUGHT THE ORIGINAL DEFECT. ci.yml runs
      # `./bin/oto -version` straight after `go build` for the same reason, and
      # it answers `oto dev` there because nothing passes the flags. Here the
      # published image is pulled back by digest (linux/amd64 on this runner) and
      # made to say which build it is; an unstamped image fails the release.
      - name: the published image knows which build it is
        run: |
          ref='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}'
          printed="$(docker run --rm "$ref" version)"
          echo "$printed"
          case "$printed" in
            "oto ${{ github.ref_name }} (commit ${{ github.sha }}, built "*) ;;
            *) echo "::error::the version stamp is wrong: $printed"; exit 1 ;;
          esac

      # A manifest that lists one architecture is an image that ImagePullBackOffs
      # on half the clusters it was promised to — the same failure this workflow
      # was written to end, one layer down.
      - name: the manifest lists both architectures
        run: |
          ref='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}'
          platforms="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')"
          echo "$platforms"
          for want in linux/amd64 linux/arm64; do
            case "$platforms" in
              *"$want"*) ;;
              *) echo "::error::the manifest list is missing $want"; exit 1 ;;
            esac
          done

  # ---------------------------------------------------------------------------
  # The chart, published as an OCI artifact beside the image it installs.
  #
  # ⭐ WHY THIS EXISTS. `deploy/helm/oto` was reachable only by cloning this
  # repository, so every consumer had to vendor a copy — and a vendored chart is
  # one that silently stops matching the image its appVersion names. A GitOps
  # consumer cannot read a chart from a git path at all: `kustomize`'s
  # `helmCharts` takes an HTTP Helm repo or an `oci://` reference and nothing
  # else, and Argo CD renders with `kustomize build --enable-helm`. So the chart
  # needs a name that can be pulled and pinned, or the install story stops at
  # "clone the repository first".
  #
  # ⭐ THE GIT TAG IS THE INPUT HERE TOO. `--version` and `--app-version` are
  # both derived from the tag, exactly as the image tags above are, so the chart
  # version, the appVersion and the image tag are the SAME string by
  # construction. That does NOT make Chart.yaml's committed appVersion
  # decorative — `just release` check 6 refuses a tag that disagrees with it,
  # because a chart installed from the git path resolves its image tag from that
  # file. Re-deriving both here means the PUBLISHED tarball cannot disagree even
  # if a future gate stops looking.
  chart:
    name: chart / package + push (ghcr oci)
    runs-on: ubuntu-latest
    # ⛔ NOT PARALLEL WITH THE IMAGE, DELIBERATELY. The chart's appVersion
    # resolves to the image tag this release publishes, so a chart pushed while
    # the image build was failing would name an image that does not exist —
    # `helm install` would succeed and every pod would ImagePullBackOff. Let the
    # image prove itself first; a chart is cheap to publish afterwards.
    needs: image
    permissions:
      contents: read
      packages: write # push the chart to GHCR under this repository's owner
    steps:
      - uses: actions/checkout@v4

      # ⚠️ THE SAME VERSION AS ci.yml's CHART GATE, INSTALLED THE SAME WAY. Not
      # tidiness: helm 4 changed what `helm lint` does with a template `fail`
      # (it logs and exits 0), which is the whole reason deploy/helm/check.sh
      # asserts through `helm template` instead. Packaging a release under helm
      # 3 while every other chart gate ran under 4.1.1 would be a third gate
      # nobody verified, on the one ref that can never be re-cut.
      - name: install helm
        run: |
          HELM_VERSION=v4.1.1
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - id: ver
        name: derive the version, the owner and the image from the tag
        run: |
          # `v0.1.1` -> `0.1.1`. Helm requires SemVer2 WITHOUT a leading `v` for
          # a chart version, and the image's `type=semver,pattern={{version}}`
          # tag above drops it the same way — which is what makes the chart
          # version and the image tag the same string.
          version='${{ github.ref_name }}'
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          # ⛔ LOWER-CASED ONCE AND USED FOR BOTH THE PUSH AND THE ASSERTION. An
          # OCI repository path must be lower case; a GitHub owner need not be.
          # Lower-casing the push target while asserting against `env.IMAGE_NAME`
          # raw would be two derivations of one fact that agree only while the
          # owner happens to be spelled in lower case already.
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "image=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: package
        run: |
          mkdir -p dist
          helm package deploy/helm/oto \
            --version '${{ steps.ver.outputs.version }}' \
            --app-version '${{ steps.ver.outputs.version }}' \
            --destination dist

      # ⭐ THE REWRITTEN CHART IS RENDERED BEFORE IT IS PUSHED, NEVER AFTER.
      # `helm package` just rewrote version and appVersion, so this tarball is
      # bytes no gate has seen: ci.yml's chart job ran the whole lint + render +
      # kubeconform matrix on this commit, but it ran it against the SOURCE tree,
      # carrying whatever Chart.yaml said at the time. appVersion IS the default
      # image tag, so the packaged chart is the only place that fact can be
      # checked — and checking it after `helm push` would mean discovering a
      # chart that names the wrong image once it was already public and pinnable.
      #
      # ⚠️ IT IS NOT A SECOND CHART GATE, and it deliberately does not run
      # check.sh. The matrix belongs in ci.yml for the reason the ⭐ block on its
      # `helm` job gives — a chart defect found when a tag is pushed is found
      # after the commit is immutable and after review said yes. check.sh also
      # hard-exits without `kubeconform`, which this job has no reason to
      # install. This step checks the one fact packaging can change.
      - name: the packaged chart resolves to this release's image
        run: |
          helm template oto 'dist/oto-${{ steps.ver.outputs.version }}.tgz' \
            --set secrets.databaseUrl='postgres://oto:pw@postgres.example:5432/oto' \
            > packaged.yaml
          want='${{ env.REGISTRY }}/${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}'
          echo "want: $want"
          grep -Fq "$want" packaged.yaml \
            || { echo "::error::the packaged chart does not resolve to $want"; exit 1; }

      # ⭐ THE SAME TOKEN AND THE SAME OWNER AS THE IMAGE. GHCR accepts the
      # built-in GITHUB_TOKEN for a package under this repository's own owner and
      # nowhere else, so the chart lands beside the image by construction rather
      # than by a hand-written path that can stop matching it.
      - name: log in to ghcr
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | helm registry login '${{ env.REGISTRY }}' \
                --username '${{ github.actor }}' --password-stdin

      - name: push
        run: |
          helm push 'dist/oto-${{ steps.ver.outputs.version }}.tgz' \
            'oci://${{ env.REGISTRY }}/${{ steps.ver.outputs.owner }}/charts'

      # ⭐ PULL IT BACK AND RENDER WHAT CAME BACK. The steps above prove the
      # bytes left this runner; only this proves a consumer can get them under
      # the reference they will pin. It is the chart-shaped counterpart of
      # pulling the image back by digest.
      #
      # ⚠️ IT PULLS AUTHENTICATED, SO IT CANNOT TELL WHETHER THE PACKAGE IS
      # PUBLIC. That distinction is load-bearing for a GitOps consumer:
      # `kustomize`'s helmCharts has no credential path whatsoever, so an Argo CD
      # repo-server pulling a private chart gets `unauthorized` and the
      # Application never renders. Chart.yaml's `sources[0]` is what helm turns
      # into the `org.opencontainers.image.source` annotation GHCR links a
      # package by, so this package should inherit the repository's visibility
      # the way the image package did on v0.1.0 — and "should" is why
      # releasing.md says to confirm it with an anonymous pull after the first
      # push, rather than to trust either expectation.
      - name: a consumer can pull the published chart and render it
        run: |
          # ⛔ `mkdir` FIRST. helm 4's `--destination` does NOT create the
          # directory, and it prints `Pulled:` and the digest BEFORE it writes —
          # so a missing directory fails as
          # `open pulled/oto-<v>.tgz<random>: no such file or directory` two
          # lines after a message that says it worked. This step failed exactly
          # that way on v0.1.1, after the chart had already been pushed.
          mkdir -p pulled
          ref='oci://${{ env.REGISTRY }}/${{ steps.ver.outputs.owner }}/charts/oto'
          tgz="pulled/oto-${{ steps.ver.outputs.version }}.tgz"
          helm pull "$ref" --version '${{ steps.ver.outputs.version }}' --destination pulled
          # The name is a convention, not a promise helm makes to this script.
          [ -f "$tgz" ] || { echo "::error::helm pull wrote no $tgz"; ls -la pulled; exit 1; }
          helm template oto "$tgz" \
            --set secrets.databaseUrl='postgres://oto:pw@postgres.example:5432/oto' \
            > /dev/null
