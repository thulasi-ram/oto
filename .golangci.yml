            # ORCHESTRATION decision 6). `internal/alerts/domain` owns LabelSet,
            # AlertKey, GroupKey, RuleFingerprint, IdempotencyKey, ClusterKey,
            # SlackTS, Severity, State and AckState. It is the ONE sanctioned
            # cross-domain `domain` import, it imports no other domain, and it is
            # allowed here for EVERY domain rather than case-by-case -- a rule that
            # is granted per-agent is a rule two agents will route around in two
            # different ways, which is exactly what happened before this line.
            - github.com/thulasiram/oto/internal/alerts/domain
            - github.com/thulasiram/oto/internal/sources/service
            - github.com/thulasiram/oto/internal/ingestion/service
            - github.com/thulasiram/oto/internal/alerts/service
            - github.com/thulasiram/oto/internal/grouping/service
            - github.com/thulasiram/oto/internal/rules/service
            - github.com/thulasiram/oto/internal/enrichment/service
            - github.com/thulasiram/oto/internal/notification/service
            - github.com/thulasiram/oto/internal/channels/service
            - github.com/thulasiram/oto/internal/streaming/service
            - github.com/thulasiram/oto/internal/silences/service
            - github.com/thulasiram/oto/internal/stats/service
          deny:
            - pkg: github.com/thulasiram/oto/internal/sources
              desc: "identity MUST NOT import sources internals; declare a port and accept sources/service"
            - pkg: github.com/thulasiram/oto/internal/ingestion
              desc: "identity MUST NOT import ingestion internals; declare a port and accept ingestion/service"
            - pkg: github.com/thulasiram/oto/internal/alerts
              desc: "identity MUST NOT import alerts internals; declare a port and accept alerts/service"
            - pkg: github.com/thulasiram/oto/internal/grouping
              desc: "identity MUST NOT import grouping internals; declare a port and accept grouping/service"
            - pkg: github.com/thulasiram/oto/internal/rules
              desc: "identity MUST NOT import rules internals; declare a port and accept rules/service"
            - pkg: github.com/thulasiram/oto/internal/enrichment
              desc: "identity MUST NOT import enrichment internals; declare a port and accept enrichment/service"
            - pkg: github.com/thulasiram/oto/internal/notification
              desc: "identity MUST NOT import notification internals; declare a port and accept notification/service"
            - pkg: github.com/thulasiram/oto/internal/channels
              desc: "identity MUST NOT import channels internals; declare a port and accept channels/service"
            - pkg: github.com/thulasiram/oto/internal/streaming
              desc: "identity MUST NOT import streaming internals; declare a port and accept streaming/service"
            - pkg: github.com/thulasiram/oto/internal/silences
              desc: "identity MUST NOT import silences internals; declare a port and accept silences/service"
            - pkg: github.com/thulasiram/oto/internal/stats
