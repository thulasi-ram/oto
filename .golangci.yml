            - "**/internal/platform/**"
            - "**/pkg/**"
          deny:
            - pkg: github.com/thulasiram/oto/internal/identity
              desc: "platform MUST NOT import the identity domain"
            - pkg: github.com/thulasiram/oto/internal/sources
              desc: "platform MUST NOT import the sources domain"
            - pkg: github.com/thulasiram/oto/internal/ingestion
              desc: "platform MUST NOT import the ingestion domain"
            - pkg: github.com/thulasiram/oto/internal/alerts
              desc: "platform MUST NOT import the alerts domain"
            - pkg: github.com/thulasiram/oto/internal/grouping
              desc: "platform MUST NOT import the grouping domain"
            - pkg: github.com/thulasiram/oto/internal/rules
              desc: "platform MUST NOT import the rules domain"
            - pkg: github.com/thulasiram/oto/internal/enrichment
              desc: "platform MUST NOT import the enrichment domain"
            - pkg: github.com/thulasiram/oto/internal/notification
              desc: "platform MUST NOT import the notification domain"
            - pkg: github.com/thulasiram/oto/internal/channels
              desc: "platform MUST NOT import the channels domain"
            - pkg: github.com/thulasiram/oto/internal/streaming
              desc: "platform MUST NOT import the streaming domain"
            - pkg: github.com/thulasiram/oto/internal/silences
              desc: "platform MUST NOT import the silences domain"
            - pkg: github.com/thulasiram/oto/internal/stats
              desc: "platform MUST NOT import the stats domain"
            - pkg: github.com/thulasiram/oto/internal/app
              desc: "platform MUST NOT import the wiring layer"

        # R5/§H — Slack is one implementation of the Channel port. Slack types must not
        # leak past the provider and the renderer, or the abstraction is a lie and the
        # generic-webhook provider stops proving anything.
        slack-sdk-is-provider-only:
          list-mode: lax
          files:
            - "**/internal/**"
            - "**/cmd/**"
            - "!**/internal/channels/providers/slack/**"
            - "!**/internal/channels/render/slack/**"
          deny:
            - pkg: github.com/slack-go/slack
              desc: "the Slack SDK is confined to channels/providers/slack and channels/render/slack (R5)"

        # Global state, weak randomness and print debugging do not survive review.
        banned-packages:
          list-mode: lax
          files:
            - "**/internal/**"
            - "**/pkg/**"
            - "**/cmd/**"
          deny:
            - pkg: math/rand
              desc: "use crypto/rand, or platform/id for identifiers"
            - pkg: math/rand/v2
              desc: "use crypto/rand, or platform/id for identifiers"
            - pkg: github.com/pkg/errors
              desc: "use the stdlib errors package plus platform/errs"
            - pkg: io/ioutil
              desc: "deprecated; use io and os"
            - pkg: github.com/sirupsen/logrus
              desc: "logging is log/slog via platform/log"
            - pkg: go.uber.org/zap
              desc: "logging is log/slog via platform/log"

