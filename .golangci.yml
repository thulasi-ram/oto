# golangci-lint v2 configuration.
#
# The depguard block below is not decoration. The layering rules in CONTEXT.md §5
# and the dependency direction in SPEC §I.1 are mechanically enforced here,
# because architecture that is only written down decays within a quarter.
#
# depguard resolves allow/deny by LONGEST PREFIX MATCH, which is what lets a rule
# deny a whole domain and then re-allow that domain's service package.
#
# ------------------------------------------------------------------ THE RULE SET
#
# There are exactly seven layering rules, and they permit exactly what the SPEC
# sanctions and nothing more:
#
#   1. api MUST NOT import repository, and repository MUST NOT import api
#      (CONTEXT.md §5.1).
#   2. domain is pure Go: no net/http, database/sql, pgx, slack-go, chi, squirrel,
#      river, prometheus, otel, platform/db, platform/httpx, platform/jobs,
#      platform/telemetry (CONTEXT.md §5.2).
#   3. A domain reaches another domain ONLY through `<other>/service`, behind an
#      interface the CONSUMER declares (CONTEXT.md §5.4).
#   4. RULE K, the shared domain kernel: `internal/alerts/domain` is the single
#      sanctioned cross-domain `domain` import, for every domain, uniformly
#      (SPEC §C.9, CONTEXT.md §5.2b). It imports no other domain.
#   5. RULE V, the channel-agnostic view: `internal/notification` may import
#      `internal/channels/domain`, because §F.2 has notification/service BUILD
#      `channels/domain.NotificationView`. notification still may not import
#      channels/repository, channels/registry or a provider.
#   6. alerts and ingestion NEVER import notification or channels (SPEC §I.1).
#      RULE K does not weaken this: it grants the kernel to others, not others
#      to alerts.
#   7. platform is not a domain and imports none; the Slack SDK lives only in
#      channels/providers/slack and channels/render/slack.
#
# RULES K AND V ARE GRANTED TO EVERY DOMAIN BLOCK BY THE SAME TEXT. They were
# previously granted ad hoc — ingestion added a one-off allow and grouping routed
# through alerts/service to avoid asking — which is how one architectural rule
# became two incompatible workarounds. A rule that must be re-argued per package
# is a rule that will be re-argued differently per package.
#
# `internal/app` and `cmd` are deliberately outside every cross-domain rule: the
# composition root is the ONE place that is allowed to know every concrete.

version: "2"

run:
  timeout: 5m
  tests: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/thulasiram/oto

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Off: a layering violation and a style nit can land on the same line, and the
  # layering violation is the one that must never be silently swallowed.
  uniq-by-line: false

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive
    - gosec
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - depguard
    - ineffassign
    - unused

  exclusions:
    generated: lax
    rules:
      # Tests may reach anywhere: the arch rules describe production code.
      - path: (_test\.go|^test/)
        linters:
          - depguard
          - gosec
          - errcheck
      - path: doc\.go
        linters:
          - revive

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    staticcheck:
      checks:
        - all
        - -ST1000   # package comments live in doc.go
        - -ST1003   # initialisms; revive owns naming

    gosec:
      excludes:
        - G115      # integer conversion overflow: too noisy on pool sizing
        - G101      # 'credentials' in the compose-default DSN in config.Default()

    revive:
      severity: error
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

    depguard:
      rules:
        # CONTEXT.md §5.1 — api MUST NOT import repository. A handler that reaches
        # into SQL has skipped every invariant the service enforces.
        api-must-not-import-repository:
          list-mode: lax
          files:
            - "**/internal/identity/api/**"
            - "**/internal/sources/api/**"
            - "**/internal/ingestion/api/**"
            - "**/internal/alerts/api/**"
            - "**/internal/grouping/api/**"
            - "**/internal/rules/api/**"
            - "**/internal/enrichment/api/**"
            - "**/internal/notification/api/**"
            - "**/internal/channels/api/**"
            - "**/internal/streaming/api/**"
            - "**/internal/silences/api/**"
            - "**/internal/stats/api/**"
            - "**/internal/drill/api/**"
          deny:
            - pkg: github.com/thulasiram/oto/internal/drill/repository
              desc: "api MUST NOT import repository (drill); call the service"
            - pkg: github.com/thulasiram/oto/internal/identity/repository
              desc: "api MUST NOT import repository (identity); call the service"
            - pkg: github.com/thulasiram/oto/internal/sources/repository
              desc: "api MUST NOT import repository (sources); call the service"
            - pkg: github.com/thulasiram/oto/internal/ingestion/repository
              desc: "api MUST NOT import repository (ingestion); call the service"
            - pkg: github.com/thulasiram/oto/internal/alerts/repository
              desc: "api MUST NOT import repository (alerts); call the service"
            - pkg: github.com/thulasiram/oto/internal/grouping/repository
              desc: "api MUST NOT import repository (grouping); call the service"
            - pkg: github.com/thulasiram/oto/internal/rules/repository
              desc: "api MUST NOT import repository (rules); call the service"
            - pkg: github.com/thulasiram/oto/internal/enrichment/repository
              desc: "api MUST NOT import repository (enrichment); call the service"
            - pkg: github.com/thulasiram/oto/internal/notification/repository
              desc: "api MUST NOT import repository (notification); call the service"
            - pkg: github.com/thulasiram/oto/internal/channels/repository
              desc: "api MUST NOT import repository (channels); call the service"
            - pkg: github.com/thulasiram/oto/internal/streaming/repository
              desc: "api MUST NOT import repository (streaming); call the service"
            - pkg: github.com/thulasiram/oto/internal/silences/repository
              desc: "api MUST NOT import repository (silences); call the service"
            - pkg: github.com/thulasiram/oto/internal/stats/repository
              desc: "api MUST NOT import repository (stats); call the service"

        # CONTEXT.md §5.1 — repository MUST NOT import api. A row struct that knows
        # about a DTO is a row struct that will be shaped by the wire format.
        repository-must-not-import-api:
          list-mode: lax
          files:
            - "**/internal/identity/repository/**"
            - "**/internal/sources/repository/**"
            - "**/internal/ingestion/repository/**"
            - "**/internal/alerts/repository/**"
            - "**/internal/grouping/repository/**"
            - "**/internal/rules/repository/**"
            - "**/internal/enrichment/repository/**"
            - "**/internal/notification/repository/**"
            - "**/internal/channels/repository/**"
            - "**/internal/streaming/repository/**"
            - "**/internal/silences/repository/**"
            - "**/internal/stats/repository/**"
            - "**/internal/drill/repository/**"
          deny:
            - pkg: github.com/thulasiram/oto/internal/drill/api
              desc: "repository MUST NOT import api (drill)"
            - pkg: github.com/thulasiram/oto/internal/identity/api
              desc: "repository MUST NOT import api (identity)"
            - pkg: github.com/thulasiram/oto/internal/sources/api
              desc: "repository MUST NOT import api (sources)"
            - pkg: github.com/thulasiram/oto/internal/ingestion/api
              desc: "repository MUST NOT import api (ingestion)"
            - pkg: github.com/thulasiram/oto/internal/alerts/api
              desc: "repository MUST NOT import api (alerts)"
            - pkg: github.com/thulasiram/oto/internal/grouping/api
              desc: "repository MUST NOT import api (grouping)"
            - pkg: github.com/thulasiram/oto/internal/rules/api
              desc: "repository MUST NOT import api (rules)"
            - pkg: github.com/thulasiram/oto/internal/enrichment/api
              desc: "repository MUST NOT import api (enrichment)"
            - pkg: github.com/thulasiram/oto/internal/notification/api
              desc: "repository MUST NOT import api (notification)"
            - pkg: github.com/thulasiram/oto/internal/channels/api
              desc: "repository MUST NOT import api (channels)"
            - pkg: github.com/thulasiram/oto/internal/streaming/api
              desc: "repository MUST NOT import api (streaming)"
            - pkg: github.com/thulasiram/oto/internal/silences/api
              desc: "repository MUST NOT import api (silences)"
            - pkg: github.com/thulasiram/oto/internal/stats/api
              desc: "repository MUST NOT import api (stats)"

        # CONTEXT.md §5.2 — domain packages are pure Go: entities, invariants and the
        # state machine. NO I/O IMPORTS AT ALL. Ever.
        domain-must-be-pure:
          list-mode: lax
          files:
            - "**/internal/identity/domain/**"
            - "**/internal/sources/domain/**"
            - "**/internal/ingestion/domain/**"
            - "**/internal/alerts/domain/**"
            - "**/internal/grouping/domain/**"
            - "**/internal/rules/domain/**"
            - "**/internal/enrichment/domain/**"
            - "**/internal/notification/domain/**"
            - "**/internal/channels/domain/**"
            - "**/internal/streaming/domain/**"
            - "**/internal/silences/domain/**"
            - "**/internal/stats/domain/**"
            - "**/internal/drill/domain/**"
          allow:
            # THE SHARED DOMAIN KERNEL (rule K below). A domain package may name the
            # kernel's value objects; it may name nothing else outside platform.
            - github.com/thulasiram/oto/internal/alerts/domain
            - github.com/thulasiram/oto/internal/platform/clock
            - github.com/thulasiram/oto/internal/platform/id
            - github.com/thulasiram/oto/internal/platform/errs
          deny:
            - pkg: net/http
              desc: "domain is pure Go: no HTTP"
            - pkg: database/sql
              desc: "domain is pure Go: no SQL"
            - pkg: github.com/jackc/pgx
              desc: "domain is pure Go: no pgx"
            - pkg: github.com/slack-go/slack
              desc: "domain is pure Go: no Slack SDK"
            - pkg: github.com/go-chi/chi
              desc: "domain is pure Go: no router"
            - pkg: github.com/Masterminds/squirrel
              desc: "domain is pure Go: no query builder"
            - pkg: github.com/riverqueue/river
              desc: "domain is pure Go: no job queue"
            - pkg: github.com/prometheus/client_golang
              desc: "domain is pure Go: no metrics client"
            - pkg: go.opentelemetry.io/otel
              desc: "domain is pure Go: no tracing"
            - pkg: github.com/thulasiram/oto/internal/platform/db
              desc: "domain is pure Go: no database access"
            - pkg: github.com/thulasiram/oto/internal/platform/httpx
              desc: "domain is pure Go: no HTTP layer"
            - pkg: github.com/thulasiram/oto/internal/platform/jobs
              desc: "domain is pure Go: no job queue"
            - pkg: github.com/thulasiram/oto/internal/platform/telemetry
              desc: "domain is pure Go: no telemetry"

        # CONTEXT.md §5.4 — identity may not reach into another domain's internals.
